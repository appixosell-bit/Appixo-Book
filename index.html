<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Appixo Book · Consultation</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== RESET & BASE ===== */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            width:100%; height:100%;
            background:#0b1120;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            overflow:hidden;
        }
        /* ===== LOCK OVERLAY ===== */
        .lock-overlay {
            position:fixed; inset:0; z-index:9999;
            display:none;
            justify-content:center; align-items:center;
            background:rgba(11,17,32,0.92);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            padding:20px;
        }
        .lock-overlay.active { display:flex; }
        .lock-card {
            max-width:400px; width:100%;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:40px;
            padding:32px 24px 28px;
            text-align:center;
            box-shadow:0 40px 80px rgba(0,0,0,0.5);
        }
        .lock-logo .logo-main {
            font-size:2.4rem; font-weight:700;
            background:linear-gradient(135deg,#f0e6d3 0%,#c4a882 50%,#f0e6d3 100%);
            background-size:200% auto;
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text;
            animation:shimmer 4s ease-in-out infinite alternate;
            display:inline-block;
            line-height:1.1;
        }
        .lock-logo .logo-sub {
            font-size:1.2rem; font-weight:400;
            color:rgba(255,255,255,0.4);
            letter-spacing:3px;
            display:block;
            margin-top:-4px;
        }
        .lock-logo .logo-tagline {
            font-size:0.65rem; font-weight:500;
            letter-spacing:2px;
            color:rgba(255,255,255,0.2);
            text-transform:uppercase;
            margin-top:6px;
        }
        @keyframes shimmer {
            0% { background-position:0% center; }
            100% { background-position:200% center; }
        }
        .lock-icon {
            font-size:2.2rem; margin:12px 0 8px; display:block;
            animation:pulseLock 2.4s ease-in-out infinite;
        }
        @keyframes pulseLock {
            0%,100% { transform:scale(1); opacity:0.8; }
            50% { transform:scale(1.08); opacity:1; }
        }
        .lock-title { font-size:1.1rem; font-weight:700; color:#fff; margin-bottom:4px; }
        .lock-desc { font-size:0.8rem; color:rgba(255,255,255,0.5); margin-bottom:20px; }
        .lock-input-group { display:flex; flex-direction:column; gap:12px; width:100%; }
        .lock-input-group input {
            width:100%; padding:14px 18px;
            border-radius:60px;
            border:1px solid rgba(255,255,255,0.12);
            background:rgba(255,255,255,0.06);
            color:#fff; font-size:0.95rem; font-weight:500;
            outline:none; transition:all 0.3s ease;
            font-family:inherit;
        }
        .lock-input-group input:focus {
            border-color:#8b5cf6;
            box-shadow:0 0 0 4px rgba(139,92,246,0.3);
            background:rgba(255,255,255,0.08);
        }
        .lock-input-group .lock-btn-unlock {
            width:100%; padding:14px 18px;
            border-radius:60px;
            border:none;
            background:linear-gradient(135deg,#8b5cf6,#6d28d9);
            color:white; font-size:0.95rem; font-weight:700;
            cursor:pointer;
            transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow:0 8px 32px rgba(139,92,246,0.4);
            font-family:inherit;
        }
        .lock-input-group .lock-btn-unlock:hover {
            transform:translateY(-2px) scale(1.02);
            box-shadow:0 12px 48px rgba(139,92,246,0.5);
        }
        .lock-error {
            color:#f87171; font-size:0.8rem; font-weight:500;
            min-height:24px; margin-top:8px;
            opacity:0; transition:opacity 0.3s ease;
        }
        .lock-error.show { opacity:1; }
        .lock-footer {
            margin-top:16px; font-size:0.6rem;
            color:rgba(255,255,255,0.15);
            letter-spacing:0.5px;
        }

        /* ===== BOOK CONTAINER ===== */
        .book-container {
            width:100vw; height:100vh;
            max-width:100%; max-height:100%;
            background:#0b1120;
            display:flex; flex-direction:column;
            position:relative; overflow:hidden;
        }
        .book-container.locked-blur {
            filter:blur(8px) brightness(0.5);
            pointer-events:none; opacity:0.4;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:8px 12px;
            flex-shrink:0;
            background:rgba(11,17,32,0.6);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(255,255,255,0.04);
            z-index:10;
            flex-wrap:wrap;
            gap:4px;
        }
        .top-bar-left {
            display:flex; align-items:center; gap:6px; flex-wrap:wrap;
        }
        .page-indicator {
            display:flex; align-items:center; gap:4px;
            color:#f0f4ff; font-weight:500; font-size:0.75rem;
            background:rgba(255,255,255,0.06);
            padding:4px 10px 4px 8px;
            border-radius:60px;
            border:1px solid rgba(255,255,255,0.06);
        }
        .page-indicator .num {
            background:linear-gradient(135deg,#8b5cf6,#6d28d9);
            color:white;
            padding:2px 10px;
            border-radius:60px;
            font-size:0.9rem; font-weight:700;
            min-width:28px; text-align:center;
            box-shadow:0 4px 16px rgba(139,92,246,0.3);
        }
        .page-indicator .total { color:rgba(255,255,255,0.5); font-weight:400; }
        .page-indicator .label { color:rgba(255,255,255,0.5); font-weight:400; }
        .page-indicator .page-counter { font-size:0.6rem; color:rgba(255,255,255,0.5); }

        .solution-top-controls { display:flex; gap:4px; align-items:center; }
        .solution-top-controls button {
            border:none; border-radius:60px;
            padding:4px 12px;
            font-size:0.65rem; font-weight:600;
            cursor:pointer;
            transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            display:inline-flex; align-items:center; gap:4px;
            white-space:nowrap;
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
            height:28px;
            font-family:inherit;
        }
        .solution-top-controls .btn-show-solution {
            background:linear-gradient(135deg,#22c55e,#16a34a);
            color:white;
            box-shadow:0 4px 16px rgba(34,197,94,0.2);
        }
        .solution-top-controls .btn-hide-solution {
            background:linear-gradient(135deg,#f59e0b,#d97706);
            color:white;
            box-shadow:0 4px 16px rgba(245,158,11,0.2);
        }

        .lang-switch {
            display:flex; gap:2px;
            background:rgba(255,255,255,0.06);
            padding:2px 6px;
            border-radius:60px;
            border:1px solid rgba(255,255,255,0.06);
        }
        .lang-switch button {
            background:transparent; border:none;
            padding:2px 8px;
            border-radius:40px;
            font-weight:600; font-size:0.6rem;
            cursor:pointer; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            color:rgba(255,255,255,0.5);
            font-family:inherit;
            height:22px; display:flex; align-items:center;
        }
        .lang-switch button.active {
            background:linear-gradient(135deg,#8b5cf6,#6d28d9);
            color:white;
            box-shadow:0 4px 16px rgba(139,92,246,0.3);
        }

        /* ===== BOOK VIEW ===== */
        .book-view {
            flex:1; position:relative; width:100%;
            background:#0b1120; overflow:hidden;
            display:flex; justify-content:center; align-items:center;
            min-height:0;
        }
        .page-content {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            background:#0b1120;
            position:relative;
            overflow-y:auto; overflow-x:hidden;
            scroll-behavior:smooth;
        }
        .page-cover {
            width:100%; height:100%;
            display:flex; justify-content:center; align-items:center;
            background:linear-gradient(145deg,#0b1120,#141c2b);
            cursor:pointer;
        }
        .page-cover img.cover-main {
            width:100%; height:100%;
            object-fit:contain;
            display:block; border:none;
        }

        .exercise-zone {
            width:100%; flex:1;
            display:flex; align-items:center; justify-content:center;
            background:#0b1120;
            position:relative; overflow:hidden;
            min-height:0; cursor:pointer;
        }
        .exercise-zone .full-page-image {
            width:100%; height:100%;
            object-fit:contain;
            display:block; background:#0b1120;
        }
        .exercise-zone .image-placeholder {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            color:rgba(255,255,255,0.2);
            font-size:1rem; font-weight:400;
            background:#0b1120;
            gap:10px; padding:16px; text-align:center;
        }
        .exercise-zone .image-placeholder span { font-size:2.6rem; opacity:0.4; }
        .exercise-zone .image-placeholder .hint { font-size:0.8rem; color:rgba(255,255,255,0.2); }

        .click-hint {
            position:absolute; bottom:12px; right:12px;
            background:rgba(0,0,0,0.5);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            color:rgba(255,255,255,0.7);
            padding:4px 10px; border-radius:30px;
            font-size:0.5rem; font-weight:500;
            letter-spacing:0.3px;
            pointer-events:none;
            opacity:0; transition:opacity 0.4s ease;
            border:1px solid rgba(255,255,255,0.06);
        }
        .exercise-zone:hover .click-hint,
        .page-cover:hover .click-hint { opacity:1; }

        /* ===== SOLUTION ZONE ===== */
        .solution-zone-wrapper {
            width:100%; padding:8px 12px 10px;
            background:rgba(255,255,255,0.03);
            border-top:1px solid rgba(255,255,255,0.04);
            transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
            flex-shrink:0; overflow:hidden;
            max-height:400px; opacity:1; transform:scaleY(1);
            transform-origin:top;
        }
        .solution-zone-wrapper.hidden {
            max-height:0; opacity:0; transform:scaleY(0);
            padding:0; border-top:none; pointer-events:none;
        }
        .solution-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
        .solution-header h4 {
            color:#8b5cf6; font-size:0.8rem;
            display:flex; align-items:center; gap:6px;
            font-weight:600;
        }
        .solution-image-container {
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            background:rgba(255,255,255,0.02);
            border-radius:16px; padding:6px;
            min-height:50px;
            border:1px solid rgba(255,255,255,0.04);
            cursor:pointer;
        }
        .solution-image-container .solution-image {
            max-width:100%; max-height:180px;
            object-fit:contain; border-radius:12px;
            border:1px solid rgba(255,255,255,0.04);
            cursor:pointer;
            transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        .solution-image-container .solution-image:hover {
            transform:scale(1.02);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
        }
        .solution-image-container .placeholder {
            color:rgba(255,255,255,0.3);
            font-style:italic; font-weight:400; font-size:0.75rem;
            text-align:center; padding:6px 0;
        }

        /* ===== BOTTOM ACTIONS ===== */
        .bottom-actions {
            display:flex; flex-wrap:wrap;
            justify-content:center; align-items:center;
            gap:6px 8px;
            padding:8px 12px;
            flex-shrink:0;
            background:rgba(11,17,32,0.8);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-top:1px solid rgba(255,255,255,0.04);
            max-height:100px; opacity:1; pointer-events:auto;
            margin:0; border-radius:0;
            box-shadow:0 -4px 32px rgba(0,0,0,0.3);
        }
        .bottom-actions button {
            border:none; border-radius:60px;
            padding:0 16px; height:38px;
            font-size:0.8rem; font-weight:600;
            font-family:inherit;
            cursor:pointer; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            display:inline-flex; align-items:center; justify-content:center;
            gap:4px; color:white;
            min-width:44px; letter-spacing:0.2px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.06);
            box-shadow:0 4px 16px rgba(0,0,0,0.1);
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
        }
        .bottom-actions button .icon { font-size:1rem; line-height:1; }
        .bottom-actions button .label { font-size:0.7rem; font-weight:600; letter-spacing:0.2px; }
        .bottom-actions button:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(0,0,0,0.2);
            background:rgba(255,255,255,0.12);
        }
        .bottom-actions button:active { transform:scale(0.94); }

        .btn-prev, .btn-next {
            background:linear-gradient(135deg,#f59e0b,#d97706) !important;
            border-color:#f59e0b !important;
        }
        .btn-prev:hover, .btn-next:hover {
            box-shadow:0 8px 24px rgba(245,158,11,0.4) !important;
            background:linear-gradient(135deg,#fbbf24,#f59e0b) !important;
        }
        .btn-print {
            background:linear-gradient(135deg,#ec4899,#db2777) !important;
            border-color:#ec4899 !important;
        }
        .btn-print:hover {
            box-shadow:0 8px 24px rgba(236,72,153,0.4) !important;
            background:linear-gradient(135deg,#f472b6,#ec4899) !important;
        }
        .btn-download {
            background:linear-gradient(135deg,#06b6d4,#0891b2) !important;
            border-color:#06b6d4 !important;
        }
        .btn-download:hover {
            box-shadow:0 8px 24px rgba(6,182,212,0.4) !important;
            background:linear-gradient(135deg,#22d3ee,#06b6d4) !important;
        }
        .btn-export {
            background:linear-gradient(135deg,#10b981,#059669) !important;
            border-color:#10b981 !important;
        }
        .btn-export:hover {
            box-shadow:0 8px 24px rgba(16,185,129,0.4) !important;
            background:linear-gradient(135deg,#34d399,#10b981) !important;
        }
        .bottom-actions .separator {
            width:1px; height:26px;
            background:rgba(255,255,255,0.08);
            margin:0 2px;
            flex-shrink:0;
        }

        /* ===== LIGHTBOX ===== */
        .lightbox-overlay {
            position:fixed; inset:0; z-index:2000;
            display:none;
            justify-content:center; align-items:center;
            background:rgba(0,0,0,0.95);
            backdrop-filter:blur(32px);
            -webkit-backdrop-filter:blur(32px);
            padding:0; margin:0;
            opacity:0; transition:opacity 0.4s ease;
            cursor:pointer;
        }
        .lightbox-overlay.open { display:flex; opacity:1; }
        .lightbox-overlay img {
            max-width:98vw; max-height:98vh;
            width:auto; height:auto;
            object-fit:contain;
            border-radius:8px;
            box-shadow:0 40px 120px rgba(0,0,0,0.8);
            border:none; background:transparent;
            padding:0;
            transform:scale(0.95);
            transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            user-select:none; -webkit-user-drag:none;
        }
        .lightbox-overlay.open img { transform:scale(1); }
        .lightbox-overlay .close-btn {
            position:absolute; top:20px; right:28px;
            background:rgba(255,255,255,0.08);
            border:none; color:white; font-size:1.8rem;
            cursor:pointer; transition:all 0.3s ease;
            width:44px; height:44px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.06);
            z-index:2001;
        }
        .lightbox-overlay .close-btn:hover {
            background:rgba(255,255,255,0.15);
            transform:scale(1.06) rotate(90deg);
        }

        /* ===== TOAST ===== */
        .toast {
            position:fixed; bottom:100px; left:50%;
            transform:translateX(-50%) translateY(100px);
            background:rgba(15,23,42,0.92);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            color:white;
            padding:10px 24px;
            border-radius:60px;
            font-weight:600; font-size:0.8rem;
            box-shadow:0 20px 60px rgba(0,0,0,0.4);
            z-index:1000;
            opacity:0; transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);
            border:1px solid rgba(255,255,255,0.06);
            pointer-events:none; max-width:90%;
            font-family:inherit;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast.success { background:rgba(16,185,129,0.92); }
        .toast.error { background:rgba(239,68,68,0.92); }
        .toast.info { background:rgba(59,130,246,0.92); }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            position:fixed; top:0; left:0; width:100%; height:2px;
            background:rgba(139,92,246,0.08);
            z-index:1001; display:none;
        }
        .progress-bar .fill {
            height:100%;
            background:linear-gradient(90deg,#8b5cf6,#6d28d9);
            width:0%;
            transition:width 0.4s ease;
            border-radius:0 2px 2px 0;
            box-shadow:0 0 20px rgba(139,92,246,0.3);
        }
        .progress-bar.active { display:block; }

        .translate-badge {
            position:absolute; top:10px; right:10px;
            background:rgba(139,92,246,0.1);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            padding:2px 10px; border-radius:40px;
            font-size:0.55rem; color:#8b5cf6;
            border:1px solid rgba(139,92,246,0.1);
            pointer-events:none; z-index:5;
            display:flex; align-items:center; gap:4px;
            opacity:0; transition:opacity 0.4s ease;
            font-weight:500;
        }
        .translate-badge.active { opacity:1; }

        .empty-page-placeholder {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            color:rgba(255,255,255,0.2);
            font-size:1.2rem; font-weight:400;
            background:#0b1120;
            gap:10px; padding:16px; text-align:center;
        }
        .empty-page-placeholder span { font-size:2.6rem; opacity:0.4; }

        /* ===== RESPONSIVE ===== */
        @media screen and (max-width:600px) {
            .top-bar { padding:4px 8px; gap:2px; }
            .top-bar-left { gap:4px; }
            .page-indicator { font-size:0.65rem; padding:2px 6px 2px 4px; gap:2px; }
            .page-indicator .num { font-size:0.75rem; padding:1px 6px; min-width:22px; }
            .page-indicator .total { display:none; }
            .page-indicator .label { display:none; }
            .solution-top-controls button { padding:2px 8px; font-size:0.55rem; height:22px; min-width:44px; }
            .lang-switch { padding:2px 4px; }
            .lang-switch button { padding:2px 6px; font-size:0.5rem; height:18px; }
            .bottom-actions { padding:6px 8px; gap:4px 6px; }
            .bottom-actions button { padding:0 12px; height:34px; font-size:0.7rem; min-width:36px; }
            .bottom-actions button .label { display:none; }
            .bottom-actions .separator { height:18px; margin:0 1px; }
            .solution-zone-wrapper { padding:6px 8px 8px; }
            .solution-image-container { min-height:40px; padding:4px; }
            .solution-image-container .solution-image { max-height:120px; }
            .lock-card { padding:24px 16px 20px; }
            .lock-logo .logo-main { font-size:2rem; }
            .lock-logo .logo-sub { font-size:1rem; }
            .lock-icon { font-size:1.8rem; }
            .lock-title { font-size:1rem; }
            .lock-desc { font-size:0.75rem; margin-bottom:16px; }
            .lock-input-group input { padding:10px 14px; font-size:0.85rem; }
            .lock-input-group .lock-btn-unlock { padding:10px 14px; font-size:0.85rem; }
            .toast { font-size:0.7rem; padding:8px 16px; bottom:80px; }
            .lightbox-overlay .close-btn { top:12px; right:12px; width:36px; height:36px; font-size:1.4rem; }
            .click-hint { bottom:8px; right:8px; font-size:0.45rem; padding:2px 8px; }
            .translate-badge { top:6px; right:6px; font-size:0.5rem; padding:2px 8px; }
        }

        @media print {
            .top-bar, .bottom-actions, .progress-bar, .translate-badge, .lightbox-overlay, .lock-overlay { display:none !important; }
            .book-container { background:white !important; }
            .book-container.locked-blur { filter:none !important; pointer-events:auto !important; opacity:1 !important; }
            .page-content { background:white !important; }
            .exercise-zone { background:white !important; }
            .exercise-zone .full-page-image { background:white !important; }
            .solution-zone-wrapper { background:white !important; border-top:1px solid #ccc !important; }
            .solution-image-container .solution-image { border:none !important; }
            .solution-header h4 { -webkit-text-fill-color:#6d28d9 !important; }
        }
    </style>
</head>
<body>

    <!-- ===== LOCK OVERLAY ===== -->
    <div class="lock-overlay" id="lockOverlay">
        <div class="lock-card">
            <div class="lock-logo">
                <span class="logo-main">Appixo</span>
                <span class="logo-sub">Book</span>
                <div class="logo-tagline">✦ Digital Products ✦</div>
            </div>

            // =====================================================

            // =====================================================
            class PersistentStorage {
                constructor() {
                    this.dbName = 'CarnetA4_100_v8';
                    this.storeName = 'pages';
                    this.version = 10;
                    this.db = null;
                    this.ready = false;
                    this.initPromise = null;
                    this.MAX_IMAGES = 100;
                    this.fallbackKey = 'appixo_book_fallback';
                }

                init() {
                    if (this.initPromise) return this.initPromise;
                    this.initPromise = new Promise((resolve) => {
                        try {
                            const request = indexedDB.open(this.dbName, this.version);
                            request.onerror = () => {
                                console.warn('⚠️ IndexedDB indisponible, fallback localStorage');
                                this.ready = false;
                                resolve(false);
                            };
                            request.onsuccess = (e) => {
                                this.db = e.target.result;
                                this.ready = true;
                                console.log('✅ IndexedDB prêt');
                                resolve(true);
                            };
                            request.onupgradeneeded = (e) => {
                                const db = e.target.result;
                                if (!db.objectStoreNames.contains(this.storeName)) {
                                    const store = db.createObjectStore(this.storeName, { keyPath: 'id', autoIncrement: true });
                                    store.createIndex('timestamp', 'timestamp', { unique: false });
                                    store.createIndex('pageIndex', 'pageIndex', { unique: false });
                                } else {
                                    const store = e.target.transaction.objectStore(this.storeName);
                                    if (!store.indexNames.contains('timestamp')) {
                                        store.createIndex('timestamp', 'timestamp', { unique: false });
                                    }
                                    if (!store.indexNames.contains('pageIndex')) {
                                        store.createIndex('pageIndex', 'pageIndex', { unique: false });
                                    }
                                }
                            };
                        } catch (e) {
                            console.warn('⚠️ IndexedDB non supporté, fallback localStorage');
                            this.ready = false;
                            resolve(false);
                        }
                    });
                    return this.initPromise;
                }

                async savePages(pages) {
                    const isReady = await this.init();
                    if (isReady) {
                        try {
                            await this._saveToIndexedDB(pages);
                        } catch (e) {
                            console.warn('⚠️ Sauvegarde IndexedDB échouée, fallback localStorage');
                            this._saveToLocalStorage(pages);
                        }
                    } else {
                        this._saveToLocalStorage(pages);
                    }
                    this._saveToLocalStorage(pages);
                }

                _saveToLocalStorage(pages) {
                    try {
                        localStorage.setItem(this.fallbackKey, JSON.stringify(pages));
                        console.log('💾 Sauvegarde localStorage OK');
                    } catch (e) {
                        console.error('❌ Erreur sauvegarde localStorage:', e);
                    }
                }

                _saveToIndexedDB(pages) {
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readwrite');
                        const store = tx.objectStore(this.storeName);
                        const clearRequest = store.clear();
                        clearRequest.onsuccess = () => {
                            let saved = 0;
                            const total = Math.min(pages.length, this.MAX_IMAGES);
                            for (let i = 0; i < total; i++) {
                                const page = pages[i];
                                const data = {
                                    content: page.content || '',
                                    solution: page.solution || '',
                                    imageData: page.imageData || null,
                                    isCover: page.isCover || false,
                                    timestamp: Date.now() + i,
                                    pageIndex: i
                                };
                                const addRequest = store.add(data);
                                addRequest.onsuccess = () => {
                                    saved++;
                                    if (saved === total) resolve();
                                };
                                addRequest.onerror = (e) => reject(e.target.error);
                            }
                            if (total === 0) resolve();
                        };
                        clearRequest.onerror = (e) => reject(e.target.error);
                    });
                }

                async loadPages() {
                    const isReady = await this.init();
                    if (isReady) {
                        try {
                            const pages = await this._loadFromIndexedDB();
                            if (pages && pages.length > 0) {
                                const hasImages = pages.some(p => p.imageData && p.imageData.startsWith('data:image'));
                                if (hasImages || pages.length > 1) {
                                    return pages;
                                }
                            }
                        } catch (e) {
                            console.warn('⚠️ Chargement IndexedDB échoué, fallback localStorage');
                        }
                    }
                    return this._loadFromLocalStorage();
                }

                _loadFromIndexedDB() {
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readonly');
                        const store = tx.objectStore(this.storeName);
                        const index = store.index('pageIndex');
                        const request = index.getAll();
                        request.onsuccess = () => {
                            const results = request.result;
                            results.sort((a, b) => a.pageIndex - b.pageIndex);
                            const pages = results.map(item => ({
                                content: item.content || '',
                                solution: item.solution || '',
                                imageData: item.imageData || null,
                                isCover: item.isCover || false
                            }));
                            resolve(pages);
                        };
                        request.onerror = (e) => reject(e.target.error);
                    });
                }

                _loadFromLocalStorage() {
                    try {
                        const raw = localStorage.getItem(this.fallbackKey);
                        if (raw) {
                            const pages = JSON.parse(raw);
                            if (Array.isArray(pages) && pages.length > 0) {
                                console.log('📂 Chargé depuis localStorage (' + pages.length + ' pages)');
                                return pages;
                            }
                        }
                    } catch (e) {
                        console.warn('Erreur lecture localStorage:', e);
                    }
                    return [];
                }

                async clear() {
                    const isReady = await this.init();
                    if (isReady) {
                        try { await this._clearIndexedDB(); } catch (e) { /* ignore */ }
                    }
                    localStorage.removeItem(this.fallbackKey);
                }

                _clearIndexedDB() {
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readwrite');
                        const store = tx.objectStore(this.storeName);
                        const request = store.clear();
                        request.onsuccess = () => resolve();
                        request.onerror = (e) => reject(e.target.error);
                    });
                }

                        </div>
                    `;

                const solutionImg = document.querySelector('.solution-image-container .solution-image');
                if (solutionImg && !solutionImg.hasAttribute('onclick')) {
                    const src = solutionImg.getAttribute('src');
                    if (src) {
                        solutionImg.style.cursor = 'pointer';
                        solutionImg.addEventListener('click', function(e) {
                            e.stopPropagation();
                            openLightbox(src);
                        });
                    }
                }

                translateBadge.classList.remove('active');
                updateNavButtons();
            }

            function updateNavButtons() {
                if (pages.length === 0) { prevBtn.disabled = true; nextBtn.disabled = true; return; }
                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex === pages.length - 1);
            }

            function goToPrev() {
                if (pages.length === 0 || currentIndex === 0) return;
                currentIndex--;
                solutionVisible = false;
                renderCurrentPage();
                updateSolutionButtons();
            }
            function goToNext() {
                if (pages.length === 0 || currentIndex === pages.length - 1) return;
                currentIndex++;
                solutionVisible = false;
                renderCurrentPage();
                updateSolutionButtons();
            }

            // --- Print ---
            function printCurrentPage() { window.print(); }

            // --- Download ---
            function downloadCurrentPage() {
                if (pages.length === 0) { showToast(t('noPage'), 'error'); return; }
                const page = pages[currentIndex];
                if (!page || (!page.imageData && !page.solution && !page.isCover)) {
                    showToast(t('noImage'), 'info');
                    return;
                }

                let bodyContent = '';
                if (currentIndex === 0) {
                    const imgSrc = page.imageData || DEFAULT_COVER;
                    bodyContent = `
                            <div style="width:21cm;height:29.7cm;margin:0;padding:0;display:flex;justify-content:center;align-items:center;background:white;overflow:hidden;">
                                <img src="${imgSrc}" style="width:100%;height:100%;object-fit:contain;" />
                            </div>
                        `;
                } else {
                    const hasSolution = page.solution && page.solution.includes('<img');
                    const solHtml = hasSolution ? page.solution :
                        `<p style="color:#999;font-style:italic;text-align:center;">${t('noSolution')}</p>`;

                    const hasImage = page.imageData && page.imageData.length > 100 && page.imageData.startsWith('data:image');
                    const imgHtml = hasImage ?
                        `<img src="${page.imageData}" style="width:100%;height:100%;object-fit:contain;display:block;border:none;border-radius:0;" />` :
                        `<div style="width:100%;height:100%;display:flex;justify-content:center;align-items:center;color:#c5d0e0;font-size:1.2rem;font-style:italic;">${t('noImagePage')}</div>`;

                    bodyContent = `
                            <div style="width:21cm;min-height:29.7cm;margin:0 auto;padding:0;background:white;display:flex;flex-direction:column;box-sizing:border-box;font-family:system-ui,sans-serif;">
                                <div style="padding:0;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;">
                                    ${imgHtml}
                                </div>
                                <div style="padding:12px 16px;flex:0 0 auto;background:white;border-top:1px solid #e0e0e0;">
                                    <h4 style="color:#6d28d9;font-size:1rem;margin-bottom:8px;font-weight:700;">💡 ${t('solutionTitle')}</h4>
                                    <div style="display:flex;justify-content:center;align-items:center;">
                                        ${solHtml}
                                    </div>
                                </div>
                            </div>
                        `;
                }

                const htmlContent = `
                        <!DOCTYPE html>
                        <html>
                        <head><meta charset="UTF-8"><title>Page ${currentIndex+1}</title>
                        <style>
                            * { margin:0; padding:0; box-sizing:border-box; }
                            body { background:white; margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:system-ui,sans-serif; }
                            @page { margin:0; size:A4; }
                            .download-a4 { width:21cm; min-height:29.7cm; margin:0 auto; padding:0; background:white; display:flex; flex-direction:column; box-sizing:border-box; font-family:system-ui,sans-serif; }
                            .download-a4 .exercise-zone { padding:0; flex:1; border-bottom:none; background:white; display:flex; align-items:center; justify-content:center; overflow:hidden; }
                            .download-a4 .exercise-zone img { width:100%; height:100%; object-fit:contain; display:block; border:none; border-radius:0; }
                            .download-a4 .solution-zone-wrapper { padding:12px 16px; flex:0 0 auto; background:white; border-top:1px solid #e0e0e0; }
                            .download-a4 .solution-zone-wrapper img { max-width:100%; max-height:45vh; object-fit:contain; display:block; margin:0 auto; border:none; border-radius:8px; }
                            .download-a4 .solution-zone-wrapper .placeholder { color:#c5d0e0; font-style:italic; text-align:center; }
                            .download-a4 .solution-header h4 { color:#6d28d9; font-size:1rem; margin-bottom:8px; font-weight:700; }
                            .cover-a4 { width:21cm; height:29.7cm; margin:0; padding:0; display:flex; justify-content:center; align-items:center; background:white; overflow:hidden; }
                            .cover-a4 img { width:100%; height:100%; object-fit:contain; }
                            .click-hint { display:none !important; }
                        </style>
                        </head>
                        <body>
                            ${currentIndex === 0 ? `<div class="cover-a4"><img src="${page.imageData || DEFAULT_COVER}" /></div>` : bodyContent}
                        </body>
                        </html>
                    `;

                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `page-${currentIndex+1}-A4.html`;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('⬇️ Téléchargement A4 démarré', 'success');
            }

            // --- Sauvegarde ---
            async function sauvegarderEtat() {
                await storage.savePages(pages);
                try {
                    const meta = {
                        currentIndex: currentIndex,
                        lang: currentLang,
                        pageCount: pages.length,
                        solutionVisible: solutionVisible,
                        timestamp: Date.now()
                    };
                    localStorage.setItem('carnetMeta_100_v5', JSON.stringify(meta));
                } catch (e) { /* ignore */ }
                console.log('💾 Sauvegarde effectuée');
            }

            // --- Chargement ---
            async function loadState() {
                let loadedPages = await storage.loadPages();
                if (loadedPages && loadedPages.length > 0) {
                    pages = loadedPages;
                    const meta = localStorage.getItem('carnetMeta_100_v5');
                    if (meta) {
                        try {
                            const parsed = JSON.parse(meta);
                            currentIndex = (parsed.currentIndex !== undefined && parsed.currentIndex < pages.length) ?
                                parsed.currentIndex : 0;
                            if (parsed.lang) currentLang = parsed.lang;
                            if (parsed.solutionVisible !== undefined) solutionVisible = parsed.solutionVisible;
                        } catch (e) { /* ignore */ }
                    }
                    if (pages.length > 0) pages[0].isCover = true;
                    return true;
                }
                return false;
            }

            // --- Chargement depuis paramètre URL ---
            function loadFromURLParam() {
                const urlParams = new URLSearchParams(window.location.search);
                const dataParam = urlParams.get('data');
                if (!dataParam) return false;

                try {
                    const decoded = atob(dataParam);
                    const parsed = JSON.parse(decoded);
                    if (!parsed.pages || !Array.isArray(parsed.pages)) {
                        throw new Error('Format invalide');
                    }
                    pages = parsed.pages;
                    if (parsed.currentIndex !== undefined && parsed.currentIndex < pages.length) {
                        currentIndex = parsed.currentIndex;
                    } else {
                        currentIndex = 0;
                    }
                    if (parsed.lang) currentLang = parsed.lang;
                    if (parsed.solutionVisible !== undefined) solutionVisible = parsed.solutionVisible;
                    if (pages.length > 0) pages[0].isCover = true;

                    sauvegarderEtat().then(() => {
                        showToast(t('dataLoaded'), 'success');
                        renderCurrentPage();
                        updateUILanguage();
                        updateSolutionButtons();
                    });
                    return true;
                } catch (e) {
                    console.error('Erreur chargement paramètre URL:', e);
                    showToast(t('dataLoadError'), 'error');
                    return false;
                }
            }

            // --- Swipe ---
            let startX = 0, isSwiping = false;
            function handleTouchStart(e) { const touch = e.touches[0]; startX = touch.clientX; isSwiping = true; }
            function handleTouchEnd(e) {
                if (!isSwiping) return;
                isSwiping = false;
                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;
                if (Math.abs(diff) > 40) { diff > 0 ? goToNext() : goToPrev(); }
            }
            let mouseDown = false, mouseStartX = 0;
            function handleMouseDown(e) { mouseDown = true; mouseStartX = e.clientX; }
            function handleMouseUp(e) {
                if (!mouseDown) return;
                mouseDown = false;
                const diff = mouseStartX - e.clientX;
                if (Math.abs(diff) > 40) { diff > 0 ? goToNext() : goToPrev(); }
            }

            // --- INIT ---
            async function initBook() {
                showLockOverlay();

                const loadedFromParam = loadFromURLParam();

                if (!loadedFromParam) {
                    const loaded = await loadState();
                    if (!loaded) {
                        pages = [{ content: '', solution: '', imageData: null, isCover: true }];
                        currentIndex = 0;
                        solutionVisible = false;
                        await storage.savePages(pages);
                    }
                }

                document.querySelectorAll('.lang-switch button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === currentLang);
                });
                updateUILanguage();
                renderCurrentPage();
                updateSolutionButtons();

                bookView.addEventListener('touchstart', handleTouchStart, { passive: true });
                bookView.addEventListener('touchend', handleTouchEnd, { passive: true });
                bookView.addEventListener('mousedown', handleMouseDown);
                bookView.addEventListener('mouseup', handleMouseUp);
                bookView.addEventListener('mouseleave', () => { mouseDown = false; });

                showSolutionTopBtn.addEventListener('click', function() { toggleSolutionFromTop(true); });
                hideSolutionTopBtn.addEventListener('click', function() { toggleSolutionFromTop(false); });

                lockUnlockBtn.addEventListener('click', attemptUnlock);
                lockPassword.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); attemptUnlock(); }
                });

                lightboxCloseBtn.addEventListener('click', closeLightbox);
                lightboxOverlay.addEventListener('click', function(e) {
                    if (e.target === this || e.target === lightboxImage) {
                        closeLightbox();
                    }
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') closeLightbox();
                });

                prevBtn.addEventListener('click', goToPrev);
                nextBtn.addEventListener('click', goToNext);
                printBtn.addEventListener('click', printCurrentPage);
                downloadBtn.addEventListener('click', downloadCurrentPage);

                document.getElementById('langFr').addEventListener('click', () => setLanguage('fr'));
                document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));
                document.getElementById('langAr').addEventListener('click', () => setLanguage('ar'));

                exportBtn.addEventListener('click', exportData);

                const stats = await storage.loadPages();
                console.log('📊 Nombre de pages chargées:', stats.length);
            }

            initBook();
            console.log('📖 Appixo Book · Consultation v2.3 · Mobile-friendly');
        })();
    </script>
</body>
</html>
