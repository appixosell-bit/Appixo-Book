<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Appixo Book · Consultation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== LOCK OVERLAY ===== -->
    <div class="lock-overlay" id="lockOverlay">
        <div class="lock-card">
            <div class="lock-logo">
                <span class="logo-main">Appixo</span>
                <span class="logo-sub">Book</span>
                <div class="logo-tagline">✦ Digital Products ✦</div>
            </div>
            <span class="lock-icon">🔒</span>
            <h2 class="lock-title">Accès au carnet</h2>
            <p class="lock-desc">Entrez le mot de passe pour consulter</p>
            <div class="lock-input-group">
                <input type="password" id="lockPassword" placeholder="Mot de passe" autocomplete="current-password">
                <button class="lock-btn-unlock" id="lockUnlockBtn">Déverrouiller</button>
            </div>
            <p class="lock-error" id="lockError">❌ Mot de passe incorrect</p>
            <div class="lock-footer">Appixo Book &bull; v2.0</div>
        </div>
    </div>

    <!-- ===== PROGRESS BAR ===== -->
    <div class="progress-bar" id="progressBar">
        <div class="fill" id="progressFill"></div>
    </div>

    <!-- ===== BOOK CONTAINER ===== -->
    <div class="book-container" id="bookContainer">

        <!-- TOP BAR -->
        <div class="top-bar" id="topBar">
            <div class="top-bar-left">
                <div class="page-indicator">
                    <span class="num" id="pageNum">1</span>
                    <span class="total" id="pageTotal">/ 1</span>
                    <span class="label" id="pageLabel">Page</span>
                    <span class="page-counter" id="pageCounter">(0/100)</span>
                </div>
                <div class="solution-top-controls" id="solutionTopControls">
                    <button class="btn-show-solution" id="showSolutionTopBtn">👁️ Afficher la solution</button>
                    <button class="btn-hide-solution" id="hideSolutionTopBtn" style="display:none;">🔽 Masquer la solution</button>
                </div>
            </div>
            <div class="lang-switch">
                <button class="active" data-lang="fr" id="langFr">🇫🇷</button>
                <button data-lang="en" id="langEn">🇬🇧</button>
                <button data-lang="ar" id="langAr">🇸🇦</button>
            </div>
        </div>

        <!-- VIEW -->
        <div class="book-view" id="bookView">
            <div class="page-wrapper" id="pageWrapper">
                <div class="page-content" id="pageContent">
                    <div class="translate-badge" id="translateBadge">🌐 Traduit</div>
                </div>
            </div>
        </div>

        <!-- BOTTOM ACTIONS (consultation) -->
        <div class="bottom-actions" id="bottomActions">
            <button class="btn-prev" id="prevPageBtn">
                <span class="icon">◀</span>
                <span class="label" id="prevText">Préc.</span>
            </button>
            <button class="btn-next" id="nextPageBtn">
                <span class="icon">▶</span>
                <span class="label" id="nextText">Suiv.</span>
            </button>

            <div class="separator"></div>

            <button class="btn-download" id="downloadPageBtn">
                <span class="icon">⬇️</span>
                <span class="label" id="downloadText">Téléch.</span>
            </button>
            <button class="btn-print" id="printPageBtn">
                <span class="icon">🖨️</span>
                <span class="label" id="printText">Imprimer</span>
            </button>

            <div class="separator"></div>

            <button class="btn-export" id="exportBtn">
                <span class="icon">💾</span>
                <span class="label" id="exportText">Sauvegarder</span>
            </button>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== LIGHTBOX ===== -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <button class="close-btn" id="lightboxCloseBtn">✕</button>
        <img id="lightboxImage" src="" alt="Image agrandie">
    </div>

    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script src="script.js"></script>
</body>
</html>
