<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Appixo Book · Carnet</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== RESET & BASE ===== */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            width:100%; height:100%;
            background:#0b1120;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            overflow:hidden;
        }

        /* ===== LOCK OVERLAY ===== */
        .lock-overlay {
            position:fixed; inset:0; z-index:9999;
            display:none;
            justify-content:center; align-items:center;
            background:rgba(11,17,32,0.92);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            padding:20px;
        }
        .lock-overlay.active { display:flex; }
        .lock-card {
            max-width:400px; width:100%;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:40px;
            padding:32px 24px 28px;
            text-align:center;
            box-shadow:0 40px 80px rgba(0,0,0,0.5);
        }
        .lock-logo .logo-main {
            font-size:2.4rem; font-weight:700;
            background:linear-gradient(135deg,#f0e6d3 0%,#c4a882 50%,#f0e6d3 100%);
            background-size:200% auto;
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text;
            animation:shimmer 4s ease-in-out infinite alternate;
            display:inline-block;
            line-height:1.1;
        }
        .lock-logo .logo-sub {
            font-size:1.2rem; font-weight:400;
            color:rgba(255,255,255,0.4);
            letter-spacing:3px;
            display:block;
            margin-top:-4px;
        }
        .lock-logo .logo-tagline {
            font-size:0.65rem; font-weight:500;
            letter-spacing:2px;
            color:rgba(255,255,255,0.2);
            text-transform:uppercase;
            margin-top:6px;
        }
        @keyframes shimmer {
            0% { background-position:0% center; }
            100% { background-position:200% center; }
        }
        .lock-icon {
            font-size:2.2rem; margin:12px 0 8px; display:block;
            animation:pulseLock 2.4s ease-in-out infinite;
        }
        @keyframes pulseLock {
            0%,100% { transform:scale(1); opacity:0.8; }
            50% { transform:scale(1.08); opacity:1; }
        }
        .lock-title { font-size:1.1rem; font-weight:700; color:#fff; margin-bottom:4px; }
        .lock-desc { font-size:0.8rem; color:rgba(255,255,255,0.5); margin-bottom:20px; }
        .lock-input-group { display:flex; flex-direction:column; gap:12px; width:100%; }
        .lock-input-group input {
            width:100%; padding:14px 18px;
            border-radius:60px;
            border:1px solid rgba(255,255,255,0.12);
            background:rgba(255,255,255,0.06);
            color:#fff; font-size:0.95rem; font-weight:500;
            outline:none; transition:all 0.3s ease;
            font-family:inherit;
        }
        .lock-input-group input:focus {
            border-color:#8b5cf6;
            box-shadow:0 0 0 4px rgba(139,92,246,0.3);
            background:rgba(255,255,255,0.08);
        }
        .lock-input-group .lock-btn-unlock {
            width:100%; padding:14px 18px;
            border-radius:60px;
            border:none;
            background:linear-gradient(135deg,#8b5cf6,#6d28d9);
            color:white; font-size:0.95rem; font-weight:700;
            cursor:pointer;
            transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow:0 8px 32px rgba(139,92,246,0.4);
            font-family:inherit;
        }
        .lock-input-group .lock-btn-unlock:hover {
            transform:translateY(-2px) scale(1.02);
            box-shadow:0 12px 48px rgba(139,92,246,0.5);
        }
        .lock-error {
            color:#f87171; font-size:0.8rem; font-weight:500;
            min-height:24px; margin-top:8px;
            opacity:0; transition:opacity 0.3s ease;
        }
        .lock-error.show { opacity:1; }
        .lock-footer {
            margin-top:16px; font-size:0.6rem;
            color:rgba(255,255,255,0.15);
            letter-spacing:0.5px;
        }

        /* ===== BOOK CONTAINER ===== */
        .book-container {
            width:100vw; height:100vh;
            max-width:100%; max-height:100%;
            background:#0b1120;
            display:flex; flex-direction:column;
            position:relative; overflow:hidden;
        }
        .book-container.locked-blur {
            filter:blur(8px) brightness(0.5);
            pointer-events:none; opacity:0.4;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:8px 12px;
            flex-shrink:0;
            background:rgba(11,17,32,0.6);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(255,255,255,0.04);
            z-index:10;
            flex-wrap:wrap;
            gap:4px;
        }
        .top-bar-left {
            display:flex; align-items:center; gap:6px; flex-wrap:wrap;
        }
        .page-indicator {
            display:flex; align-items:center; gap:4px;
            color:#f0f4ff; font-weight:500; font-size:0.75rem;
            background:rgba(255,255,255,0.06);
            padding:4px 10px 4px 8px;
            border-radius:60px;
            border:1px solid rgba(255,255,255,0.06);
        }
        .page-indicator .num {
            background:linear-gradient(135deg,#8b5cf6,#6d28d9);
            color:white;
            padding:2px 10px;
            border-radius:60px;
            font-size:0.9rem; font-weight:700;
            min-width:28px; text-align:center;
            box-shadow:0 4px 16px rgba(139,92,246,0.3);
        }
        .page-indicator .total { color:rgba(255,255,255,0.5); font-weight:400; }
        .page-indicator .label { color:rgba(255,255,255,0.5); font-weight:400; }
        .page-indicator .page-counter { font-size:0.6rem; color:rgba(255,255,255,0.5); }

        .lang-switch {
            display:flex; gap:2px;
            background:rgba(255,255,255,0.06);
            padding:2px 6px;
            border-radius:60px;
            border:1px solid rgba(255,255,255,0.06);
        }
        .lang-switch button {
            background:transparent; border:none;
            padding:2px 8px;
            border-radius:40px;
            font-weight:600; font-size:0.6rem;
            cursor:pointer; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            color:rgba(255,255,255,0.5);
            font-family:inherit;
            height:22px; display:flex; align-items:center;
        }
        .lang-switch button.active {
            background:linear-gradient(135deg,#8b5cf6,#6d28d9);
            color:white;
            box-shadow:0 4px 16px rgba(139,92,246,0.3);
        }

        /* ===== BOOK VIEW ===== */
        .book-view {
            flex:1; position:relative; width:100%;
            background:#0b1120; overflow:hidden;
            display:flex; justify-content:center; align-items:center;
            min-height:0;
        }
        .page-content {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            background:#0b1120;
            position:relative;
            overflow-y:auto; overflow-x:hidden;
            scroll-behavior:smooth;
        }

        .exercise-zone {
            width:100%; flex:1;
            display:flex; align-items:center; justify-content:center;
            background:#0b1120;
            position:relative; overflow:hidden;
            min-height:0; cursor:pointer;
        }
        .exercise-zone .full-page-image {
            width:100%; height:100%;
            object-fit:contain;
            display:block; background:#0b1120;
        }
        .exercise-zone .image-placeholder {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            color:rgba(255,255,255,0.2);
            font-size:1rem; font-weight:400;
            background:#0b1120;
            gap:10px; padding:16px; text-align:center;
        }
        .exercise-zone .image-placeholder span { font-size:2.6rem; opacity:0.4; }
        .exercise-zone .image-placeholder .hint { font-size:0.8rem; color:rgba(255,255,255,0.2); }

        .click-hint {
            position:absolute; bottom:12px; right:12px;
            background:rgba(0,0,0,0.5);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            color:rgba(255,255,255,0.7);
            padding:4px 10px; border-radius:30px;
            font-size:0.5rem; font-weight:500;
            letter-spacing:0.3px;
            pointer-events:none;
            opacity:0; transition:opacity 0.4s ease;
            border:1px solid rgba(255,255,255,0.06);
        }
        .exercise-zone:hover .click-hint { opacity:1; }

        /* ===== BOTTOM ACTIONS ===== */
        .bottom-actions {
            display:flex; flex-wrap:wrap;
            justify-content:center; align-items:center;
            gap:6px 8px;
            padding:8px 12px;
            flex-shrink:0;
            background:rgba(11,17,32,0.8);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-top:1px solid rgba(255,255,255,0.04);
            max-height:100px; opacity:1; pointer-events:auto;
            margin:0; border-radius:0;
            box-shadow:0 -4px 32px rgba(0,0,0,0.3);
        }
        .bottom-actions button {
            border:none; border-radius:60px;
            padding:0 16px; height:38px;
            font-size:0.8rem; font-weight:600;
            font-family:inherit;
            cursor:pointer; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            display:inline-flex; align-items:center; justify-content:center;
            gap:4px; color:white;
            min-width:44px; letter-spacing:0.2px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.06);
            box-shadow:0 4px 16px rgba(0,0,0,0.1);
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
        }
        .bottom-actions button .icon { font-size:1rem; line-height:1; }
        .bottom-actions button .label { font-size:0.7rem; font-weight:600; letter-spacing:0.2px; }
        .bottom-actions button:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(0,0,0,0.2);
            background:rgba(255,255,255,0.12);
        }
        .bottom-actions button:active { transform:scale(0.94); }

        .btn-prev, .btn-next {
            background:linear-gradient(135deg,#f59e0b,#d97706) !important;
            border-color:#f59e0b !important;
        }
        .btn-prev:hover, .btn-next:hover {
            box-shadow:0 8px 24px rgba(245,158,11,0.4) !important;
            background:linear-gradient(135deg,#fbbf24,#f59e0b) !important;
        }
        .btn-print {
            background:linear-gradient(135deg,#ec4899,#db2777) !important;
            border-color:#ec4899 !important;
        }
        .btn-print:hover {
            box-shadow:0 8px 24px rgba(236,72,153,0.4) !important;
            background:linear-gradient(135deg,#f472b6,#ec4899) !important;
        }
        .btn-download {
            background:linear-gradient(135deg,#06b6d4,#0891b2) !important;
            border-color:#06b6d4 !important;
        }
        .btn-download:hover {
            box-shadow:0 8px 24px rgba(6,182,212,0.4) !important;
            background:linear-gradient(135deg,#22d3ee,#06b6d4) !important;
        }
        .btn-add {
            background:linear-gradient(135deg,#22c55e,#16a34a) !important;
            border-color:#22c55e !important;
        }
        .btn-add:hover {
            box-shadow:0 8px 24px rgba(34,197,94,0.4) !important;
            background:linear-gradient(135deg,#4ade80,#22c55e) !important;
        }
        .btn-save {
            background:linear-gradient(135deg,#8b5cf6,#6d28d9) !important;
            border-color:#8b5cf6 !important;
        }
        .btn-save:hover {
            box-shadow:0 8px 24px rgba(139,92,246,0.4) !important;
            background:linear-gradient(135deg,#a78bfa,#8b5cf6) !important;
        }
        .btn-lock {
            background:linear-gradient(135deg,#f59e0b,#d97706) !important;
            border-color:#f59e0b !important;
        }
        .btn-lock:hover {
            box-shadow:0 8px 24px rgba(245,158,11,0.4) !important;
            background:linear-gradient(135deg,#fbbf24,#f59e0b) !important;
        }
        .btn-lock.locked {
            background:linear-gradient(135deg,#22c55e,#16a34a) !important;
            border-color:#22c55e !important;
        }
        .btn-lock.locked:hover {
            box-shadow:0 8px 24px rgba(34,197,94,0.4) !important;
            background:linear-gradient(135deg,#4ade80,#22c55e) !important;
        }
        .bottom-actions .separator {
            width:1px; height:26px;
            background:rgba(255,255,255,0.08);
            margin:0 2px;
            flex-shrink:0;
        }

        /* Admin buttons disabled when locked */
        .bottom-actions.locked .btn-add,
        .bottom-actions.locked .btn-save {
            opacity:0.35;
            pointer-events:none;
            filter:grayscale(0.5);
        }

        /* ===== LIGHTBOX ===== */
        .lightbox-overlay {
            position:fixed; inset:0; z-index:2000;
            display:none;
            justify-content:center; align-items:center;
            background:rgba(0,0,0,0.95);
            backdrop-filter:blur(32px);
            -webkit-backdrop-filter:blur(32px);
            padding:0; margin:0;
            opacity:0; transition:opacity 0.4s ease;
            cursor:pointer;
        }
        .lightbox-overlay.open { display:flex; opacity:1; }
        .lightbox-overlay img {
            max-width:98vw; max-height:98vh;
            width:auto; height:auto;
            object-fit:contain;
            border-radius:8px;
            box-shadow:0 40px 120px rgba(0,0,0,0.8);
            border:none; background:transparent;
            padding:0;
            transform:scale(0.95);
            transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            user-select:none; -webkit-user-drag:none;
        }
        .lightbox-overlay.open img { transform:scale(1); }
        .lightbox-overlay .close-btn {
            position:absolute; top:20px; right:28px;
            background:rgba(255,255,255,0.08);
            border:none; color:white; font-size:1.8rem;
            cursor:pointer; transition:all 0.3s ease;
            width:44px; height:44px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.06);
            z-index:2001;
        }
        .lightbox-overlay .close-btn:hover {
            background:rgba(255,255,255,0.15);
            transform:scale(1.06) rotate(90deg);
        }

        /* ===== TOAST ===== */
        .toast {
            position:fixed; bottom:100px; left:50%;
            transform:translateX(-50%) translateY(100px);
            background:rgba(15,23,42,0.92);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            color:white;
            padding:10px 24px;
            border-radius:60px;
            font-weight:600; font-size:0.8rem;
            box-shadow:0 20px 60px rgba(0,0,0,0.4);
            z-index:1000;
            opacity:0; transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);
            border:1px solid rgba(255,255,255,0.06);
            pointer-events:none; max-width:90%;
            font-family:inherit;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast.success { background:rgba(16,185,129,0.92); }
        .toast.error { background:rgba(239,68,68,0.92); }
        .toast.info { background:rgba(59,130,246,0.92); }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            position:fixed; top:0; left:0; width:100%; height:2px;
            background:rgba(139,92,246,0.08);
            z-index:1001; display:none;
        }
        .progress-bar .fill {
            height:100%;
            background:linear-gradient(90deg,#8b5cf6,#6d28d9);
            width:0%;
            transition:width 0.4s ease;
            border-radius:0 2px 2px 0;
            box-shadow:0 0 20px rgba(139,92,246,0.3);
        }
        .progress-bar.active { display:block; }

        .translate-badge {
            position:absolute; top:10px; right:10px;
            background:rgba(139,92,246,0.1);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            padding:2px 10px; border-radius:40px;
            font-size:0.55rem; color:#8b5cf6;
            border:1px solid rgba(139,92,246,0.1);
            pointer-events:none; z-index:5;
            display:flex; align-items:center; gap:4px;
            opacity:0; transition:opacity 0.4s ease;
            font-weight:500;
        }
        .translate-badge.active { opacity:1; }

        .empty-page-placeholder {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            color:rgba(255,255,255,0.2);
            font-size:1.2rem; font-weight:400;
            background:#0b1120;
            gap:10px; padding:16px; text-align:center;
        }
        .empty-page-placeholder span { font-size:2.6rem; opacity:0.4; }

        /* ===== RESPONSIVE ===== */
        @media screen and (max-width:600px) {
            .top-bar { padding:4px 8px; gap:2px; }
            .top-bar-left { gap:4px; }
            .page-indicator { font-size:0.65rem; padding:2px 6px 2px 4px; gap:2px; }
            .page-indicator .num { font-size:0.75rem; padding:1px 6px; min-width:22px; }
            .page-indicator .total { display:none; }
            .page-indicator .label { display:none; }
            .lang-switch { padding:2px 4px; }
            .lang-switch button { padding:2px 6px; font-size:0.5rem; height:18px; }
            .bottom-actions { padding:6px 8px; gap:4px 6px; }
            .bottom-actions button { padding:0 12px; height:34px; font-size:0.7rem; min-width:36px; }
            .bottom-actions button .label { display:none; }
            .bottom-actions .separator { height:18px; margin:0 1px; }
            .lock-card { padding:24px 16px 20px; }
            .lock-logo .logo-main { font-size:2rem; }
            .lock-logo .logo-sub { font-size:1rem; }
            .lock-icon { font-size:1.8rem; }
            .lock-title { font-size:1rem; }
            .lock-desc { font-size:0.75rem; margin-bottom:16px; }
            .lock-input-group input { padding:10px 14px; font-size:0.85rem; }
            .lock-input-group .lock-btn-unlock { padding:10px 14px; font-size:0.85rem; }
            .toast { font-size:0.7rem; padding:8px 16px; bottom:80px; }
            .lightbox-overlay .close-btn { top:12px; right:12px; width:36px; height:36px; font-size:1.4rem; }
            .click-hint { bottom:8px; right:8px; font-size:0.45rem; padding:2px 8px; }
            .translate-badge { top:6px; right:6px; font-size:0.5rem; padding:2px 8px; }
        }

        @media print {
            .top-bar, .bottom-actions, .progress-bar, .translate-badge, .lightbox-overlay, .lock-overlay { display:none !important; }
            .book-container { background:white !important; }
            .book-container.locked-blur { filter:none !important; pointer-events:auto !important; opacity:1 !important; }
            .page-content { background:white !important; }
            .exercise-zone { background:white !important; }
            .exercise-zone .full-page-image { background:white !important; }
        }
    </style>
</head>
<body>

    <!-- ===== LOCK OVERLAY ===== -->
    <div class="lock-overlay" id="lockOverlay">
        <div class="lock-card">
            <div class="lock-logo">
                <span class="logo-main">Appixo</span>
                <span class="logo-sub">Book</span>
                <div class="logo-tagline">✦ Digital Products ✦</div>
            </div>
            <span class="lock-icon">🔒</span>
            <h2 class="lock-title">Accès administrateur</h2>
            <p class="lock-desc">Entrez le mot de passe pour modifier le carnet</p>
            <div class="lock-input-group">
                <input type="password" id="lockPassword" placeholder="Mot de passe" autocomplete="current-password">
                <button class="lock-btn-unlock" id="lockUnlockBtn">Déverrouiller</button>
            </div>
            <p class="lock-error" id="lockError">❌ Mot de passe incorrect</p>
            <div class="lock-footer">Appixo Book &bull; v3.0</div>
        </div>
    </div>

    <!-- ===== PROGRESS BAR ===== -->
    <div class="progress-bar" id="progressBar">
        <div class="fill" id="progressFill"></div>
    </div>

    <!-- ===== BOOK CONTAINER ===== -->
    <div class="book-container" id="bookContainer">

        <!-- TOP BAR -->
        <div class="top-bar" id="topBar">
            <div class="top-bar-left">
                <div class="page-indicator">
                    <span class="num" id="pageNum">1</span>
                    <span class="total" id="pageTotal">/ 1</span>
                    <span class="label" id="pageLabel">Page</span>
                    <span class="page-counter" id="pageCounter">(0/100)</span>
                </div>
            </div>
            <div class="lang-switch">
                <button class="active" data-lang="fr" id="langFr">🇫🇷</button>
                <button data-lang="en" id="langEn">🇬🇧</button>
                <button data-lang="ar" id="langAr">🇸🇦</button>
            </div>
        </div>

        <!-- VIEW -->
        <div class="book-view" id="bookView">
            <div class="page-content" id="pageContent">
                <div class="translate-badge" id="translateBadge">🌐 Traduit</div>
            </div>
        </div>

        <!-- BOTTOM ACTIONS -->
        <div class="bottom-actions" id="bottomActions">
            <button class="btn-prev" id="prevPageBtn">
                <span class="icon">◀</span>
                <span class="label" id="prevText">Préc.</span>
            </button>
            <button class="btn-next" id="nextPageBtn">
                <span class="icon">▶</span>
                <span class="label" id="nextText">Suiv.</span>
            </button>

            <div class="separator"></div>

            <button class="btn-add" id="addPageBtn">
                <span class="icon">➕</span>
                <span class="label" id="addText">Ajouter</span>
            </button>
            <button class="btn-save" id="saveBtn">
                <span class="icon">💾</span>
                <span class="label" id="saveText">Sauvegarder</span>
            </button>

            <div class="separator"></div>

            <button class="btn-download" id="downloadPageBtn">
                <span class="icon">⬇️</span>
                <span class="label" id="downloadText">Téléch.</span>
            </button>
            <button class="btn-print" id="printPageBtn">
                <span class="icon">🖨️</span>
                <span class="label" id="printText">Imprimer</span>
            </button>

            <div class="separator"></div>

            <button class="btn-lock" id="lockBtn">
                <span class="icon">🔒</span>
                <span class="label" id="lockText">Verrouiller</span>
            </button>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== LIGHTBOX ===== -->
    <div class="lightbox-overlay" id="lightboxOverlay">
        <button class="close-btn" id="lightboxCloseBtn">✕</button>
        <img id="lightboxImage" src="" alt="Image agrandie">
    </div>

    <script>
        (function() {
            'use strict';

            // =====================================================
            // CONFIGURATION
            // =====================================================
            const ADMIN_PASSWORD = '408408$$';
            const MAX_PAGES = 100;

            // =====================================================
            // STOCKAGE LOCALSTORAGE
            // =====================================================
            const STORAGE_KEY = 'appixo_book_pages';

            function loadPages() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const pages = JSON.parse(raw);
                        if (Array.isArray(pages) && pages.length > 0) {
                            return pages;
                        }
                    }
                } catch (e) {
                    console.warn('Erreur chargement:', e);
                }
                return null;
            }

            function savePages(pages) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
                    return true;
                } catch (e) {
                    console.error('Erreur sauvegarde:', e);
                    return false;
                }
            }

            // =====================================================
            // GESTION DES IMAGES - SANS PAGE DE GARDE
            // =====================================================
            function getImagePath(pageIndex) {
                // Page 1 (index 0) = page1-image1.png
                // Page 2 (index 1) = page2-image1.png
                return 'images/page' + (pageIndex + 1) + '-image1.png';
            }

            // =====================================================
            // APPLICATION
            // =====================================================
            let pages = [];
            let currentIndex = 0;
            let currentLang = 'fr';
            let isLocked = true;

            const translations = {
                fr: {
                    pageLabel: 'Page', noPages: '📭 Aucune page',
                    prev: 'Préc.', next: 'Suiv.', print: 'Imprimer', download: 'Téléch.',
                    add: 'Ajouter', save: 'Sauvegarder', lock: 'Verrouiller', unlock: 'Déverrouiller',
                    noImage: 'Aucune image sur cette page',
                    dropHint: 'Ajoutez une image dans le dossier images/',
                    wrongPassword: '❌ Mot de passe incorrect !',
                    unlocked: '🔓 Mode édition activé',
                    locked: '🔒 Mode lecture seule',
                    pageAdded: '✅ Page ajoutée',
                    saved: '✅ Sauvegarde effectuée',
                    saveError: '❌ Erreur lors de la sauvegarde',
                    clickToZoom: 'Cliquez pour agrandir',
                    noPage: 'Aucune page à télécharger',
                },
                en: {
                    pageLabel: 'Page', noPages: '📭 No pages',
                    prev: 'Prev', next: 'Next', print: 'Print', download: 'Download',
                    add: 'Add', save: 'Save', lock: 'Lock', unlock: 'Unlock',
                    noImage: 'No image on this page',
                    dropHint: 'Add an image in the images/ folder',
                    wrongPassword: '❌ Wrong password!',
                    unlocked: '🔓 Edit mode enabled',
                    locked: '🔒 Read-only mode',
                    pageAdded: '✅ Page added',
                    saved: '✅ Saved successfully',
                    saveError: '❌ Error during save',
                    clickToZoom: 'Click to zoom',
                    noPage: 'No page to download',
                },
                ar: {
                    pageLabel: 'صفحة', noPages: '📭 لا توجد صفحات',
                    prev: 'السابق', next: 'التالي', print: 'طباعة', download: 'تحميل',
                    add: 'إضافة', save: 'حفظ', lock: 'قفل', unlock: 'فتح',
                    noImage: 'لا توجد صورة في هذه الصفحة',
                    dropHint: 'أضف صورة في مجلد images/',
                    wrongPassword: '❌ كلمة المرور غير صحيحة!',
                    unlocked: '🔓 تم تفعيل وضع التحرير',
                    locked: '🔒 وضع القراءة فقط',
                    pageAdded: '✅ تم إضافة الصفحة',
                    saved: '✅ تم الحفظ بنجاح',
                    saveError: '❌ حدث خطأ أثناء الحفظ',
                    clickToZoom: 'انقر للتكبير',
                    noPage: 'لا توجد صفحة للتحميل',
                }
            };

            function t(key) { return translations[currentLang][key] || key; }

            // --- DOM ---
            const pageContent = document.getElementById('pageContent');
            const pageNum = document.getElementById('pageNum');
            const pageTotal = document.getElementById('pageTotal');
            const pageLabel = document.getElementById('pageLabel');
            const pageCounter = document.getElementById('pageCounter');
            const printBtn = document.getElementById('printPageBtn');
            const downloadBtn = document.getElementById('downloadPageBtn');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            const addBtn = document.getElementById('addPageBtn');
            const saveBtn = document.getElementById('saveBtn');
            const lockBtn = document.getElementById('lockBtn');
            const lockText = document.getElementById('lockText');
            const bookView = document.getElementById('bookView');
            const toast = document.getElementById('toast');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const translateBadge = document.getElementById('translateBadge');
            const lightboxOverlay = document.getElementById('lightboxOverlay');
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxCloseBtn = document.getElementById('lightboxCloseBtn');
            const bookContainer = document.getElementById('bookContainer');
            const bottomActions = document.getElementById('bottomActions');

            const translatable = {
                prevText: document.getElementById('prevText'),
                nextText: document.getElementById('nextText'),
                printText: document.getElementById('printText'),
                downloadText: document.getElementById('downloadText'),
                addText: document.getElementById('addText'),
                saveText: document.getElementById('saveText'),
                lockText: document.getElementById('lockText'),
            };

            // --- Toast ---
            let toastTimeout = null;
            function showToast(message, type = 'info') {
                if (toastTimeout) clearTimeout(toastTimeout);
                toast.className = 'toast';
                toast.textContent = message;
                if (type === 'success') toast.classList.add('success');
                else if (type === 'error') toast.classList.add('error');
                else if (type === 'info') toast.classList.add('info');
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // --- Progress ---
            function showProgress(percent) {
                progressBar.classList.add('active');
                progressFill.style.width = percent + '%';
                if (percent >= 100) {
                    setTimeout(() => {
                        progressBar.classList.remove('active');
                        progressFill.style.width = '0%';
                    }, 400);
                }
            }

            // --- Lock ---
            const lockOverlay = document.getElementById('lockOverlay');
            const lockPassword = document.getElementById('lockPassword');
            const lockUnlockBtn = document.getElementById('lockUnlockBtn');
            const lockError = document.getElementById('lockError');

            function showLockOverlay() {
                lockOverlay.classList.add('active');
                lockPassword.value = '';
                lockError.classList.remove('show');
                lockPassword.focus();
                bookContainer.classList.add('locked-blur');
            }
            function hideLockOverlay() {
                lockOverlay.classList.remove('active');
                bookContainer.classList.remove('locked-blur');
                lockError.classList.remove('show');
            }

            function attemptUnlock() {
                const pwd = lockPassword.value.trim();
                if (pwd === ADMIN_PASSWORD) {
                    isLocked = false;
                    updateLockState();
                    hideLockOverlay();
                    renderCurrentPage();
                    showToast(t('unlocked'), 'success');
                } else {
                    lockError.classList.add('show');
                    lockPassword.value = '';
                    lockPassword.focus();
                    showToast(t('wrongPassword'), 'error');
                }
            }

            function toggleLock() {
                if (isLocked) {
                    showLockOverlay();
                } else {
                    isLocked = true;
                    updateLockState();
                    renderCurrentPage();
                    showToast(t('locked'), 'info');
                }
            }

            function updateLockState() {
                lockText.textContent = isLocked ? t('lock') : t('unlock');
                lockBtn.classList.toggle('locked', !isLocked);
                bottomActions.classList.toggle('locked', isLocked);
                if (isLocked) {
                    lockBtn.innerHTML = '<span class="icon">🔒</span><span class="label" id="lockText">' + t('lock') + '</span>';
                } else {
                    lockBtn.innerHTML = '<span class="icon">🔓</span><span class="label" id="lockText">' + t('unlock') + '</span>';
                }
                document.getElementById('lockText').id = 'lockText';
                translatable.lockText = document.getElementById('lockText');
            }

            // --- Langue ---
            function updateUILanguage() {
                pageLabel.textContent = t('pageLabel');
                pageCounter.textContent = '(' + pages.length + '/' + MAX_PAGES + ')';
                translatable.prevText.textContent = t('prev');
                translatable.nextText.textContent = t('next');
                translatable.printText.textContent = t('print');
                translatable.downloadText.textContent = t('download');
                translatable.addText.textContent = t('add');
                translatable.saveText.textContent = t('save');
                translateBadge.textContent = t('translated');

                const container = document.getElementById('bookContainer');
                container.style.direction = (currentLang === 'ar') ? 'rtl' : 'ltr';
                
                updateLockState();
            }

            function setLanguage(lang) {
                if (lang === currentLang) return;
                currentLang = lang;
                document.querySelectorAll('.lang-switch button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === currentLang);
                });
                updateUILanguage();
                renderCurrentPage();
            }

            // --- Lightbox ---
            function openLightbox(imgSrc) {
                if (!imgSrc) return;
                lightboxImage.src = imgSrc;
                lightboxOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
            function closeLightbox() {
                lightboxOverlay.classList.remove('open');
                document.body.style.overflow = '';
                lightboxImage.src = '';
            }
            window.openLightbox = openLightbox;

            // ============================================================
            // RENDU - SANS PAGE DE GARDE
            // ============================================================
            function renderCurrentPage() {
                if (pages.length === 0) {
                    pageContent.innerHTML =
                        '<div class="empty-page-placeholder"><span>📭</span> ' + t('noPages') + '</div>';
                    pageNum.textContent = '0';
                    pageTotal.textContent = '/ 0';
                    pageCounter.textContent = '(0/' + MAX_PAGES + ')';
                    translateBadge.classList.remove('active');
                    updateNavButtons();
                    return;
                }

                const pageIndex = currentIndex;
                pageNum.textContent = pageIndex + 1;
                pageTotal.textContent = '/ ' + pages.length;
                pageCounter.textContent = '(' + pages.length + '/' + MAX_PAGES + ')';

                // Page 1 = page1-image1.png, Page 2 = page2-image1.png, etc.
                const imagePath = getImagePath(pageIndex);
                const pageExists = pages[pageIndex] !== undefined;

                let exerciseHtml = '';
                if (pageExists) {
                    exerciseHtml = `
                        <div class="exercise-zone">
                            <img src="${imagePath}" class="full-page-image" alt="Page ${pageIndex + 1}" 
                                 draggable="false" onclick="openLightbox('${imagePath}')" 
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                            <div class="image-placeholder" style="display:none;">
                                <span>🖼️</span>
                                <div>${t('dropHint')}</div>
                                <div class="hint">${t('noImage')}</div>
                            </div>
                            <div class="click-hint">🔍 ${t('clickToZoom')}</div>
                        </div>
                    `;
                } else {
                    exerciseHtml = `
                        <div class="image-placeholder" style="display:flex;">
                            <span>📄</span>
                            <div>${t('noImage')}</div>
                            <div class="hint">${t('dropHint')}</div>
                        </div>
                    `;
                }

                pageContent.innerHTML = exerciseHtml;

                translateBadge.classList.remove('active');
                updateNavButtons();
            }

            function updateNavButtons() {
                if (pages.length === 0) { prevBtn.disabled = true; nextBtn.disabled = true; return; }
                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex === pages.length - 1);
            }

            function goToPrev() {
                if (pages.length === 0 || currentIndex === 0) return;
                currentIndex--;
                renderCurrentPage();
            }
            function goToNext() {
                if (pages.length === 0 || currentIndex === pages.length - 1) return;
                currentIndex++;
                renderCurrentPage();
            }

            // --- Gestion pages ---
            function addNewPage() {
                if (isLocked) {
                    showToast('🔒 ' + t('locked'), 'error');
                    return;
                }
                if (pages.length >= MAX_PAGES) {
                    showToast('⚠️ Nombre maximum de pages atteint (100)', 'error');
                    return;
                }
                const newIndex = pages.length;
                pages.push({});
                currentIndex = newIndex;
                renderCurrentPage();
                savePages(pages);
                showToast(t('pageAdded'), 'success');
            }

            function sauvegarder() {
                if (isLocked) {
                    showToast('🔒 ' + t('locked'), 'error');
                    return;
                }
                if (savePages(pages)) {
                    showToast(t('saved'), 'success');
                } else {
                    showToast(t('saveError'), 'error');
                }
            }

            // --- Print ---
            function printCurrentPage() { window.print(); }

            // --- Download ---
            function downloadCurrentPage() {
                if (pages.length === 0) { showToast(t('noPage'), 'error'); return; }
                const pageIndex = currentIndex;
                const imagePath = getImagePath(pageIndex);

                const htmlContent = `
                    <!DOCTYPE html>
                    <html>
                    <head><meta charset="UTF-8"><title>Page ${pageIndex+1}</title>
                    <style>
                        * { margin:0; padding:0; box-sizing:border-box; }
                        body { background:white; margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:system-ui,sans-serif; }
                        @page { margin:0; size:A4; }
                        .page-a4 { width:21cm; height:29.7cm; margin:0; padding:0; display:flex; justify-content:center; align-items:center; background:white; overflow:hidden; }
                        .page-a4 img { width:100%; height:100%; object-fit:contain; }
                    </style>
                    </head>
                    <body>
                        <div class="page-a4"><img src="${imagePath}" /></div>
                    </body>
                    </html>
                `;

                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'page-' + (pageIndex+1) + '-A4.html';
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('⬇️ Téléchargement A4 démarré', 'success');
            }

            // --- Swipe ---
            let startX = 0, isSwiping = false;
            function handleTouchStart(e) { const touch = e.touches[0]; startX = touch.clientX; isSwiping = true; }
            function handleTouchEnd(e) {
                if (!isSwiping) return;
                isSwiping = false;
                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;
                if (Math.abs(diff) > 40) { diff > 0 ? goToNext() : goToPrev(); }
            }
            let mouseDown = false, mouseStartX = 0;
            function handleMouseDown(e) { mouseDown = true; mouseStartX = e.clientX; }
            function handleMouseUp(e) {
                if (!mouseDown) return;
                mouseDown = false;
                const diff = mouseStartX - e.clientX;
                if (Math.abs(diff) > 40) { diff > 0 ? goToNext() : goToPrev(); }
            }

            // --- INIT ---
            async function initBook() {
                // Charger les pages depuis localStorage
                const savedPages = loadPages();
                if (savedPages) {
                    pages = savedPages;
                } else {
                    // Initialiser avec une page (page1-image1.png)
                    pages = [{}];
                    savePages(pages);
                }

                // Restaurer l'index et la langue
                try {
                    const meta = localStorage.getItem('appixo_book_meta');
                    if (meta) {
                        const parsed = JSON.parse(meta);
                        if (parsed.currentIndex !== undefined && parsed.currentIndex < pages.length) {
                            currentIndex = parsed.currentIndex;
                        }
                        if (parsed.lang) currentLang = parsed.lang;
                    }
                } catch (e) { /* ignore */ }

                document.querySelectorAll('.lang-switch button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === currentLang);
                });
                updateUILanguage();

                // Verrouillé par défaut
                isLocked = true;
                updateLockState();

                renderCurrentPage();

                // Événements
                bookView.addEventListener('touchstart', handleTouchStart, { passive: true });
                bookView.addEventListener('touchend', handleTouchEnd, { passive: true });
                bookView.addEventListener('mousedown', handleMouseDown);
                bookView.addEventListener('mouseup', handleMouseUp);
                bookView.addEventListener('mouseleave', () => { mouseDown = false; });

                lockUnlockBtn.addEventListener('click', attemptUnlock);
                lockPassword.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); attemptUnlock(); }
                });

                lightboxCloseBtn.addEventListener('click', closeLightbox);
                lightboxOverlay.addEventListener('click', function(e) {
                    if (e.target === this || e.target === lightboxImage) {
                        closeLightbox();
                    }
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') closeLightbox();
                });

                prevBtn.addEventListener('click', goToPrev);
                nextBtn.addEventListener('click', goToNext);
                printBtn.addEventListener('click', printCurrentPage);
                downloadBtn.addEventListener('click', downloadCurrentPage);
                addBtn.addEventListener('click', addNewPage);
                saveBtn.addEventListener('click', sauvegarder);
                lockBtn.addEventListener('click', toggleLock);

                document.getElementById('langFr').addEventListener('click', () => setLanguage('fr'));
                document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));
                document.getElementById('langAr').addEventListener('click', () => setLanguage('ar'));

                setInterval(() => {
                    try {
                        localStorage.setItem('appixo_book_meta', JSON.stringify({
                            currentIndex: currentIndex,
                            lang: currentLang,
                            timestamp: Date.now()
                        }));
                    } catch (e) { /* ignore */ }
                }, 5000);

                console.log('📖 Appixo Book · v3.0 · ' + pages.length + ' pages');
            }

            initBook();
        })();
    </script>
</body>
</html>
