<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Appixo Book · Studio</title>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            width:100%; height:100%;
            background: #f5efe8;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            overflow:hidden;
        }

        /* ===== BOOK CONTAINER ===== */
        .book-container {
            width:100vw; height:100vh;
            max-width:100%; max-height:100%;
            background:linear-gradient(145deg, #f8f4ef 0%, #ece6dd 100%);
            display:flex; flex-direction:column;
            position:relative; overflow:hidden;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding:10px 24px;
            flex-shrink:0;
            background:rgba(255,252,248,0.85);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            border-bottom:1px solid rgba(180,160,140,0.12);
            z-index:10;
            flex-wrap:wrap;
            gap:8px;
            min-height:64px;
            position:relative;
        }
        .top-bar-left {
            display:flex; align-items:center; gap:14px; flex-wrap:wrap;
        }
        .top-bar-right {
            display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        }

        /* ===== LOGO ===== */
        .logo {
            display:flex; align-items:center; gap:8px;
            color:#3d2c1f;
            font-weight:700; font-size:1.1rem;
            letter-spacing:0.5px;
            text-decoration:none;
        }
        .logo .icon { font-size:1.4rem; }
        .logo span { background:linear-gradient(135deg,#c0392b,#e74c3c); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

        /* ===== PAGE INDICATOR (top) ===== */
        .page-indicator-top {
            display:flex; align-items:center; gap:6px;
            color:#6b5a4a; font-weight:500; font-size:0.75rem;
            background:rgba(255,252,248,0.6);
            padding:4px 14px 4px 10px;
            border-radius:60px;
            border:1px solid rgba(180,160,140,0.12);
        }
        .page-indicator-top .num {
            background:linear-gradient(135deg,#c0392b,#e74c3c);
            color:white;
            padding:2px 12px;
            border-radius:60px;
            font-size:0.9rem; font-weight:700;
            min-width:28px; text-align:center;
            box-shadow:0 4px 16px rgba(192,57,43,0.2);
        }
        .page-indicator-top .total { color:rgba(0,0,0,0.25); font-weight:400; }
        .page-indicator-top .label { color:rgba(0,0,0,0.25); font-weight:400; }
        .page-indicator-top .page-counter { font-size:0.6rem; color:rgba(0,0,0,0.2); }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            display:flex; align-items:center;
            background:rgba(255,252,248,0.8);
            border-radius:60px;
            padding:4px 16px 4px 16px;
            border:1px solid rgba(180,160,140,0.12);
            transition:all 0.3s ease;
            min-width:180px;
            flex:1;
            max-width:280px;
        }
        .search-bar:focus-within {
            border-color:#c0392b;
            box-shadow:0 0 0 4px rgba(192,57,43,0.06);
            background:white;
        }
        .search-bar .search-icon {
            color:rgba(0,0,0,0.2);
            font-size:0.9rem;
            margin-right:8px;
        }
        .search-bar input {
            border:none;
            background:transparent;
            padding:6px 0;
            font-size:0.8rem;
            font-family:inherit;
            color:#3d2c1f;
            outline:none;
            width:100%;
        }
        .search-bar input::placeholder {
            color:rgba(0,0,0,0.2);
            font-weight:400;
        }
        .search-bar .clear-search {
            border:none;
            background:transparent;
            color:rgba(0,0,0,0.2);
            cursor:pointer;
            font-size:0.9rem;
            padding:0 4px;
            display:none;
            transition:color 0.3s ease;
        }
        .search-bar .clear-search:hover { color:#c0392b; }
        .search-bar .clear-search.show { display:block; }

        /* ===== SOLUTION CONTROLS ===== */
        .solution-top-controls { display:flex; gap:4px; align-items:center; }
        .solution-top-controls button {
            border:none; border-radius:60px;
            padding:4px 14px;
            font-size:0.65rem; font-weight:600;
            cursor:pointer;
            transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            display:inline-flex; align-items:center; gap:4px;
            white-space:nowrap;
            height:30px;
            font-family:inherit;
            background:rgba(255,252,248,0.6);
            color:#6b5a4a;
            border:1px solid rgba(180,160,140,0.1);
        }
        .solution-top-controls button:hover {
            background:rgba(255,252,248,0.9);
            transform:translateY(-1px);
        }
        .solution-top-controls .btn-show-solution {
            background:linear-gradient(135deg,#27ae60,#2ecc71);
            color:white;
            box-shadow:0 4px 16px rgba(39,174,96,0.15);
            border:none;
        }
        .solution-top-controls .btn-hide-solution {
            background:linear-gradient(135deg,#f39c12,#e67e22);
            color:white;
            box-shadow:0 4px 16px rgba(243,156,18,0.15);
            border:none;
        }

        /* ===== ADMIN BUTTON (top-right corner) ===== */
        .btn-admin-toggle {
            border:none;
            border-radius:60px;
            padding:6px 20px;
            height:38px;
            font-size:0.8rem;
            font-weight:600;
            font-family:inherit;
            cursor:pointer;
            transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            color:white;
            background:linear-gradient(135deg,#c0392b,#e74c3c);
            border:1px solid rgba(192,57,43,0.15);
            box-shadow:0 4px 20px rgba(192,57,43,0.15);
            position:absolute;
            top:12px;
            right:12px;
            z-index:20;
        }
        .btn-admin-toggle:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 32px rgba(192,57,43,0.25);
        }
        .btn-admin-toggle:active { transform:scale(0.94); }
        .btn-admin-toggle.active {
            background:linear-gradient(135deg,#2d3436,#636e72);
            border-color:rgba(45,52,54,0.15);
            box-shadow:0 4px 20px rgba(45,52,54,0.15);
        }
        .btn-admin-toggle.active:hover {
            box-shadow:0 8px 32px rgba(45,52,54,0.25);
        }

        /* ===== ADMIN PANEL ===== */
        .admin-panel-overlay {
            position:fixed; inset:0; z-index:100;
            display:none;
            background:rgba(0,0,0,0.25);
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
            transition:opacity 0.3s ease;
        }
        .admin-panel-overlay.open { display:block; }

        .admin-panel {
            position:fixed; top:0; right:0; z-index:101;
            width:360px; height:100%;
            background:linear-gradient(180deg, #ffffff 0%, #f8f4ef 100%);
            border-left:1px solid rgba(180,160,140,0.1);
            transform:translateX(100%);
            transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            padding:24px 20px;
            overflow-y:auto;
            display:flex; flex-direction:column;
            gap:14px;
            box-shadow:-4px 0 40px rgba(0,0,0,0.06);
        }
        .admin-panel.open { transform:translateX(0); }

        .admin-panel-header {
            display:flex; justify-content:space-between; align-items:center;
            padding-bottom:16px;
            border-bottom:2px solid rgba(192,57,43,0.06);
            flex-shrink:0;
        }
        .admin-panel-header h2 {
            color:#3d2c1f; font-size:1.1rem; font-weight:700;
            display:flex; align-items:center; gap:8px;
        }
        .admin-panel-header h2 span { font-size:1.3rem; }

        .btn-close-admin {
            border:none; border-radius:50%;
            width:38px; height:38px;
            background:rgba(0,0,0,0.04);
            color:rgba(0,0,0,0.35);
            font-size:1.2rem;
            cursor:pointer;
            transition:all 0.3s ease;
            display:flex; align-items:center; justify-content:center;
            border:1px solid rgba(0,0,0,0.04);
        }
        .btn-close-admin:hover {
            background:rgba(192,57,43,0.08);
            color:#c0392b;
            transform:rotate(90deg);
        }

        .admin-panel .panel-section {
            display:flex; flex-direction:column; gap:8px;
        }
        .admin-panel .panel-section .section-title {
            color:rgba(61,44,31,0.35);
            font-size:0.6rem; font-weight:700;
            text-transform:uppercase;
            letter-spacing:1.5px;
            padding:4px 0;
            border-bottom:1px solid rgba(180,160,140,0.06);
        }
        .admin-panel .panel-btn-group {
            display:flex; flex-wrap:wrap; gap:8px;
        }

        .admin-panel .panel-btn {
            border:none; border-radius:60px;
            padding:0 18px; height:40px;
            font-size:0.75rem; font-weight:600;
            font-family:inherit;
            cursor:pointer;
            transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            display:inline-flex; align-items:center; justify-content:center;
            gap:8px; color:white;
            min-width:48px;
            box-shadow:0 2px 12px rgba(0,0,0,0.04);
            flex:1 0 auto;
        }
        .admin-panel .panel-btn .icon { font-size:1rem; line-height:1; }
        .admin-panel .panel-btn .label { font-size:0.65rem; font-weight:600; }
        .admin-panel .panel-btn:hover {
            transform:translateY(-2px);
            box-shadow:0 4px 20px rgba(0,0,0,0.06);
        }
        .admin-panel .panel-btn:active { transform:scale(0.94); }
        .admin-panel .panel-btn.full { flex:1 1 100%; }

        .panel-btn-upload {
            background:linear-gradient(135deg,#2980b9,#3498db) !important;
        }
        .panel-btn-upload:hover { box-shadow:0 4px 20px rgba(41,128,185,0.2) !important; }
        .panel-btn-upload input { display:none; }

        .panel-btn-add {
            background:linear-gradient(135deg,#27ae60,#2ecc71) !important;
        }
        .panel-btn-add:hover { box-shadow:0 4px 20px rgba(39,174,96,0.2) !important; }
        .panel-btn-delete {
            background:linear-gradient(135deg,#e74c3c,#c0392b) !important;
        }
        .panel-btn-delete:hover { box-shadow:0 4px 20px rgba(231,76,60,0.2) !important; }
        .panel-btn-clear {
            background:linear-gradient(135deg,#e67e22,#d35400) !important;
        }
        .panel-btn-clear:hover { box-shadow:0 4px 20px rgba(230,126,34,0.2) !important; }
        .panel-btn-save {
            background:linear-gradient(135deg,#8e44ad,#9b59b6) !important;
        }
        .panel-btn-save:hover { box-shadow:0 4px 20px rgba(142,68,173,0.2) !important; }
        .panel-btn-lock {
            background:linear-gradient(135deg,#2c3e50,#34495e) !important;
        }
        .panel-btn-lock:hover { box-shadow:0 4px 20px rgba(44,62,80,0.2) !important; }
        .panel-btn-lock.locked {
            background:linear-gradient(135deg,#27ae60,#2ecc71) !important;
        }
        .panel-btn-lock.locked:hover { box-shadow:0 4px 20px rgba(39,174,96,0.2) !important; }

        .panel-btn-title {
            background:linear-gradient(135deg,#c0392b,#e74c3c) !important;
        }
        .panel-btn-title:hover { box-shadow:0 4px 20px rgba(192,57,43,0.2) !important; }
        .panel-btn-title input {
            background:transparent;
            border:none;
            color:white;
            font-weight:600;
            font-size:0.75rem;
            font-family:inherit;
            outline:none;
            width:100%;
            min-width:80px;
            padding:0;
        }
        .panel-btn-title input::placeholder { color:rgba(255,255,255,0.5); }

        .admin-panel .panel-separator {
            width:100%; height:1px;
            background:rgba(180,160,140,0.08);
            margin:2px 0;
        }

        /* ===== BOOK VIEW ===== */
        .book-view {
            flex:1; position:relative; width:100%;
            overflow:hidden;
            display:flex; justify-content:center; align-items:center;
            min-height:0;
        }
        .page-content {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            position:relative;
            overflow-y:auto; overflow-x:hidden;
            scroll-behavior:smooth;
        }
        .page-cover {
            width:100%; height:100%;
            display:flex; justify-content:center; align-items:center;
            background:linear-gradient(145deg, #f8f4ef, #ece6dd);
            cursor:pointer;
            position:relative;
        }
        .page-cover img.cover-main {
            width:100%; height:100%;
            object-fit:contain;
            display:block; border:none;
        }
        .page-cover .page-title-overlay {
            position:absolute; bottom:40px; left:50%;
            transform:translateX(-50%);
            color:rgba(61,44,31,0.4);
            font-size:0.8rem;
            font-weight:500;
            background:rgba(255,252,248,0.6);
            backdrop-filter:blur(8px);
            padding:4px 20px;
            border-radius:60px;
            border:1px solid rgba(180,160,140,0.08);
            pointer-events:none;
        }

        .exercise-zone {
            width:100%; flex:1;
            display:flex; align-items:center; justify-content:center;
            background:#f8f4ef;
            position:relative; overflow:hidden;
            min-height:0; cursor:pointer;
            flex-direction:column;
        }
        .exercise-zone .full-page-image {
            width:100%; height:100%;
            object-fit:contain;
            display:block; background:#f8f4ef;
        }
        .exercise-zone .image-placeholder {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            color:rgba(61,44,31,0.12);
            font-size:1rem; font-weight:400;
            background:#f8f4ef;
            gap:10px; padding:16px; text-align:center;
        }
        .exercise-zone .image-placeholder span { font-size:2.6rem; opacity:0.3; }
        .exercise-zone .image-placeholder .hint { font-size:0.8rem; color:rgba(61,44,31,0.1); }

        .exercise-zone .page-title-display {
            position:absolute; top:20px; left:50%;
            transform:translateX(-50%);
            color:#3d2c1f;
            font-size:1.1rem;
            font-weight:700;
            background:rgba(255,252,248,0.7);
            backdrop-filter:blur(12px);
            padding:6px 28px;
            border-radius:60px;
            border:1px solid rgba(180,160,140,0.08);
            box-shadow:0 4px 20px rgba(0,0,0,0.02);
            pointer-events:none;
            max-width:80%;
            text-align:center;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .exercise-zone .page-title-display.empty {
            color:rgba(61,44,31,0.12);
            font-weight:400;
            font-size:0.8rem;
        }

        .click-hint {
            position:absolute; bottom:16px; right:16px;
            background:rgba(255,252,248,0.6);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            color:rgba(61,44,31,0.25);
            padding:4px 14px; border-radius:30px;
            font-size:0.5rem; font-weight:500;
            letter-spacing:0.5px;
            pointer-events:none;
            opacity:0; transition:opacity 0.4s ease;
            border:1px solid rgba(180,160,140,0.06);
        }
        .exercise-zone:hover .click-hint,
        .page-cover:hover .click-hint { opacity:1; }

        /* ===== SOLUTION ZONE ===== */
        .solution-zone-wrapper {
            width:100%; padding:10px 24px 14px;
            background:rgba(255,252,248,0.5);
            border-top:1px solid rgba(180,160,140,0.06);
            transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
            flex-shrink:0; overflow:hidden;
            max-height:400px; opacity:1; transform:scaleY(1);
            transform-origin:top;
        }
        .solution-zone-wrapper.hidden {
            max-height:0; opacity:0; transform:scaleY(0);
            padding:0; border-top:none; pointer-events:none;
        }
        .page-cover + .solution-zone-wrapper,
        .page-cover ~ .solution-zone-wrapper {
            display:none !important;
        }
        .solution-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
        .solution-header h4 {
            color:#c0392b; font-size:0.85rem;
            display:flex; align-items:center; gap:8px;
            font-weight:600;
        }
        .solution-image-container {
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            background:rgba(255,252,248,0.5);
            border-radius:16px; padding:8px;
            min-height:50px;
            border:1px solid rgba(180,160,140,0.06);
            cursor:pointer;
        }
        .solution-image-container .solution-image {
            max-width:100%; max-height:180px;
            object-fit:contain; border-radius:12px;
            border:1px solid rgba(180,160,140,0.06);
            cursor:pointer;
            transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        .solution-image-container .solution-image:hover {
            transform:scale(1.02);
            box-shadow:0 8px 32px rgba(0,0,0,0.04);
        }
        .solution-image-container .placeholder {
            color:rgba(61,44,31,0.15);
            font-style:italic; font-weight:400; font-size:0.75rem;
            text-align:center; padding:6px 0;
        }
        .solution-image-container .upload-btn {
            margin-top:6px; border:none; border-radius:60px;
            padding:4px 18px; font-size:0.65rem; font-weight:600;
            background:linear-gradient(135deg,#2980b9,#3498db);
            color:white; cursor:pointer; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow:0 4px 16px rgba(41,128,185,0.1);
            display:inline-flex; align-items:center; gap:4px;
            font-family:inherit;
        }
        .solution-image-container .upload-btn:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(41,128,185,0.15);
        }
        .solution-image-container .upload-btn input { display:none; }

        /* ===== BOTTOM ACTIONS ===== */
        .bottom-actions {
            display:flex; flex-wrap:wrap;
            justify-content:center; align-items:center;
            gap:8px 12px;
            padding:10px 24px;
            flex-shrink:0;
            background:rgba(255,252,248,0.7);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border-top:1px solid rgba(180,160,140,0.06);
            box-shadow:0 -4px 32px rgba(0,0,0,0.02);
            position:relative;
        }
        .bottom-actions button {
            border:none; border-radius:60px;
            padding:0 20px; height:40px;
            font-size:0.8rem; font-weight:600;
            font-family:inherit;
            cursor:pointer; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            display:inline-flex; align-items:center; justify-content:center;
            gap:6px; color:white;
            min-width:48px;
            background:rgba(61,44,31,0.04);
            border:1px solid rgba(180,160,140,0.06);
            box-shadow:0 2px 12px rgba(0,0,0,0.02);
        }
        .bottom-actions button .icon { font-size:1rem; line-height:1; }
        .bottom-actions button .label { font-size:0.75rem; font-weight:600; letter-spacing:0.2px; }
        .bottom-actions button:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(0,0,0,0.04);
        }
        .bottom-actions button:active { transform:scale(0.94); }

        .btn-prev, .btn-next {
            background:linear-gradient(135deg,#f39c12,#e67e22) !important;
            border-color:rgba(243,156,18,0.15) !important;
            box-shadow:0 4px 20px rgba(243,156,18,0.12) !important;
        }
        .btn-prev:hover, .btn-next:hover {
            box-shadow:0 8px 32px rgba(243,156,18,0.2) !important;
        }
        .btn-print {
            background:linear-gradient(135deg,#8e44ad,#9b59b6) !important;
            border-color:rgba(142,68,173,0.15) !important;
            box-shadow:0 4px 20px rgba(142,68,173,0.12) !important;
        }
        .btn-print:hover {
            box-shadow:0 8px 32px rgba(142,68,173,0.2) !important;
        }
        .btn-download {
            background:linear-gradient(135deg,#2980b9,#3498db) !important;
            border-color:rgba(41,128,185,0.15) !important;
            box-shadow:0 4px 20px rgba(41,128,185,0.12) !important;
        }
        .btn-download:hover {
            box-shadow:0 8px 32px rgba(41,128,185,0.2) !important;
        }
        .bottom-actions .separator {
            width:1px; height:26px;
            background:rgba(180,160,140,0.1);
            margin:0 4px;
            flex-shrink:0;
        }

        /* ===== PAGE INDICATOR (bottom-right) ===== */
        .page-indicator-bottom {
            position:absolute;
            bottom:16px;
            right:24px;
            display:flex;
            align-items:center;
            gap:6px;
            color:rgba(61,44,31,0.3);
            font-weight:500;
            font-size:0.7rem;
            background:rgba(255,252,248,0.6);
            padding:4px 14px 4px 10px;
            border-radius:60px;
            border:1px solid rgba(180,160,140,0.08);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            pointer-events:none;
            z-index:5;
        }
        .page-indicator-bottom .num {
            background:linear-gradient(135deg,#c0392b,#e74c3c);
            color:white;
            padding:1px 10px;
            border-radius:60px;
            font-size:0.8rem; font-weight:700;
            min-width:24px; text-align:center;
            box-shadow:0 2px 12px rgba(192,57,43,0.15);
        }
        .page-indicator-bottom .total {
            color:rgba(61,44,31,0.2);
            font-weight:400;
        }

    <script>
        (function() {
            'use strict';

            // =====================================================
            // STOCKAGE INDEXEDDB + LOCALSTORAGE (FALLBACK)
            // =====================================================
            class PersistentStorage {
                constructor() {
                    this.dbName = 'CarnetA4_100_v8';
                    this.storeName = 'pages';
                    this.version = 10;
                    this.db = null;
                    this.ready = false;
                    this.initPromise = null;
                    this.MAX_IMAGES = 100;
                    this.fallbackKey = 'appixo_book_fallback';
                }

                init() {
                    if (this.initPromise) return this.initPromise;
                    this.initPromise = new Promise((resolve) => {
                        const request = indexedDB.open(this.dbName, this.version);
                        request.onerror = () => {
                            console.warn('⚠️ IndexedDB indisponible, fallback localStorage');
                            this.ready = false;
                            resolve(false);
                        };
                        request.onsuccess = (e) => {
                            this.db = e.target.result;
                            this.ready = true;
                            console.log('✅ IndexedDB prêt');
                            resolve(true);
                        };
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(this.storeName)) {
                                const store = db.createObjectStore(this.storeName, { keyPath: 'id', autoIncrement: true });
                                store.createIndex('timestamp', 'timestamp', { unique: false });
                                store.createIndex('pageIndex', 'pageIndex', { unique: false });
                            } else {
                                const store = e.target.transaction.objectStore(this.storeName);
                                if (!store.indexNames.contains('timestamp')) {
                                    store.createIndex('timestamp', 'timestamp', { unique: false });
                                }
                                if (!store.indexNames.contains('pageIndex')) {
                                    store.createIndex('pageIndex', 'pageIndex', { unique: false });
                                }
                            }
                        };
                    });
                    return this.initPromise;
                }

                async savePages(pages) {
                    const isReady = await this.init();
                    if (isReady) {
                        try {
                            await this._saveToIndexedDB(pages);
                        } catch (e) {
                            console.warn('⚠️ Sauvegarde IndexedDB échouée, fallback localStorage');
                            this._saveToLocalStorage(pages);
                        }
                    } else {
                        this._saveToLocalStorage(pages);
                    }
                    this._saveToLocalStorage(pages);
                }

                _saveToLocalStorage(pages) {
                    try {
                        localStorage.setItem(this.fallbackKey, JSON.stringify(pages));
                        console.log('💾 Sauvegarde localStorage OK');
                    } catch (e) {
                        console.error('❌ Erreur sauvegarde localStorage:', e);
                    }
                }

                _saveToIndexedDB(pages) {
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readwrite');
                        const store = tx.objectStore(this.storeName);
                        const clearRequest = store.clear();
                        clearRequest.onsuccess = () => {
                            let saved = 0;
                            const total = Math.min(pages.length, this.MAX_IMAGES);
                            for (let i = 0; i < total; i++) {
                                const page = pages[i];
                                const data = {
                                    content: page.content || '',
                                    solution: page.solution || '',
                                    imageData: page.imageData || null,
                                    isCover: page.isCover || false,
                                    title: page.title || '',
                                    timestamp: Date.now() + i,
                                    pageIndex: i
                                };
                                const addRequest = store.add(data);
                                addRequest.onsuccess = () => {
                                    saved++;
                                    if (saved === total) resolve();
                                };
                                addRequest.onerror = (e) => reject(e.target.error);
                            }
                            if (total === 0) resolve();
                        };
                        clearRequest.onerror = (e) => reject(e.target.error);
                    });
                }

                async loadPages() {
                    const isReady = await this.init();
                    if (isReady) {
                        try {
                            const pages = await this._loadFromIndexedDB();
                            if (pages && pages.length > 0) {
                                const hasImages = pages.some(p => p.imageData && p.imageData.startsWith('data:image'));
                                if (hasImages || pages.length > 1) {
                                    return pages;
                                }
                            }
                        } catch (e) {
                            console.warn('⚠️ Chargement IndexedDB échoué, fallback localStorage');
                        }
                    }
                    return this._loadFromLocalStorage();
                }

                _loadFromIndexedDB() {
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readonly');
                        const store = tx.objectStore(this.storeName);
                        const index = store.index('pageIndex');
                        const request = index.getAll();
                        request.onsuccess = () => {
                            const results = request.result;
                            results.sort((a, b) => a.pageIndex - b.pageIndex);
                            const pages = results.map(item => ({
                                content: item.content || '',
                                solution: item.solution || '',
                                imageData: item.imageData || null,
                                isCover: item.isCover || false,
                                title: item.title || ''
                            }));
                            resolve(pages);
                        };
                        request.onerror = (e) => reject(e.target.error);
                    });
                }

                _loadFromLocalStorage() {
                    try {
                        const raw = localStorage.getItem(this.fallbackKey);
                        if (raw) {
                            const pages = JSON.parse(raw);
                            if (Array.isArray(pages) && pages.length > 0) {
                                console.log('📂 Chargé depuis localStorage (' + pages.length + ' pages)');
                                return pages;
                            }
                        }
                    } catch (e) {
                        console.warn('Erreur lecture localStorage:', e);
                    }
                    return [];
                }

                async clear() {
                    const isReady = await this.init();
                    if (isReady) {
                        try { await this._clearIndexedDB(); } catch (e) { /* ignore */ }
                    }
                    localStorage.removeItem(this.fallbackKey);
                }

                _clearIndexedDB() {
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readwrite');
                        const store = tx.objectStore(this.storeName);
                        const request = store.clear();
                        request.onsuccess = () => resolve();
                        request.onerror = (e) => reject(e.target.error);
                    });

                            return;
                        }
                        const file = this.files[0];
                        if (file) {
                            handleSolutionImageUpload(file, currentIndex);
                        }
                        this.value = '';
                    });
                }

                const solutionImg = document.querySelector('.solution-image-container .solution-image');
                if (solutionImg && !solutionImg.hasAttribute('onclick')) {
                    const src = solutionImg.getAttribute('src');
                    if (src) {
                        solutionImg.style.cursor = 'pointer';
                        solutionImg.addEventListener('click', function(e) {
                            e.stopPropagation();
                            openLightbox(src);
                        });
                    }
                }

                translateBadge.classList.remove('active');
                updateNavButtons();
                if (isLocked) applyLockState(true);
                else applyLockState(false);
            }

            function updateNavButtons() {
                if (pages.length === 0) { prevBtn.disabled = true; nextBtn.disabled = true; return; }
                if (searchQuery && searchResults.length > 0) {
                    const idx = searchResults.indexOf(currentIndex);
                    prevBtn.disabled = (idx <= 0);
                    nextBtn.disabled = (idx >= searchResults.length - 1);
                    return;
                }
                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex === pages.length - 1);
            }

            function goToPrev() {
                if (pages.length === 0) return;
                if (searchQuery && searchResults.length > 0) {
                    const idx = searchResults.indexOf(currentIndex);
                    if (idx > 0) {
                        currentIndex = searchResults[idx - 1];
                        solutionVisible = false;
                        renderCurrentPage();
                        updateSolutionButtons();
                    }
                    return;
                }
                if (currentIndex === 0) return;
                currentIndex--;
                solutionVisible = false;
                renderCurrentPage();
                updateSolutionButtons();
            }
            function goToNext() {
                if (pages.length === 0) return;
                if (searchQuery && searchResults.length > 0) {
                    const idx = searchResults.indexOf(currentIndex);
                    if (idx < searchResults.length - 1) {
                        currentIndex = searchResults[idx + 1];
                        solutionVisible = false;
                        renderCurrentPage();
                        updateSolutionButtons();
                    }
                    return;
                }
                if (currentIndex === pages.length - 1) return;
                currentIndex++;
                solutionVisible = false;
                renderCurrentPage();
                updateSolutionButtons();
            }

            // --- Gestion pages ---
            function addNewPage() {
                if (isLocked) { showToast('🔒 Carnet verrouillé', 'error'); return; }
                if (pages.length >= MAX_PAGES) {
                    showToast(t('maxPages'), 'error');
                    return;
                }
                pages.push({ content: '', solution: '', imageData: null, isCover: false, title: '' });
                currentIndex = pages.length - 1;
                solutionVisible = false;
                clearSearch();
                renderCurrentPage();
                updateSolutionButtons();
                sauvegarderEtat();
                showToast('➕ Page ajoutée', 'success');
            }

            function deleteCurrentPage() {
                if (isLocked) { showToast('🔒 Carnet verrouillé', 'error'); return; }
                if (pages.length === 0) return;
                if (currentIndex === 0) {
                    showToast('📖 La page de garde ne peut pas être supprimée.', 'info');
                    return;
                }
                if (!confirm(t('confirmDelete'))) return;
                pages.splice(currentIndex, 1);
                if (currentIndex >= pages.length) currentIndex = pages.length - 1;
                solutionVisible = false;
                clearSearch();
                renderCurrentPage();
                updateSolutionButtons();
                sauvegarderEtat();
                showToast('🗑️ Page supprimée', 'success');
            }

            // --- Upload image ---
            function handleImageUpload(event) {
                if (isLocked) { showToast('🔒 Carnet verrouillé', 'error'); imageUpload.value = ''; return; }
                const file = event.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    showToast(t('imageError'), 'error');
                    imageUpload.value = '';
                    return;
                }

                if (currentIndex === 0) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const page = pages[0];
                        if (page) {
                            page.imageData = e.target.result;
                            page.isCover = true;
                            sauvegarderEtat();
                            renderCurrentPage();
                            showToast('🖼️ Image de couverture mise à jour', 'success');
                        }
                    };
                    reader.readAsDataURL(file);
                    imageUpload.value = '';
                    return;
                }

                showProgress(20);
                const maxSize = 30 * 1024 * 1024;
                if (file.size > maxSize) {
                    showToast('⚠️ Image trop volumineuse (max 30MB)', 'error');
                    imageUpload.value = '';
                    showProgress(0);
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        showProgress(50);
                        const base64 = e.target.result;
                        if (!base64 || !base64.startsWith('data:image')) {
                            showToast(t('readError'), 'error');
                            imageUpload.value = '';
                            showProgress(0);
                            return;
                        }
                        showProgress(90);
                        if (pages.length === 0) {
                            pages.push({ content: '', solution: '', imageData: base64, isCover: false, title: '' });
                            currentIndex = 0;
                        } else {
                            pages[currentIndex].imageData = base64;
                            pages[currentIndex].isCover = false;
                        }
                        renderCurrentPage();
                        sauvegarderEtat();
                        imageUpload.value = '';
                        showProgress(100);
                        showToast('🖼️ Image insérée (qualité originale)', 'success');
                    } catch (err) {
                        showToast(t('readError'), 'error');
                        imageUpload.value = '';
                        showProgress(0);
                    }
                };
                reader.onerror = function() {
                    showToast(t('readError'), 'error');
                    imageUpload.value = '';
                    showProgress(0);
                };
                reader.readAsDataURL(file);
            }

            // --- Print ---
            function printCurrentPage() { window.print(); }

            // --- Download ---
            function downloadCurrentPage() {
                if (pages.length === 0) { showToast(t('noPage'), 'error'); return; }
                const page = pages[currentIndex];
                if (!page || (!page.imageData && !page.solution && !page.isCover)) {
                    showToast(t('noImage'), 'info');
                    return;
                }

                const pageTitle = page.title || 'Page ' + (currentIndex + 1);
                let bodyContent = '';

                if (currentIndex === 0) {
                    const imgSrc = page.imageData || DEFAULT_COVER;
                    bodyContent = `
                        <div style="width:21cm;height:29.7cm;margin:0;padding:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:white;overflow:hidden;position:relative;">
                            <img src="${imgSrc}" style="width:100%;height:100%;object-fit:contain;" />
                            ${pageTitle ? `<div style="position:absolute;bottom:40px;left:0;right:0;text-align:center;color:rgba(0,0,0,0.2);font-size:12px;font-family:system-ui,sans-serif;">${pageTitle}</div>` : ''}
                        </div>
                    `;
                } else {
                    const hasSolution = page.solution && page.solution.includes('<img');
                    const solHtml = hasSolution ? page.solution :
                        `<p style="color:#999;font-style:italic;text-align:center;">${t('noSolution')}</p>`;

                    const hasImage = page.imageData && page.imageData.length > 100 && page.imageData.startsWith('data:image');
                    const imgHtml = hasImage ?
                        `<img src="${page.imageData}" style="width:100%;height:100%;object-fit:contain;display:block;border:none;border-radius:0;" />` :
                        `<div style="width:100%;height:100%;display:flex;justify-content:center;align-items:center;color:#c5d0e0;font-size:1.2rem;font-style:italic;">${t('noImagePage')}</div>`;

                    bodyContent = `
                        <div style="width:21cm;min-height:29.7cm;margin:0 auto;padding:0;background:white;display:flex;flex-direction:column;box-sizing:border-box;font-family:system-ui,sans-serif;">
                            <div style="padding:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;">
                                ${pageTitle ? `<div style="position:absolute;top:20px;left:0;right:0;text-align:center;color:#3d2c1f;font-size:16px;font-weight:700;padding:0 20px;">${pageTitle}</div>` : ''}
                                ${imgHtml}
                            </div>
                            <div style="padding:12px 16px;flex:0 0 auto;background:white;border-top:1px solid #e0e0e0;">
                                <h4 style="color:#c0392b;font-size:1rem;margin-bottom:8px;font-weight:700;">💡 ${t('solutionTitle')}</h4>
                                <div style="display:flex;justify-content:center;align-items:center;">
                                    ${solHtml}
                                </div>
                            </div>
                        </div>
                    `;
                }

                const htmlContent = `
                    <!DOCTYPE html>
                    <html>
                    <head><meta charset="UTF-8"><title>${pageTitle}</title>
                    <style>
                        * { margin:0; padding:0; box-sizing:border-box; }
                        body { background:white; margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:system-ui,sans-serif; }
                        @page { margin:0; size:A4; }
                        .click-hint { display:none !important; }
                        .upload-btn { display:none !important; }
                    </style>
                    </head>
                    <body>
                        ${bodyContent}
                    </body>
                    </html>
                `;

                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `${pageTitle || 'page'}-${currentIndex+1}-A4.html`;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('⬇️ Téléchargement A4 démarré', 'success');
            }

            // --- Vider tout ---
            async function clearAllPages() {
                if (isLocked) { showToast('🔒 Carnet verrouillé', 'error'); return; }
                if (pages.length === 0 || (pages.length === 1 && !pages[0].content && !pages[0].imageData && !pages[0].solution)) {
                    showToast('📭 Aucune page à supprimer', 'info');
                    return;
                }
                if (!confirm(t('clearConfirm'))) return;
                try {
                    showProgress(20);
                    await storage.clear();
                    showProgress(50);
                    pages = [{ content: '', solution: '', imageData: null, isCover: true, title: '' }];
                    currentIndex = 0;
                    solutionVisible = false;
                    clearSearch();
                    localStorage.removeItem('carnetMeta_100_v5');
                    localStorage.removeItem('bookData_100_v5');
                    renderCurrentPage();
                    updateUILanguage();
                    updateSolutionButtons();
                    showProgress(100);
                    showToast(t('cleared'), 'success');
                } catch (e) {
                    console.error('Erreur lors du vidage:', e);
                    showToast(t('saveError'), 'error');
                    showProgress(0);
                }
            }

            // --- Sauvegarde ---
            async function sauvegarderEtat() {
                if (isSaving) return;
                isSaving = true;
                try {
                    showProgress(20);
                    await storage.savePages(pages);
                    showProgress(70);
                    const meta = {
                        currentIndex: currentIndex,
                        lang: currentLang,
                        pageCount: pages.length,
                        isLocked: isLocked,
                        solutionVisible: solutionVisible,
                        timestamp: Date.now()
                    };
                    localStorage.setItem('carnetMeta_100_v5', JSON.stringify(meta));
                    showProgress(100);
                    console.log('💾 Sauvegarde IndexedDB OK (' + pages.length + ' pages)');
                } catch (e) {
                    console.error('❌ Erreur sauvegarde:', e);
                    try {
                        localStorage.setItem('bookData_100_v5', JSON.stringify({
                            pages: pages,
                            currentIndex: currentIndex,
                            lang: currentLang,
                            isLocked: isLocked,
                            solutionVisible: solutionVisible
                        }));
                        console.log('💾 Sauvegarde fallback localStorage');
                    } catch (e2) {
                        showToast(t('saveError'), 'error');
                    }
                }
                isSaving = false;
            }

            async function sauvegarderExplicite() {
                showToast(t('saving'), 'info');
                await sauvegarderEtat();
                showToast(t('saved'), 'success');
            }

            // --- Chargement ---
            async function loadState() {
                try {
                    const pagesFromDB = await storage.loadPages();
                    if (pagesFromDB && pagesFromDB.length > 0) {
                        pages = pagesFromDB;
                        const meta = localStorage.getItem('carnetMeta_100_v5');
                        if (meta) {
                            const parsed = JSON.parse(meta);
                            currentIndex = (parsed.currentIndex !== undefined && parsed.currentIndex < pages.length) ?
                                parsed.currentIndex : 0;
                            if (parsed.lang) currentLang = parsed.lang;
                            if (parsed.isLocked !== undefined) isLocked = parsed.isLocked;
                            if (parsed.solutionVisible !== undefined) solutionVisible = parsed.solutionVisible;
                        }
                        if (pages.length > 0) pages[0].isCover = true;
                        if (pages.length === 0) {
                            pages = [{ content: '', solution: '', imageData: null, isCover: true, title: '' }];
                            currentIndex = 0;
                        }
                        updateUILanguage();
                        if (isLocked) {
                            lockLabel.textContent = t('unlock');
                            lockBtn.classList.add('locked');
                            applyLockState(true);
                            showLockOverlay();
                        } else {
                            lockLabel.textContent = t('lock');
                            lockBtn.classList.remove('locked');
                            applyLockState(false);
                            hideLockOverlay();
                        }
                        renderCurrentPage();
                        updateSolutionButtons();
                        console.log('✅ Chargé depuis IndexedDB (' + pages.length + ' pages)');
                        return true;
                    }

                    const raw = localStorage.getItem('bookData_100_v5');
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data.pages && Array.isArray(data.pages) && data.pages.length > 0) {
                            pages = data.pages;
                            currentIndex = (data.currentIndex !== undefined && data.currentIndex < pages.length) ?
                                data.currentIndex : 0;
                            if (data.lang) currentLang = data.lang;
                            if (data.isLocked !== undefined) isLocked = data.isLocked;
                            if (data.solutionVisible !== undefined) solutionVisible = data.solutionVisible;
                            if (pages.length > 0) pages[0].isCover = true;
                            await storage.savePages(pages);
                            localStorage.setItem('carnetMeta_100_v5', JSON.stringify({
                                currentIndex: currentIndex,
                                lang: currentLang,
                                pageCount: pages.length,
                                isLocked: isLocked,
                                solutionVisible: solutionVisible,
                                timestamp: Date.now()
                            }));
                            updateUILanguage();
                            if (isLocked) {
                                lockLabel.textContent = t('unlock');
                                lockBtn.classList.add('locked');
                                applyLockState(true);
                                showLockOverlay();
                            } else {
                                lockLabel.textContent = t('lock');
                                lockBtn.classList.remove('locked');
                                applyLockState(false);
                                hideLockOverlay();
                            }
                            renderCurrentPage();
                            updateSolutionButtons();
                            console.log('✅ Migré depuis localStorage (' + pages.length + ' pages)');
                            return true;
                        }
                    }
                    return false;
                } catch (e) {
                    console.warn('⚠️ Erreur chargement:', e);
                    return false;
                }
            }

            // --- Chargement depuis paramètre URL ---
            function loadFromURLParam() {
                const urlParams = new URLSearchParams(window.location.search);
                const dataParam = urlParams.get('data');
                if (!dataParam) return false;

                try {
                    const decoded = atob(dataParam);
                    const parsed = JSON.parse(decoded);
                    if (!parsed.pages || !Array.isArray(parsed.pages)) {
                        throw new Error('Format invalide');
                    }
                    pages = parsed.pages;
                    if (parsed.currentIndex !== undefined && parsed.currentIndex < pages.length) {
                        currentIndex = parsed.currentIndex;
                    } else {
                        currentIndex = 0;
                    }
                    if (parsed.lang) currentLang = parsed.lang;
                    if (parsed.solutionVisible !== undefined) solutionVisible = parsed.solutionVisible;
                    if (pages.length > 0) pages[0].isCover = true;

                    sauvegarderEtat().then(() => {
                        showToast('📥 Données chargées depuis le paramètre URL', 'success');
                        renderCurrentPage();
                        updateUILanguage();
                        updateSolutionButtons();
                    });
                    return true;
                } catch (e) {
                    console.error('Erreur chargement paramètre URL:', e);
                    showToast('❌ Erreur de chargement des données depuis l\'URL', 'error');
                    return false;
                }
            }

            // --- Swipe ---
            let startX = 0, isSwiping = false;
            function handleTouchStart(e) { const touch = e.touches[0]; startX = touch.clientX; isSwiping = true; }
            function handleTouchEnd(e) {
                if (!isSwiping) return;
                isSwiping = false;
                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;
                if (Math.abs(diff) > 40) { diff > 0 ? goToNext() : goToPrev(); }
            }
            let mouseDown = false, mouseStartX = 0;
            function handleMouseDown(e) { mouseDown = true; mouseStartX = e.clientX; }
            function handleMouseUp(e) {
                if (!mouseDown) return;
                mouseDown = false;
                const diff = mouseStartX - e.clientX;
                if (Math.abs(diff) > 40) { diff > 0 ? goToNext() : goToPrev(); }
            }

            // --- INIT ---
            async function initBook() {
                const loadedFromParam = loadFromURLParam();

                if (!loadedFromParam) {
                    const loaded = await loadState();
                    if (!loaded) {
                        pages = [{ content: '', solution: '', imageData: null, isCover: true, title: '' }];
                        currentIndex = 0;
                        solutionVisible = false;
                        isLocked = false;
                        await storage.savePages(pages);
                    }
                }

                updateUILanguage();
                renderCurrentPage();
                updateSolutionButtons();
                updatePanelPageCount();
                updateTitleInput();

                bookView.addEventListener('touchstart', handleTouchStart, { passive: true });
                bookView.addEventListener('touchend', handleTouchEnd, { passive: true });
                bookView.addEventListener('mousedown', handleMouseDown);
                bookView.addEventListener('mouseup', handleMouseUp);
                bookView.addEventListener('mouseleave', () => { mouseDown = false; });

                // --- Search Events ---
                searchInput.addEventListener('input', function(e) {
                    const query = e.target.value;
                    if (query.trim()) {
                        performSearch(query);
                    } else {
                        clearSearch();
                    }
                });

                searchInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        clearSearch();
                        searchInput.blur();
                    }
                });

                clearSearchBtn.addEventListener('click', function() {
                    clearSearch();
                    searchInput.focus();
                });

                // --- Title Events ---
                titleInput.addEventListener('change', updatePageTitle);
                titleInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        updatePageTitle();
                        titleInput.blur();
                    }
                });

                // --- Events ---
                showSolutionTopBtn.addEventListener('click', function() { toggleSolutionFromTop(true); });
                hideSolutionTopBtn.addEventListener('click', function() { toggleSolutionFromTop(false); });

                lockUnlockBtn.addEventListener('click', attemptUnlock);
                lockPassword.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); attemptUnlock(); }
                });
                lockBtn.addEventListener('click', toggleLock);

                lightboxCloseBtn.addEventListener('click', closeLightbox);
                lightboxOverlay.addEventListener('click', function(e) {
                    if (e.target === this || e.target === lightboxImage) {
                        closeLightbox();
                    }
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        closeLightbox();
                        closeAdminPanel();
                        clearSearch();
                    }
                });

                prevBtn.addEventListener('click', goToPrev);
                nextBtn.addEventListener('click', goToNext);
                printBtn.addEventListener('click', printCurrentPage);
                downloadBtn.addEventListener('click', downloadCurrentPage);

                // Admin panel events
                adminToggleBtn.addEventListener('click', toggleAdminPanel);
                adminPanelOverlay.addEventListener('click', closeAdminPanel);
                closeAdminBtn.addEventListener('click', closeAdminPanel);

                imageUpload.addEventListener('change', handleImageUpload);
                addBtn.addEventListener('click', addNewPage);
                deleteBtn.addEventListener('click', deleteCurrentPage);
                clearAllBtn.addEventListener('click', clearAllPages);
                saveExplicitBtn.addEventListener('click', sauvegarderExplicite);

                const stats = await storage.loadPages();
                console.log('📊 Nombre de pages chargées:', stats.length);
            }

            initBook();
            console.log('📖 Appixo Book · Studio v3.0 · Interface moderne');
        })();
    </script>
</body>
</html>
