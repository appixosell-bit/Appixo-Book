<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Appixo Book · Paramètres</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-body: #e8ecf2;
            --card-bg: #ffffff;
            --shadow-card: 0 40px 120px rgba(0, 0, 0, 0.08), 0 12px 40px rgba(0, 0, 0, 0.03);
            --shadow-card-hover: 0 60px 160px rgba(0, 0, 0, 0.10), 0 20px 60px rgba(0, 0, 0, 0.04);
            --radius-card: 40px 20px 20px 40px;
            --radius-view: 28px;
            --border-glass: 1px solid rgba(255, 255, 255, 0.6);
            --text-primary: #0a1628;
            --text-secondary: #1a2a3a;
            --text-muted: #8a9bb5;
            --accent: #6d28d9;
            --accent-light: #8b5cf6;
            --accent-glow: rgba(109, 40, 217, 0.25);
            --accent-glow-strong: rgba(109, 40, 217, 0.35);
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --gold: #d4a373;
            --bg-editor: #f8faff;
            --bg-solution: #f5f7fb;
            --border-subtle: rgba(0, 0, 0, 0.04);
            --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            --font-logo: 'Playfair Display', 'Inter', serif;
            --transition-smooth: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            direction: ltr;
            user-select: none;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-family: var(--font-display);
            background-image: radial-gradient(ellipse at 20% 50%, rgba(109, 40, 217, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(212, 163, 115, 0.04) 0%, transparent 50%);
            background-attachment: fixed;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 20px;
            opacity: 0.5;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-light);
        }

        /* ===== LOCK OVERLAY ===== */
        .lock-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            animation: overlayFadeIn 0.6s var(--transition-smooth);
            padding: 20px;
        }

        .lock-overlay.active {
            display: flex;
        }

        @keyframes overlayFadeIn {
            0% { opacity: 0; backdrop-filter: blur(0); }
            100% { opacity: 1; backdrop-filter: blur(24px); }
        }

        .lock-card {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 48px;
            padding: 48px 40px 40px;
            text-align: center;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            animation: cardPop 0.6s var(--transition-smooth);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        @keyframes cardPop {
            0% { opacity: 0; transform: scale(0.92) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .lock-logo {
            margin-bottom: 12px;
            position: relative;
        }

        .lock-logo .logo-main {
            font-family: var(--font-logo);
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0e6d3 0%, #c4a882 40%, #d4a373 70%, #f0e6d3 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite alternate;
            display: inline-block;
            line-height: 1.1;
        }

        .lock-logo .logo-sub {
            font-family: var(--font-logo);
            font-size: 1.6rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
            display: block;
            margin-top: -6px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.4);
        }

        .lock-logo .logo-tagline {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            margin-top: 8px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.25);
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .lock-icon {
            font-size: 2.8rem;
            margin: 8px 0 12px;
            display: block;
            animation: pulseLock 2.4s ease-in-out infinite;
        }

        @keyframes pulseLock {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.10); opacity: 1; }
        }

        .lock-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .lock-desc {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 28px;
            font-weight: 400;
        }

        .lock-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .lock-input-group input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            font-family: var(--font-display);
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .lock-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }

        .lock-input-group input:focus {
            border-color: var(--accent-light);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }

        .lock-input-group input:focus-visible {
            outline: none;
        }

        .lock-input-group .lock-btn-unlock {
            width: 100%;
            padding: 16px 20px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            color: white;
            font-size: 1rem;
            font-weight: 700;
            font-family: var(--font-display);
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            box-shadow: 0 8px 32px var(--accent-glow-strong);
            letter-spacing: 0.3px;
        }

        .lock-input-group .lock-btn-unlock:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 48px var(--accent-glow-strong);
        }

        .lock-input-group .lock-btn-unlock:active {
            transform: scale(0.96);
        }

        .lock-error {
            color: #f87171;
            font-size: 0.85rem;
            font-weight: 500;
            min-height: 28px;
            margin-top: 12px;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .lock-error.show {
            opacity: 1;
        }

        .lock-footer {
            margin-top: 24px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
        }

        /* ===== BOOK CONTAINER ===== */
        .book-container {
            width: 21cm;
            min-height: 29.7cm;
            max-width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 18px 18px 14px 18px;
            border: var(--border-glass);
            display: flex;
            flex-direction: column;
            transition: all 0.5s var(--transition-smooth);
            position: relative;
            backdrop-filter: blur(2px);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .book-container.locked-blur {
            filter: blur(6px) brightness(0.6);
            pointer-events: none;
            opacity: 0.3;
        }

        .book-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: var(--radius-card);
            padding: 2px;
            background: linear-gradient(135deg, rgba(109, 40, 217, 0.08), rgba(212, 163, 115, 0.08), rgba(109, 40, 217, 0.04));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .book-container:hover {
            box-shadow: var(--shadow-card-hover);
        }

        /* ===== BOOK VIEW ===== */
        .book-view {
            position: relative;
            width: 100%;
            background: var(--bg-editor);
            border-radius: var(--radius-view);
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.02), 0 8px 40px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex: 1;
            min-height: 60vh;
            touch-action: none;
            cursor: default;
            background: #ffffff;
            padding: 0;
            aspect-ratio: 21 / 29.7;
            transition: box-shadow 0.4s ease;
        }

        .book-view::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-view);
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
        }

        .page-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #ffffff;
            border-radius: inherit;
            min-height: 60vh;
            aspect-ratio: 21 / 29.7;
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            position: relative;
            border-radius: inherit;
            padding: 0;
            min-height: 60vh;
            overflow-y: auto;
            overflow-x: hidden;
            aspect-ratio: 21 / 29.7;
            scroll-behavior: smooth;
        }

        /* ===== PAGE DE GARDE ===== */
        .page-cover {
            width: 100%;
            height: 100%;
            min-height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #fafcff 0%, #f0f4fe 100%);
            border-radius: inherit;
            padding: 0;
            position: relative;
            overflow: hidden;
            aspect-ratio: 21 / 29.7;
            cursor: pointer;
        }

        .page-cover::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(109, 40, 217, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(212, 163, 115, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .page-cover img.cover-main {
            width: 100%;
            height: 100%;
            min-height: 60vh;
            object-fit: cover;
            border-radius: inherit;
            display: block;
            margin: 0;
            border: none;
            aspect-ratio: 21 / 29.7;
            position: relative;
            z-index: 2;
            filter: brightness(1.02) contrast(1.02);
            transition: transform 0.3s ease;
        }

        .page-cover img.cover-main:hover {
            transform: scale(1.01);
        }

        /* ===== EXERCICE ZONE — PLEINE IMAGE ===== */
        .exercise-zone {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            min-height: 0;
            padding: 0;
            border-bottom: none;
            cursor: pointer;
        }

        .exercise-zone .full-page-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #ffffff;
            border-radius: 0;
            transition: transform 0.3s ease;
        }

        .exercise-zone .full-page-image:hover {
            transform: scale(1.01);
        }

        .exercise-zone .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #c5d0e0;
            font-size: 1.4rem;
            font-weight: 400;
            background: linear-gradient(135deg, #fafcff, #f5f8fe);
            gap: 16px;
            font-family: var(--font-display);
            letter-spacing: 0.3px;
            padding: 40px;
            text-align: center;
            cursor: default;
        }

        .exercise-zone .image-placeholder span {
            font-size: 3.6rem;
            opacity: 0.5;
        }

        .exercise-zone .image-placeholder .hint {
            font-size: 1rem;
            color: #c5d0e0;
            font-style: italic;
        }

        .click-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .exercise-zone:hover .click-hint,
        .page-cover:hover .click-hint {
            opacity: 1;
        }

        /* ===== SOLUTION ZONE ===== */
        .solution-zone-wrapper {
            width: 100%;
            padding: 14px 20px 16px 20px;
            background: var(--bg-solution);
            border-radius: 0 0 var(--radius-view) var(--radius-view);
            transition: all 0.5s var(--transition-smooth);
            flex-shrink: 0;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-height: 600px;
            opacity: 1;
            transform: scaleY(1);
            transform-origin: top;
        }

        .solution-zone-wrapper.hidden {
            max-height: 0;
            opacity: 0;
            transform: scaleY(0);
            padding-top: 0;
            padding-bottom: 0;
            border-top: none;
            margin: 0;
            pointer-events: none;
            min-height: 0;
        }

        .solution-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 2px;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }

        .solution-header h4 {
            color: var(--accent);
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .solution-header h4::after {
            content: '✦';
            font-size: 0.7rem;
            -webkit-text-fill-color: var(--gold);
            opacity: 0.5;
        }

        .solution-image-container {
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 16px;
            padding: 12px;
            background: #ffffff;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.01);
            flex: 1;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .solution-image-container .solution-image {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 12px;
            margin: 4px 0;
            border: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }

        .solution-image-container .solution-image:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .solution-image-container .placeholder {
            color: #c5d0e0;
            font-style: italic;
            font-weight: 400;
            font-size: 0.95rem;
            text-align: center;
            padding: 16px 0;
            letter-spacing: 0.3px;
        }

        .solution-image-container .upload-btn {
            margin-top: 8px;
            border: none;
            border-radius: 60px;
            padding: 8px 20px;
            font-size: 0.78rem;
            font-weight: 600;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-display);
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            flex-shrink: 0;
        }

        .solution-image-container .upload-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35);
        }

        .solution-image-container .upload-btn:active {
            transform: scale(0.96);
        }

        .solution-image-container .upload-btn input {
            display: none;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .page-indicator {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 22px;
            border-radius: 80px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.02);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.01em;
        }

        .page-indicator .num {
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            color: white;
            padding: 2px 18px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 800;
            min-width: 44px;
            text-align: center;
            box-shadow: 0 6px 24px var(--accent-glow);
            letter-spacing: -0.02em;
        }

        .page-indicator .total {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .page-indicator .label {
            font-weight: 400;
            color: var(--text-muted);
        }

        .page-indicator .page-counter {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-left: 2px;
        }

        /* ===== SOLUTION TOP CONTROLS ===== */
        .solution-top-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .solution-top-controls button {
            border: none;
            border-radius: 60px;
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-display);
            letter-spacing: 0.3px;
            white-space: nowrap;
            height: 40px;
            min-width: 100px;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .solution-top-controls .btn-show-solution {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.25);
        }

        .solution-top-controls .btn-show-solution:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.35);
        }

        .solution-top-controls .btn-hide-solution {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
        }

        .solution-top-controls .btn-hide-solution:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(245, 158, 11, 0.35);
        }

        /* ===== LANG SWITCH ===== */
        .lang-switch {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 4px 14px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }

        .lang-switch button {
            background: transparent;
            border: none;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            color: #64748b;
            font-family: var(--font-display);
            height: 32px;
            display: flex;
            align-items: center;
            letter-spacing: 0.2px;
        }

        .lang-switch button.active {
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            color: white;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .lang-switch button:hover:not(.active) {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-primary);
        }

        /* ===== LOCK BTN ===== */
        .lock-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25) !important;
            color: white !important;
            border: none !important;
            border-radius: 60px !important;
            padding: 0 20px !important;
            height: 40px !important;
            font-size: 0.8rem !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            transition: all 0.3s var(--transition-smooth) !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            font-family: var(--font-display) !important;
            letter-spacing: 0.3px !important;
        }

        .lock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(245, 158, 11, 0.35) !important;
        }

        .lock-btn.locked {
            background: linear-gradient(135deg, #22c55e, #16a34a) !important;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.25) !important;
        }

        .lock-btn.locked:hover {
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.35) !important;
        }

        /* ===== SETTINGS TOGGLE ===== */
        .settings-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            color: white;
            border: none;
            font-size: 1.7rem;
            cursor: pointer;
            box-shadow: 0 8px 40px var(--accent-glow-strong);
            transition: all 0.4s var(--transition-smooth);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .settings-toggle:hover {
            transform: scale(1.08) rotate(90deg);
            box-shadow: 0 12px 56px var(--accent-glow-strong);
        }

        .settings-toggle .icon {
            transition: transform 0.5s var(--transition-smooth);
            display: inline-block;
        }

        .settings-toggle.active .icon {
            transform: rotate(90deg);
        }

        /* ===== BOTTOM ACTIONS (paramètres) ===== */
        .bottom-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px 10px;
            padding: 8px 4px 4px 4px;
            flex-shrink: 0;
            transition: all 0.5s var(--transition-smooth);
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }

        .bottom-actions.open {
            max-height: 600px;
            opacity: 1;
            margin-top: 10px;
            pointer-events: auto;
            padding: 14px 14px;
        }

        .bottom-actions button,
        .bottom-actions .upload-label {
            border: none;
            border-radius: 60px;
            padding: 0 20px;
            height: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: var(--font-display);
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: white;
            min-width: 60px;
            letter-spacing: 0.3px;
            transform: translateY(0);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
            background: #e2e8f0;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .bottom-actions button .icon,
        .bottom-actions .upload-label .icon {
            font-size: 1.05rem;
            line-height: 1;
        }

        .bottom-actions button .label,
        .bottom-actions .upload-label .label {
            font-size: 0.74rem;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .bottom-actions button::after,
        .bottom-actions .upload-label::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bottom-actions button:hover::after,
        .bottom-actions .upload-label:hover::after {
            opacity: 1;
        }

        .bottom-actions button:active,
        .bottom-actions .upload-label:active {
            transform: scale(0.95);
        }

        .btn-upload {
            background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
            color: white !important;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25) !important;
        }
        .btn-upload:hover {
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35) !important;
            transform: translateY(-2px);
        }

        .btn-add {
            background: linear-gradient(135deg, #22c55e, #16a34a) !important;
            color: white !important;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.25) !important;
        }
        .btn-add:hover {
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.35) !important;
            transform: translateY(-2px);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            color: white !important;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.25) !important;
        }
        .btn-delete:hover {
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.35) !important;
            transform: translateY(-2px);
        }

        .btn-prev,
        .btn-next {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            color: white !important;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25) !important;
        }
        .btn-prev:hover,
        .btn-next:hover {
            box-shadow: 0 8px 32px rgba(245, 158, 11, 0.35) !important;
            transform: translateY(-2px);
        }

        .btn-print {
            background: linear-gradient(135deg, var(--accent-light), var(--accent)) !important;
            color: white !important;
            box-shadow: 0 4px 20px var(--accent-glow) !important;
        }
        .btn-print:hover {
            box-shadow: 0 8px 32px var(--accent-glow-strong) !important;
            transform: translateY(-2px);
        }

        .btn-download {
            background: linear-gradient(135deg, #06b6d4, #0891b2) !important;
            color: white !important;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.25) !important;
        }
        .btn-download:hover {
            box-shadow: 0 8px 32px rgba(6, 182, 212, 0.35) !important;
            transform: translateY(-2px);
        }

        .btn-save {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: white !important;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25) !important;
        }
        .btn-save:hover {
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.35) !important;
            transform: translateY(-2px);
        }

        .btn-clear {
            background: linear-gradient(135deg, #ef4444, #b91c1c) !important;
            color: white !important;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3) !important;
        }
        .btn-clear:hover {
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.4) !important;
            transform: translateY(-2px);
        }

        .btn-validate {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9) !important;
            color: white !important;
            box-shadow: 0 4px 20px rgba(109, 40, 217, 0.3) !important;
        }
        .btn-validate:hover {
            box-shadow: 0 8px 32px rgba(109, 40, 217, 0.4) !important;
            transform: translateY(-2px);
        }

        .upload-label input {
            display: none;
        }

        .bottom-actions .separator {
            width: 1px;
            height: 32px;
            background: rgba(0, 0, 0, 0.06);
            margin: 0 4px;
            flex-shrink: 0;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            color: white;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s var(--transition-smooth);
            border: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
            max-width: 90%;
            font-family: var(--font-display);
            letter-spacing: 0.2px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: rgba(16, 185, 129, 0.92);
        }
        .toast.error {
            background: rgba(239, 68, 68, 0.92);
        }
        .toast.info {
            background: rgba(59, 130, 246, 0.92);
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(109, 40, 217, 0.08);
            z-index: 1001;
            display: none;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-light), var(--accent), var(--accent-light));
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 0 3px 3px 0;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .progress-bar.active {
            display: block;
        }

        /* ===== TRANSLATE BADGE ===== */
        .translate-badge {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(109, 40, 217, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: var(--accent);
            border: 1px solid rgba(109, 40, 217, 0.1);
            pointer-events: none;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.4s ease;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .translate-badge.active {
            opacity: 1;
        }

        /* ===== EMPTY PLACEHOLDER ===== */
        .empty-page-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #c5d0e0;
            font-size: 1.6rem;
            font-weight: 400;
            background: linear-gradient(135deg, #fafcff, #f5f8fe);
            letter-spacing: 0.5px;
            border-radius: inherit;
            padding: 40px 20px;
            text-align: center;
            font-family: var(--font-display);
            gap: 12px;
            min-height: 60vh;
        }

        .empty-page-placeholder span {
            font-size: 3.6rem;
            opacity: 0.6;
        }

        /* ===== LOCKED STATE ===== */
        .locked-state .bottom-actions button:not(.lock-btn):not(.btn-prev):not(.btn-next):not(.btn-print):not(.btn-download):not(.btn-save):not(.btn-validate),
        .locked-state .bottom-actions .upload-label:not(.btn-print):not(.btn-download):not(.btn-save):not(.btn-validate) {
            opacity: 0.35;
            pointer-events: none;
            transform: scale(0.94);
            filter: grayscale(0.3);
        }

        .locked-state .bottom-actions .lock-btn {
            pointer-events: auto;
        }

        .locked-state .bottom-actions .btn-prev,
        .locked-state .bottom-actions .btn-next,
        .locked-state .bottom-actions .btn-print,
        .locked-state .bottom-actions .btn-download,
        .locked-state .bottom-actions .btn-save,
        .locked-state .bottom-actions .btn-validate {
            pointer-events: auto;
            opacity: 1;
        }

        .locked-state .solution-image-container .upload-btn {
            pointer-events: none;
            opacity: 0.4;
            filter: grayscale(0.3);
        }

        .locked-state .solution-image-container .upload-btn input {
            display: none;
        }

        .locked-state .solution-top-controls button {
            pointer-events: auto !important;
            opacity: 1 !important;
        }

        .locked-state .exercise-zone .full-page-image {
            opacity: 0.7;
            cursor: default;
        }

        .locked-state .exercise-zone .click-hint {
            display: none;
        }

        /* ===== RTL ARABIC ===== */
        .lang-ar .solution-image-container .placeholder {
            direction: rtl;
            font-family: 'Noto Naskh Arabic', var(--font-display), system-ui, sans-serif;
        }

        .lang-ar .page-indicator .num {
            font-family: var(--font-display);
        }

        /* ===== LIGHTBOX ===== */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 40px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .lightbox-overlay.open {
            display: flex;
            opacity: 1;
        }

        .lightbox-overlay img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: #ffffff;
            padding: 8px;
            transform: scale(0.95);
            transition: transform 0.4s var(--transition-smooth);
        }

        .lightbox-overlay.open img {
            transform: scale(1);
        }

        .lightbox-overlay .close-btn {
            position: absolute;
            top: 32px;
            right: 44px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: white;
            font-size: 2.6rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lightbox-overlay .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.06) rotate(90deg);
        }

        /* ===== PRINT ===== */
        @media print {
            @page {
                margin: 0;
                size: A4;
            }
            html,
            body {
                margin: 0;
                padding: 0;
                background: white;
                min-height: 100vh;
                height: 100%;
                display: block;
            }
            .book-container {
                width: 100%;
                height: 100vh;
                min-height: auto;
                padding: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
                background: white;
                display: block;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .book-container::before {
                display: none;
            }
            .book-view {
                border-radius: 0;
                box-shadow: none;
                margin: 0;
                padding: 0;
                min-height: 100vh;
                height: 100vh;
                aspect-ratio: auto;
                overflow: hidden;
                background: white;
            }
            .book-view::after {
                display: none;
            }
            .page-wrapper {
                min-height: 100vh;
                height: 100vh;
                aspect-ratio: auto;
                border-radius: 0;
                background: white;
            }
            .page-content {
                min-height: 100vh;
                height: 100vh;
                aspect-ratio: auto;
                border-radius: 0;
                overflow: hidden;
                background: white;
            }
            .page-cover {
                min-height: 100vh;
                height: 100vh;
                aspect-ratio: auto;
                border-radius: 0;
            }
            .page-cover img.cover-main {
                min-height: 100vh;
                height: 100vh;
                aspect-ratio: auto;
                object-fit: contain;
                border-radius: 0;
            }
            .exercise-zone {
                min-height: 0;
                padding: 0;
                border-bottom: none;
                background: white;
                flex: 1;
            }
            .exercise-zone .full-page-image {
                width: 100%;
                height: 100%;
                object-fit: contain;
                border-radius: 0;
            }
            .exercise-zone .image-placeholder {
                display: none;
            }
            .solution-zone-wrapper {
                display: block !important;
                max-height: none !important;
                opacity: 1 !important;
                transform: scaleY(1) !important;
                padding: 10px 16px !important;
                border-top: 1px solid #e0e0e0 !important;
                pointer-events: auto !important;
                background: white;
                border-radius: 0;
                flex: 0 0 auto;
                min-height: 0;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .solution-zone-wrapper.hidden {
                display: none !important;
            }
            .solution-image-container {
                border: none;
                padding: 0;
                box-shadow: none;
                min-height: 0;
                background: white;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .solution-image-container .solution-image {
                max-height: 280px;
                max-width: 100%;
                height: auto;
                width: auto;
                object-fit: contain;
                border: none;
                border-radius: 0;
                margin: 0 auto;
                display: block;
                box-shadow: none;
            }
            .solution-header h4 {
                font-size: 1rem;
                -webkit-text-fill-color: var(--accent);
            }
            .solution-header h4::after {
                display: none;
            }
            .top-bar,
            .bottom-actions,
            .settings-toggle,
            .progress-bar,
            .translate-badge,
            .lightbox-overlay,
            .lock-overlay {
                display: none !important;
            }
            .solution-image-container .upload-btn {
                display: none !important;
            }
            .placeholder {
                display: none !important;
            }
            .click-hint {
                display: none !important;
            }
        }

        /* ===== DOWNLOAD A4 STYLES ===== */
        .download-a4 {
            width: 21cm;
            min-height: 29.7cm;
            margin: 0 auto;
            padding: 0;
            background: white;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            font-family: var(--font-display);
        }
        .download-a4 .exercise-zone {
            padding: 0;
            flex: 1;
            border-bottom: none;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .download-a4 .exercise-zone img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border: none;
            border-radius: 0;
        }
        .download-a4 .solution-zone-wrapper {
            padding: 12px 16px;
            flex: 0 0 auto;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .download-a4 .solution-image {
            max-width: 100%;
            max-height: 50vh;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            border: none;
        }
        .download-a4 .cover-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .download-a4 .solution-header h4 {
            font-size: 1rem;
            margin-bottom: 8px;
            -webkit-text-fill-color: var(--accent);
        }
        .download-a4 .solution-header h4::after {
            display: none;
        }
        .download-a4 .solution-image-container {
            border: none;
            padding: 0;
            box-shadow: none;
            min-height: 0;
            background: white;
        }
        .download-a4 .placeholder {
            display: none;
        }
        .download-a4 .upload-btn {
            display: none !important;
        }
        .download-a4 .click-hint {
            display: none !important;
        }

        /* ===== RESPONSIVE ===== */
        @media screen and (max-width: 600px) {
            html,
            body {
                padding: 4px;
                align-items: flex-start;
                background: #ffffff;
            }
            .book-container {
                width: 100%;
                min-height: 100vh;
                padding: 10px 10px 8px 10px;
                border-radius: 20px 10px 10px 20px;
                box-shadow: none;
                border: none;
                background: #ffffff;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .book-container::before {
                display: none;
            }
            .book-view {
                min-height: 55vh;
                height: 55vh;
                border-radius: 16px;
                margin-bottom: 8px;
                padding: 0;
                aspect-ratio: auto;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            }
            .page-content {
                min-height: 55vh;
                aspect-ratio: auto;
            }
            .page-cover {
                min-height: 55vh;
                aspect-ratio: auto;
            }
            .page-cover img.cover-main {
                min-height: 55vh;
                aspect-ratio: auto;
            }
            .bottom-actions button,
            .bottom-actions .upload-label {
                padding: 0 14px;
                height: 34px;
                font-size: 0.7rem;
                min-width: 36px;
                gap: 4px;
            }
            .bottom-actions button .label,
            .bottom-actions .upload-label .label {
                font-size: 0.62rem;
                letter-spacing: 0.2px;
            }
            .bottom-actions.open {
                padding: 10px 8px;
                gap: 6px 6px;
                border-radius: 16px;
            }
            .bottom-actions .separator {
                height: 22px;
                margin: 0 2px;
            }
            .page-indicator {
                font-size: 0.75rem;
                padding: 4px 14px;
                gap: 6px;
                border-radius: 60px;
            }
            .page-indicator .num {
                font-size: 1rem;
                padding: 2px 12px;
                min-width: 30px;
            }
            .top-bar {
                margin-bottom: 6px;
                gap: 4px;
            }
            .top-bar-left {
                gap: 4px;
            }

            // 1. STOCKAGE INDEXEDDB (identique pour les deux fichiers)

            class ImageStorage {
                constructor() {
                    this.db = null;
                    this.storeName = 'pages';
                    this.dbName = 'CarnetA4_100_v8';
                    this.version = 10;
                    this.ready = false;
                    this.initPromise = null;
                    this.MAX_IMAGES = 100;
                }

                init() {
                    if (this.initPromise) return this.initPromise;
                    this.initPromise = new Promise((resolve, reject) => {
                        const request = indexedDB.open(this.dbName, this.version);

                        request.onerror = (e) => {
                            console.error('❌ Erreur IndexedDB:', e.target.error);
                            reject(e.target.error);
                        };

                        request.onsuccess = (e) => {
                            this.db = e.target.result;
                            this.ready = true;
                            console.log('✅ IndexedDB prêt');
                            resolve();
                        };

                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(this.storeName)) {
                                const store = db.createObjectStore(this.storeName, {
                                    keyPath: 'id',
                                    autoIncrement: true
                                });
                                store.createIndex('timestamp', 'timestamp', { unique: false });
                                store.createIndex('pageIndex', 'pageIndex', { unique: false });
                                console.log('📦 ObjectStore créé');
                            } else {
                                const store = e.target.transaction.objectStore(this.storeName);
                                if (!store.indexNames.contains('timestamp')) {
                                    store.createIndex('timestamp', 'timestamp', { unique: false });
                                }
                                if (!store.indexNames.contains('pageIndex')) {
                                    store.createIndex('pageIndex', 'pageIndex', { unique: false });
                                }
                            }
                        };
                    });
                    return this.initPromise;
                }

                async savePages(pages) {
                    await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readwrite');
                        const store = tx.objectStore(this.storeName);

                        const clearRequest = store.clear();
                        clearRequest.onsuccess = () => {
                            let saved = 0;
                            const total = Math.min(pages.length, this.MAX_IMAGES);

                            for (let i = 0; i < total; i++) {
                                const page = pages[i];
                                const data = {
                                    content: page.content || '',
                                    solution: page.solution || '',
                                    imageData: page.imageData || null,
                                    isCover: page.isCover || false,
                                    timestamp: Date.now() + i,
                                    pageIndex: i
                                };
                                const addRequest = store.add(data);
                                addRequest.onsuccess = () => {
                                    saved++;
                                    if (saved === total) {
                                        resolve();
                                    }
                                };
                                addRequest.onerror = (e) => {
                                    console.error('Erreur sauvegarde page', i, e);
                                    reject(e.target.error);
                                };
                            }

                            if (total === 0) resolve();
                        };
                        clearRequest.onerror = (e) => reject(e.target.error);
                    });
                }

                async loadPages() {
                    await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readonly');
                        const store = tx.objectStore(this.storeName);
                        const index = store.index('pageIndex');
                        const request = index.getAll();

                        request.onsuccess = () => {
                            const results = request.result;
                            results.sort((a, b) => a.pageIndex - b.pageIndex);
                            const pages = results.map(item => ({
                                content: item.content || '',
                                solution: item.solution || '',
                                imageData: item.imageData || null,
                                isCover: item.isCover || false
                            }));
                            resolve(pages);
                        };
                        request.onerror = (e) => {
                            console.error('Erreur chargement:', e);
                            resolve([]);
                        };
                    });
                }

                async clear() {
                    await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readwrite');
                        const store = tx.objectStore(this.storeName);
                        const request = store.clear();
                        request.onsuccess = () => resolve();
                        request.onerror = (e) => reject(e.target.error);
                    });
                }

                async getStats() {
                    await this.init();
                    return new Promise((resolve) => {
                        const tx = this.db.transaction(this.storeName, 'readonly');
                        const store = tx.objectStore(this.storeName);
                        const count = store.count();
                        count.onsuccess = () => {
                            resolve({ count: count.result, max: this.MAX_IMAGES });
                        };
                        count.onerror = () => resolve({ count: 0, max: this.MAX_IMAGES });
                    });
                }
