<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Appixo Book · Paramètres</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg-body: #e8ecf2;
            --text-primary: #0a1628;
            --text-muted: #8a9bb5;
            --accent: #6d28d9;
            --accent-light: #8b5cf6;
            --accent-glow: rgba(109,40,217,0.25);
            --accent-glow-strong: rgba(109,40,217,0.35);
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --radius: 60px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            --transition: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html, body {
            width: 100%; min-height: 100vh;
            background: var(--bg-body);
            display: flex; justify-content: center; align-items: center;
            padding: 8px;
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== LOCK OVERLAY ===== */
        .lock-overlay {
            position: fixed; inset: 0; z-index: 9999;
            display: none;
            justify-content: center; align-items: center;
            background: rgba(10,22,40,0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 20px;
        }
        .lock-overlay.active { display: flex; }
        .lock-card {
            max-width: 400px; width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 48px;
            padding: 32px 24px 28px;
            text-align: center;
            box-shadow: 0 40px 120px rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .lock-logo .logo-main {
            font-size: 2.4rem; font-weight: 700;
            background: linear-gradient(135deg, #f0e6d3 0%, #c4a882 40%, #d4a373 70%, #f0e6d3 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite alternate;
            display: inline-block;
            line-height: 1.1;
        }
        .lock-logo .logo-sub {
            font-size: 1.2rem; font-weight: 400;
            color: rgba(255,255,255,0.4);
            letter-spacing: 4px;
            display: block;
            margin-top: -4px;
        }
        .lock-logo .logo-tagline {
            font-size: 0.6rem; font-weight: 500;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
            margin-top: 6px;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .lock-icon {
            font-size: 2.2rem; margin: 10px 0 8px; display: block;
            animation: pulseLock 2.4s ease-in-out infinite;
        }
        @keyframes pulseLock {
            0%,100% { transform: scale(1); opacity:0.8; }
            50% { transform: scale(1.10); opacity:1; }
        }
        .lock-title { font-size: 1.1rem; font-weight:700; color:#fff; margin-bottom:4px; }
        .lock-desc { font-size:0.8rem; color:rgba(255,255,255,0.5); margin-bottom:20px; }
        .lock-input-group { display:flex; flex-direction:column; gap:12px; width:100%; }
        .lock-input-group input {
            width:100%; padding:14px 18px;
            border-radius:var(--radius);
            border:1px solid rgba(255,255,255,0.12);
            background:rgba(255,255,255,0.06);
            color:#fff; font-size:0.95rem; font-weight:500;
            outline:none; transition:all 0.3s ease;
            font-family:var(--font);
        }
        .lock-input-group input:focus {
            border-color:var(--accent-light);
            box-shadow:0 0 0 4px rgba(139,92,246,0.15);
            background:rgba(255,255,255,0.08);
        }
        .lock-input-group .lock-btn-unlock {
            width:100%; padding:14px 18px;
            border-radius:var(--radius);
            border:none;
            background:linear-gradient(135deg,var(--accent-light),var(--accent));
            color:white; font-size:0.95rem; font-weight:700;
            cursor:pointer; transition:all 0.3s var(--transition);
            box-shadow:0 8px 32px var(--accent-glow-strong);
            font-family:var(--font);
        }
        .lock-input-group .lock-btn-unlock:hover {
            transform:translateY(-2px) scale(1.02);
            box-shadow:0 12px 48px var(--accent-glow-strong);
        }
        .lock-error {
            color:#f87171; font-size:0.8rem; font-weight:500;
            min-height:24px; margin-top:8px;
            opacity:0; transition:opacity 0.3s ease;
        }
        .lock-error.show { opacity:1; }
        .lock-footer {
            margin-top:16px; font-size:0.6rem;
            color:rgba(255,255,255,0.15);
            letter-spacing:1px;
        }

        /* ===== BOOK CONTAINER ===== */
        .book-container {
            width:100%; min-height:100vh;
            max-width:100%;
            background:rgba(255,255,255,0.92);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border-radius:28px 14px 14px 28px;
            padding:12px 12px 10px 12px;
            border:1px solid rgba(255,255,255,0.7);
            display:flex; flex-direction:column;
            transition:all 0.5s var(--transition);
            box-shadow:0 20px 80px rgba(0,0,0,0.06);
        }
        .book-container.locked-blur {
            filter:blur(6px) brightness(0.6);
            pointer-events:none; opacity:0.3;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:10px; padding:0 2px;
            flex-wrap:wrap; gap:6px;
            flex-shrink:0;
        }
        .top-bar-left {
            display:flex; align-items:center; gap:8px; flex-wrap:wrap;
        }
        .page-indicator {
            background:rgba(255,255,255,0.6);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            padding:6px 16px;
            border-radius:var(--radius);
            font-size:0.8rem; font-weight:600;
            color:var(--text-primary);
            border:1px solid rgba(255,255,255,0.5);
            display:flex; align-items:center; gap:8px;
        }
        .page-indicator .num {
            background:linear-gradient(135deg,var(--accent-light),var(--accent));
            color:white;
            padding:2px 14px;
            border-radius:var(--radius);
            font-size:1.1rem; font-weight:800;
            min-width:34px; text-align:center;
            box-shadow:0 4px 20px var(--accent-glow);
        }
        .page-indicator .total { color:var(--text-primary); font-weight:500; }
        .page-indicator .label { color:var(--text-muted); font-weight:400; }
        .page-indicator .page-counter { font-size:0.65rem; color:var(--text-muted); font-weight:400; }

        .solution-top-controls { display:flex; gap:4px; align-items:center; }
        .solution-top-controls button {
            border:none; border-radius:var(--radius);
            padding:4px 12px;
            font-size:0.65rem; font-weight:700;
            cursor:pointer; transition:all 0.3s var(--transition);
            display:inline-flex; align-items:center; gap:4px;
            font-family:var(--font);
            white-space:nowrap; height:28px;
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
        }
        .solution-top-controls .btn-show-solution {
            background:linear-gradient(135deg,#22c55e,#16a34a);
            color:white;
            box-shadow:0 4px 16px rgba(34,197,94,0.2);
        }
        .solution-top-controls .btn-hide-solution {
            background:linear-gradient(135deg,#f59e0b,#d97706);
            color:white;
            box-shadow:0 4px 16px rgba(245,158,11,0.2);
        }

        .lang-switch {
            display:flex; gap:2px;
            background:rgba(255,255,255,0.5);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            padding:3px 10px;
            border-radius:var(--radius);
            border:1px solid rgba(255,255,255,0.4);
            flex-shrink:0;
        }
        .lang-switch button {
            background:transparent; border:none;
            padding:3px 10px;
            border-radius:40px;
            font-weight:700; font-size:0.65rem;
            cursor:pointer; transition:all 0.3s var(--transition);
            color:#64748b;
            font-family:var(--font);
            height:24px; display:flex; align-items:center;
        }
        .lang-switch button.active {
            background:linear-gradient(135deg,var(--accent-light),var(--accent));
            color:white;
            box-shadow:0 4px 16px var(--accent-glow);
        }

        /* ===== BOOK VIEW ===== */
        .book-view {
            position:relative; width:100%;
            background:#ffffff;
            border-radius:20px;
            box-shadow:inset 0 0 0 1px rgba(0,0,0,0.02);
            overflow:hidden;
            margin-bottom:10px;
            display:flex; justify-content:center; align-items:flex-start;
            flex:1; min-height:55vh;
            touch-action:none; cursor:default;
            padding:0;
            transition:box-shadow 0.4s ease;
        }
        .page-content {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            background:#ffffff;
            position:relative;
            border-radius:inherit;
            padding:0;
            min-height:55vh;
            overflow-y:auto; overflow-x:hidden;
            scroll-behavior:smooth;
        }

        /* ===== PAGE DE GARDE ===== */
        .page-cover {
            width:100%; height:100%; min-height:55vh;
            display:flex; justify-content:center; align-items:center;
            background:linear-gradient(145deg,#fafcff 0%,#f0f4fe 100%);
            border-radius:inherit;
            padding:0; position:relative; overflow:hidden;
            cursor:pointer;
        }
        .page-cover img.cover-main {
            width:100%; height:100%; min-height:55vh;
            object-fit:contain;
            border-radius:inherit;
            display:block; margin:0; border:none;
            transition:transform 0.3s ease;
        }
        .page-cover img.cover-main:hover { transform:scale(1.01); }

        /* ===== EXERCICE ZONE ===== */
        .exercise-zone {
            width:100%; flex:1;
            display:flex; align-items:center; justify-content:center;
            background:#ffffff;
            position:relative; overflow:hidden;
            min-height:0; padding:0; border-bottom:none;
            cursor:pointer;
        }
        .exercise-zone .full-page-image {
            width:100%; height:100%;
            object-fit:contain;
            display:block; background:#ffffff;
            border-radius:0;
            transition:transform 0.3s ease;
        }
        .exercise-zone .full-page-image:hover { transform:scale(1.01); }
        .exercise-zone .image-placeholder {
            width:100%; height:100%;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            color:#c5d0e0; font-size:1.1rem; font-weight:400;
            background:linear-gradient(135deg,#fafcff,#f5f8fe);
            gap:12px; padding:24px; text-align:center;
            cursor:default;
        }
        .exercise-zone .image-placeholder span { font-size:2.8rem; opacity:0.5; }
        .exercise-zone .image-placeholder .hint { font-size:0.85rem; color:#c5d0e0; font-style:italic; }

        .click-hint {
            position:absolute; bottom:14px; right:14px;
            background:rgba(0,0,0,0.5);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            color:white; padding:4px 12px; border-radius:30px;
            font-size:0.6rem; font-weight:500; letter-spacing:0.3px;
            pointer-events:none; opacity:0; transition:opacity 0.4s ease;
            border:1px solid rgba(255,255,255,0.1);
        }
        .exercise-zone:hover .click-hint, .page-cover:hover .click-hint { opacity:1; }

        /* ===== SOLUTION ZONE ===== */
        .solution-zone-wrapper {
            width:100%; padding:10px 14px 12px;
            background:#f5f7fb;
            border-radius:0 0 20px 20px;
            transition:all 0.5s var(--transition);
            flex-shrink:0; border-top:1px solid rgba(0,0,0,0.04);
            min-height:0; display:flex; flex-direction:column;
            overflow:hidden;
            max-height:500px; opacity:1; transform:scaleY(1);
            transform-origin:top;
        }
        .solution-zone-wrapper.hidden {
            max-height:0; opacity:0; transform:scaleY(0);
            padding:0; border-top:none; margin:0;
            pointer-events:none; min-height:0;
        }
        .solution-header {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:8px; padding:0 2px;
            flex-wrap:wrap; gap:6px; flex-shrink:0;
        }
        .solution-header h4 {
            color:var(--accent); font-size:0.95rem;
            display:flex; align-items:center; gap:8px;
            font-weight:700;
            background:linear-gradient(135deg,var(--accent),var(--accent-light));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .solution-header h4::after {
            content:'✦'; font-size:0.6rem;
            -webkit-text-fill-color:#d4a373; opacity:0.5;
        }
        .solution-image-container {
            position:relative; border:1px solid rgba(0,0,0,0.04);
            border-radius:14px; padding:10px;
            background:#ffffff; min-height:80px;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            transition:all 0.3s ease;
            flex:1; backdrop-filter:blur(2px);
            -webkit-backdrop-filter:blur(2px);
        }
        .solution-image-container .solution-image {
            max-width:100%; max-height:220px;
            object-fit:contain; border-radius:10px;
            margin:4px 0; border:1px solid rgba(0,0,0,0.04);
            cursor:pointer; transition:all 0.3s var(--transition);
        }
        .solution-image-container .solution-image:hover {
            transform:scale(1.02);
            box-shadow:0 8px 32px rgba(0,0,0,0.06);
        }
        .solution-image-container .placeholder {
            color:#c5d0e0; font-style:italic; font-weight:400;
            font-size:0.85rem; text-align:center; padding:12px 0;
        }
        .solution-image-container .upload-btn {
            margin-top:6px; border:none; border-radius:var(--radius);
            padding:6px 18px; font-size:0.72rem; font-weight:600;
            background:linear-gradient(135deg,#3b82f6,#2563eb);
            color:white; cursor:pointer; transition:all 0.3s var(--transition);
            box-shadow:0 4px 16px rgba(59,130,246,0.2);
            display:inline-flex; align-items:center; gap:4px;
            font-family:var(--font);
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
            flex-shrink:0;
        }
        .solution-image-container .upload-btn:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(59,130,246,0.3);
        }
        .solution-image-container .upload-btn input { display:none; }

        /* ===== BOTTOM ACTIONS ===== */
        .bottom-actions {
            display:flex; flex-wrap:wrap;
            justify-content:center; align-items:center;
            gap:6px 8px;
            padding:6px 2px 2px;
            flex-shrink:0;
            transition:all 0.5s var(--transition);
            overflow:hidden;
            max-height:0; opacity:0; margin-top:0;
            pointer-events:none;
            background:rgba(255,255,255,0.4);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border-radius:18px;
            border:1px solid rgba(255,255,255,0.3);
        }
        .bottom-actions.open {
            max-height:500px; opacity:1; margin-top:6px;
            pointer-events:auto; padding:10px 10px;
        }
        .bottom-actions button,
        .bottom-actions .upload-label {
            border:none; border-radius:var(--radius);
            padding:0 14px; height:34px;
            font-size:0.7rem; font-weight:600;
            font-family:var(--font);
            cursor:pointer; transition:all 0.3s var(--transition);
            display:inline-flex; align-items:center; justify-content:center;
            gap:4px; color:white; min-width:40px;
            letter-spacing:0.2px;
            background:#e2e8f0; color:#1e293b;
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
            box-shadow:0 2px 12px rgba(0,0,0,0.04);
        }
        .bottom-actions button .icon { font-size:0.9rem; line-height:1; }
        .bottom-actions button .label { font-size:0.62rem; font-weight:600; letter-spacing:0.2px; }
        .bottom-actions button:active { transform:scale(0.94); }

        .btn-upload {
            background:linear-gradient(135deg,#3b82f6,#2563eb) !important;
            color:white !important;
            box-shadow:0 4px 16px rgba(59,130,246,0.2) !important;
        }
        .btn-upload:hover { box-shadow:0 8px 24px rgba(59,130,246,0.3) !important; transform:translateY(-2px); }
        .btn-add {
            background:linear-gradient(135deg,#22c55e,#16a34a) !important;
            color:white !important;
            box-shadow:0 4px 16px rgba(34,197,94,0.2) !important;
        }
        .btn-add:hover { box-shadow:0 8px 24px rgba(34,197,94,0.3) !important; transform:translateY(-2px); }
        .btn-delete {
            background:linear-gradient(135deg,#ef4444,#dc2626) !important;
            color:white !important;
            box-shadow:0 4px 16px rgba(239,68,68,0.2) !important;
        }
        .btn-delete:hover { box-shadow:0 8px 24px rgba(239,68,68,0.3) !important; transform:translateY(-2px); }
        .btn-clear {
            background:linear-gradient(135deg,#ef4444,#b91c1c) !important;
            color:white !important;
            box-shadow:0 4px 16px rgba(239,68,68,0.25) !important;
        }
        .btn-clear:hover { box-shadow:0 8px 24px rgba(239,68,68,0.35) !important; transform:translateY(-2px); }
        .btn-prev, .btn-next {
            background:linear-gradient(135deg,#f59e0b,#d97706) !important;
            color:white !important;
            box-shadow:0 4px 16px rgba(245,158,11,0.2) !important;
        }
        .btn-prev:hover, .btn-next:hover {
            box-shadow:0 8px 24px rgba(245,158,11,0.3) !important;
            transform:translateY(-2px);
        }
        .btn-save {
            background:linear-gradient(135deg,#10b981,#059669) !important;
            color:white !important;
            box-shadow:0 4px 16px rgba(16,185,129,0.2) !important;
        }
        .btn-save:hover { box-shadow:0 8px 24px rgba(16,185,129,0.3) !important; transform:translateY(-2px); }
        .btn-print {
            background:linear-gradient(135deg,var(--accent-light),var(--accent)) !important;
            color:white !important;
            box-shadow:0 4px 16px var(--accent-glow) !important;
        }
        .btn-print:hover { box-shadow:0 8px 24px var(--accent-glow-strong) !important; transform:translateY(-2px); }
        .btn-download {
            background:linear-gradient(135deg,#06b6d4,#0891b2) !important;
            color:white !important;
            box-shadow:0 4px 16px rgba(6,182,212,0.2) !important;
        }
        .btn-download:hover { box-shadow:0 8px 24px rgba(6,182,212,0.3) !important; transform:translateY(-2px); }
        .btn-validate {
            background:linear-gradient(135deg,#8b5cf6,#6d28d9) !important;
            color:white !important;
            box-shadow:0 4px 16px rgba(109,40,217,0.25) !important;
        }
        .btn-validate:hover { box-shadow:0 8px 24px rgba(109,40,217,0.35) !important; transform:translateY(-2px); }

        .lock-btn {
            background:linear-gradient(135deg,#f59e0b,#d97706) !important;
            color:white !important;
            box-shadow:0 4px 16px rgba(245,158,11,0.2) !important;
        }
        .lock-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(245,158,11,0.3) !important; }
        .lock-btn.locked {
            background:linear-gradient(135deg,#22c55e,#16a34a) !important;
            box-shadow:0 4px 16px rgba(34,197,94,0.2) !important;
        }
        .lock-btn.locked:hover { box-shadow:0 8px 24px rgba(34,197,94,0.3) !important; }

        .upload-label input { display:none; }
        .bottom-actions .separator {
            width:1px; height:24px;
            background:rgba(0,0,0,0.06);
            margin:0 2px; flex-shrink:0;
        }

        /* ===== SETTINGS TOGGLE ===== */
        .settings-toggle {
            position:fixed; bottom:20px; right:20px;
            width:52px; height:52px;
            border-radius:50%;
            background:linear-gradient(135deg,var(--accent-light),var(--accent));
            color:white; border:none; font-size:1.5rem;
            cursor:pointer; box-shadow:0 6px 32px var(--accent-glow-strong);
            transition:all 0.4s var(--transition);
            z-index:100;
            display:flex; align-items:center; justify-content:center;
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.2);
        }
        .settings-toggle:hover { transform:scale(1.08) rotate(90deg); }
        .settings-toggle .icon { transition:transform 0.5s var(--transition); display:inline-block; }
        .settings-toggle.active .icon { transform:rotate(90deg); }

        /* ===== LOCKED STATE ===== */
        .locked-state .bottom-actions button:not(.lock-btn):not(.btn-prev):not(.btn-next):not(.btn-print):not(.btn-download):not(.btn-save):not(.btn-validate),
        .locked-state .bottom-actions .upload-label {
            opacity:0.35; pointer-events:none; transform:scale(0.94); filter:grayscale(0.3);
        }
        .locked-state .bottom-actions .lock-btn { pointer-events:auto; }
        .locked-state .bottom-actions .btn-prev,
        .locked-state .bottom-actions .btn-next,
        .locked-state .bottom-actions .btn-print,
        .locked-state .bottom-actions .btn-download,
        .locked-state .bottom-actions .btn-save,
        .locked-state .bottom-actions .btn-validate {
            pointer-events:auto; opacity:1;
        }
        .locked-state .solution-image-container .upload-btn {
            pointer-events:none; opacity:0.4; filter:grayscale(0.3);
        }
        .locked-state .solution-image-container .upload-btn input { display:none; }
        .locked-state .solution-top-controls button { pointer-events:auto !important; opacity:1 !important; }
        .locked-state .exercise-zone .full-page-image { opacity:0.7; cursor:default; }
        .locked-state .exercise-zone .click-hint { display:none; }

        /* ===== TOAST ===== */
        .toast {
            position:fixed; bottom:90px; left:50%;
            transform:translateX(-50%) translateY(100px);

    <script>
        (function() {
            'use strict';

            // =====================================================
            // STOCKAGE INDEXEDDB
            // =====================================================
            class ImageStorage {
                constructor() {
                    this.db = null;
                    this.storeName = 'pages';
                    this.dbName = 'CarnetA4_100_v8';
                    this.version = 10;
                    this.ready = false;
                    this.initPromise = null;
                    this.MAX_IMAGES = 100;
                }

                init() {
                    if (this.initPromise) return this.initPromise;
                    this.initPromise = new Promise((resolve, reject) => {
                        try {
                            const request = indexedDB.open(this.dbName, this.version);
                            request.onerror = (e) => {
                                console.error('❌ Erreur IndexedDB:', e.target.error);
                                reject(e.target.error);
                            };
                            request.onsuccess = (e) => {
                                this.db = e.target.result;
                                this.ready = true;
                                console.log('✅ IndexedDB prêt');
                                resolve();
                            };
                            request.onupgradeneeded = (e) => {
                                const db = e.target.result;
                                if (!db.objectStoreNames.contains(this.storeName)) {
                                    const store = db.createObjectStore(this.storeName, {
                                        keyPath: 'id',
                                        autoIncrement: true
                                    });
                                    store.createIndex('timestamp', 'timestamp', { unique: false });
                                    store.createIndex('pageIndex', 'pageIndex', { unique: false });
                                    console.log('📦 ObjectStore créé');
                                } else {
                                    const store = e.target.transaction.objectStore(this.storeName);
                                    if (!store.indexNames.contains('timestamp')) {
                                        store.createIndex('timestamp', 'timestamp', { unique: false });
                                    }
                                    if (!store.indexNames.contains('pageIndex')) {
                                        store.createIndex('pageIndex', 'pageIndex', { unique: false });
                                    }
                                }
                            };
                        } catch (e) {
                            console.warn('⚠️ IndexedDB non supporté');
                            reject(e);
                        }
                    });
                    return this.initPromise;
                }

                async savePages(pages) {
                    await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readwrite');
                        const store = tx.objectStore(this.storeName);
                        const clearRequest = store.clear();
                        clearRequest.onsuccess = () => {
                            let saved = 0;
                            const total = Math.min(pages.length, this.MAX_IMAGES);
                            for (let i = 0; i < total; i++) {
                                const page = pages[i];
                                const data = {
                                    content: page.content || '',
                                    solution: page.solution || '',
                                    imagePath: page.imagePath || null,
                                    isCover: page.isCover || false,
                                    timestamp: Date.now() + i,
                                    pageIndex: i
                                };
                                const addRequest = store.add(data);
                                addRequest.onsuccess = () => {
                                    saved++;
                                    if (saved === total) resolve();
                                };
                                addRequest.onerror = (e) => {
                                    console.error('Erreur sauvegarde page', i, e);
                                    reject(e.target.error);
                                };
                            }
                            if (total === 0) resolve();
                        };
                        clearRequest.onerror = (e) => reject(e.target.error);
                    });
                }

                async loadPages() {
                    await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readonly');
                        const store = tx.objectStore(this.storeName);
                        const index = store.index('pageIndex');
                        const request = index.getAll();
                        request.onsuccess = () => {
                            const results = request.result;
                            results.sort((a, b) => a.pageIndex - b.pageIndex);
                            const pages = results.map(item => ({
                                content: item.content || '',
                                solution: item.solution || '',
                                imagePath: item.imagePath || null,
                                isCover: item.isCover || false
                            }));
                            resolve(pages);
                        };
                        request.onerror = (e) => {
                            console.error('Erreur chargement:', e);
                            resolve([]);
                        };
                    });
                }

                async clear() {
                    await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction(this.storeName, 'readwrite');
                        const store = tx.objectStore(this.storeName);
                        const request = store.clear();
                        request.onsuccess = () => resolve();
                        request.onerror = (e) => reject(e.target.error);
                    });
                }

                async getStats() {
                    await this.init();
                    return new Promise((resolve) => {
                        const tx = this.db.transaction(this.storeName, 'readonly');
                        const store = tx.objectStore(this.storeName);
                        const count = store.count();
                        count.onsuccess = () => resolve({ count: count.result, max: this.MAX_IMAGES });
                        count.onerror = () => resolve({ count: 0, max: this.MAX_IMAGES });
                    });
                }
            }

                    dropHint: 'اسحب صورة هنا أو انقر على "صورة"',
                    noImagePage: 'لا توجد صورة في هذه الصفحة',
                    lock: 'قفل', unlock: 'فتح',
                    wrongPassword: '❌ كلمة المرور غير صحيحة!',
                    locked: '🔒 الدفتر مقفل', unlocked: '🔓 الدفتر مفتوح',
                    showSolution: '👁️ عرض', hideSolution: '🔽 إخفاء',
                    solutionHidden: '🔽 الحل مخفي',
                    solutionShown: '💡 الحل معروض',
                    translated: '🌐 مترجم',
                    clickToZoom: 'انقر للتكبير',
                    validate: '✅ تأكيد',
                    validateMsg: '✅ تم حفظ الإعدادات، جاري التوجيه...',
                    goToSite: '🌐 الذهاب إلى موقع العرض'
                }
            };

            function t(key) { return translations[currentLang][key] || key; }

            // --- DOM ---
            const pageContent = document.getElementById('pageContent');
            const pageNum = document.getElementById('pageNum');
            const pageTotal = document.getElementById('pageTotal');
            const pageLabel = document.getElementById('pageLabel');
            const pageCounter = document.getElementById('pageCounter');
            const addBtn = document.getElementById('addPageBtn');
            const deleteBtn = document.getElementById('deletePageBtn');
            const printBtn = document.getElementById('printPageBtn');
            const downloadBtn = document.getElementById('downloadPageBtn');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            const imageUpload = document.getElementById('imageUpload');
            const bookView = document.getElementById('bookView');
            const saveExplicitBtn = document.getElementById('saveExplicitBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const toast = document.getElementById('toast');
            const settingsToggle = document.getElementById('settingsToggle');
            const bottomActions = document.getElementById('bottomActions');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const translateBadge = document.getElementById('translateBadge');
            const lockBtn = document.getElementById('lockBtn');
            const lockLabel = document.getElementById('lockLabel');
            const showSolutionTopBtn = document.getElementById('showSolutionTopBtn');
            const hideSolutionTopBtn = document.getElementById('hideSolutionTopBtn');
            const lightboxOverlay = document.getElementById('lightboxOverlay');
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxCloseBtn = document.getElementById('lightboxCloseBtn');
            const bookContainer = document.getElementById('bookContainer');
            const validateBtn = document.getElementById('validateBtn');

            const translatable = {
                uploadLabelText: document.getElementById('uploadLabelText'),
                addText: document.getElementById('addText'),
                deleteText: document.getElementById('deleteText'),
                prevText: document.getElementById('prevText'),
                nextText: document.getElementById('nextText'),
                printText: document.getElementById('printText'),
                downloadText: document.getElementById('downloadText'),
                saveText: document.getElementById('saveText'),
                clearText: document.getElementById('clearText'),
                validateText: document.getElementById('validateText')
            };

            // --- Toast ---
            let toastTimeout = null;
            function showToast(message, type = 'info') {
                if (toastTimeout) clearTimeout(toastTimeout);
                toast.className = 'toast';
                toast.textContent = message;
                if (type === 'success') toast.classList.add('success');
                else if (type === 'error') toast.classList.add('error');
                else if (type === 'info') toast.classList.add('info');
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3200);
            }

            // --- Progress ---
            function showProgress(percent) {
                progressBar.classList.add('active');
                progressFill.style.width = percent + '%';
                if (percent >= 100) {
                    setTimeout(() => {
                        progressBar.classList.remove('active');
                        progressFill.style.width = '0%';
                    }, 600);
                }
            }

            // --- LOCK ---
            const lockOverlay = document.getElementById('lockOverlay');
            const lockPassword = document.getElementById('lockPassword');
            const lockUnlockBtn = document.getElementById('lockUnlockBtn');
            const lockError = document.getElementById('lockError');

            function showLockOverlay() {
                lockOverlay.classList.add('active');
                lockPassword.value = '';
                lockError.classList.remove('show');
                lockPassword.focus();
                bookContainer.classList.add('locked-blur');
            }
            function hideLockOverlay() {
                lockOverlay.classList.remove('active');
                bookContainer.classList.remove('locked-blur');
                lockError.classList.remove('show');
            }
            function attemptUnlock() {
                const pwd = lockPassword.value.trim();
                if (pwd === PASSWORD) {
                    isLocked = false;
                    lockLabel.textContent = t('lock');
                    lockBtn.classList.remove('locked');
                    applyLockState(false);
                    hideLockOverlay();
                    renderCurrentPage();
                    sauvegarderEtat();
                    showToast(t('unlocked'), 'success');
                } else {
                    lockError.classList.add('show');
                    lockPassword.value = '';
                    lockPassword.focus();
                    showToast(t('wrongPassword'), 'error');
                }
            }

            // --- Langue ---
            function updateUILanguage() {
                pageLabel.textContent = t('pageLabel');
                pageCounter.textContent = `(${pages.length}/${MAX_PAGES})`;
                translatable.uploadLabelText.textContent = t('upload');
                translatable.addText.textContent = t('add');
                translatable.deleteText.textContent = t('delete');
                translatable.prevText.textContent = t('prev');
                translatable.nextText.textContent = t('next');
                translatable.printText.textContent = t('print');
                translatable.downloadText.textContent = t('download');
                translatable.saveText.textContent = t('save');
                translatable.clearText.textContent = t('clear');
                translatable.validateText.textContent = t('validate');
                translateBadge.textContent = t('translated');
                showSolutionTopBtn.textContent = t('showSolution');
                hideSolutionTopBtn.textContent = t('hideSolution');
                lockLabel.textContent = isLocked ? t('unlock') : t('lock');
                lockBtn.classList.toggle('locked', isLocked);
                const container = document.getElementById('bookContainer');
                if (currentLang === 'ar') {
                    container.classList.add('lang-ar');
                    container.style.direction = 'rtl';
                } else {
                    container.classList.remove('lang-ar');
                    container.style.direction = 'ltr';
                }
            }

            function setLanguage(lang) {
                if (lang === currentLang) return;
                currentLang = lang;
                updateLangButtons();
                updateUILanguage();
                renderCurrentPage();
                sauvegarderEtat();
            }
            function updateLangButtons() {
                document.querySelectorAll('.lang-switch button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === currentLang);
                });
            }

            // --- Verrouillage ---
            function toggleLock() {
                if (isLocked) {
                    showLockOverlay();
                } else {
                    isLocked = true;
                    lockLabel.textContent = t('unlock');
                    lockBtn.classList.add('locked');
                    applyLockState(true);
                    showLockOverlay();
                    renderCurrentPage();
                    sauvegarderEtat();
                    showToast(t('locked'), 'info');
                }
            }
            function applyLockState(locked) {
                if (locked) {
                    bookContainer.classList.add('locked-state');
                    const editButtons = bottomActions.querySelectorAll(
                        'button:not(.lock-btn):not(.btn-prev):not(.btn-next):not(.btn-print):not(.btn-download):not(.btn-save):not(.btn-validate)');
                    editButtons.forEach(btn => btn.disabled = true);
                    const uploadLabel = document.getElementById('uploadLabel');
                    if (uploadLabel) uploadLabel.style.pointerEvents = 'none';
                    const solUploadBtn = document.querySelector('.solution-image-container .upload-btn');
                    if (solUploadBtn) solUploadBtn.style.pointerEvents = 'none';
                    showSolutionTopBtn.style.pointerEvents = 'auto';
                    showSolutionTopBtn.style.opacity = '1';
                    hideSolutionTopBtn.style.pointerEvents = 'auto';
                    hideSolutionTopBtn.style.opacity = '1';
                    bookView.style.touchAction = 'none';
                } else {
                    bookContainer.classList.remove('locked-state');
                    const allButtons = bottomActions.querySelectorAll('button:not(.lock-btn)');
                    allButtons.forEach(btn => btn.disabled = false);
                    const uploadLabel = document.getElementById('uploadLabel');
                    if (uploadLabel) uploadLabel.style.pointerEvents = 'auto';
                    const solUploadBtn = document.querySelector('.solution-image-container .upload-btn');
                    if (solUploadBtn) solUploadBtn.style.pointerEvents = 'auto';
                    showSolutionTopBtn.style.pointerEvents = 'auto';
                    showSolutionTopBtn.style.opacity = '1';
                    hideSolutionTopBtn.style.pointerEvents = 'auto';
                    hideSolutionTopBtn.style.opacity = '1';
                    bookView.style.touchAction = 'none';
                }
                lockBtn.disabled = false;
            }

            // --- Solution ---
            function updateSolutionButtons() {
                if (solutionVisible) {
                    showSolutionTopBtn.style.display = 'none';
                    hideSolutionTopBtn.style.display = 'inline-flex';
                } else {
                    showSolutionTopBtn.style.display = 'inline-flex';
                    hideSolutionTopBtn.style.display = 'none';
                }
            }
            function toggleSolutionFromTop(show) {
                const page = pages[currentIndex];
                if (!page || currentIndex === 0) {
                    showToast('📖 La page de garde ne contient pas de solution.', 'info');
                    return;
                }
                solutionVisible = show;
                renderCurrentPage();
                updateSolutionButtons();
                showToast(solutionVisible ? t('solutionShown') : t('solutionHidden'), 'info');
                sauvegarderEtat();
            }

            // --- Gestion image de solution ---
            function handleSolutionImageUpload(file, pageIndex) {
                if (isLocked) { showToast('🔒 Carnet verrouillé', 'error'); return; }
                const page = pages[pageIndex];
                if (!page) return;
                if (!file || !file.type.startsWith('image/')) {
                    showToast(t('imageError'), 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    page.solution = `<img src="${base64}" class="solution-image" alt="Solution" />`;
                    sauvegarderEtat();
                    renderCurrentPage();
                    showToast('🖼️ Image de solution insérée', 'success');
                };
                reader.readAsDataURL(file);
            }

            // --- Lightbox ---
            function openLightbox(imgSrc) {
                if (!imgSrc) return;
                lightboxImage.src = imgSrc;
                lightboxOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
            function closeLightbox() {
                lightboxOverlay.classList.remove('open');
                document.body.style.overflow = '';
                lightboxImage.src = '';
            }
            window.appOpenLightbox = openLightbox;

            // ============================================================
            // RENDU
            // ============================================================
            function renderCurrentPage() {
                if (pages.length === 0) {
                    pageContent.innerHTML =
                        `<div class="empty-page-placeholder"><span>📭</span> ${t('noPages')}</div>`;
                    pageNum.textContent = '0';
                    pageTotal.textContent = '/ 0';
                    pageCounter.textContent = `(0/${MAX_PAGES})`;
                    translateBadge.classList.remove('active');
                    updateNavButtons();
                    updateSolutionButtons();
                    return;
                }

                const page = pages[currentIndex];
                pageNum.textContent = currentIndex + 1;
                pageTotal.textContent = `/ ${pages.length}`;
                pageCounter.textContent = `(${pages.length}/${MAX_PAGES})`;

                if (currentIndex === 0) {
                    page.isCover = true;
                    const coverImage = page.imagePath || DEFAULT_COVER;
                    pageContent.innerHTML = `
                            <div class="page-cover" onclick="window.appOpenLightbox('${coverImage}')">
                                <img src="${coverImage}" class="cover-main" alt="Page de garde" draggable="false" />
                                <div class="click-hint">🔍 ${t('clickToZoom')}</div>
                            </div>
                        `;
                    translateBadge.classList.remove('active');
                    updateNavButtons();
                    showSolutionTopBtn.style.display = 'none';
                    hideSolutionTopBtn.style.display = 'none';
                    if (isLocked) applyLockState(true);
                    else applyLockState(false);
                    return;
                }

                page.isCover = false;
                showSolutionTopBtn.style.display = 'inline-flex';
                updateSolutionButtons();

                const hasImage = page.imagePath && page.imagePath.length > 0;

                let exerciseHtml = '';
                if (hasImage) {
                    exerciseHtml = `
                            <img src="${page.imagePath}" class="full-page-image" alt="Exercice" draggable="false" onclick="window.appOpenLightbox('${page.imagePath}')" />
                            <div class="click-hint">🔍 ${t('clickToZoom')}</div>
                        `;
                } else {
                    exerciseHtml = `
                            <div class="image-placeholder">
                                <span>🖼️</span>
                                <div>${t('dropHint')}</div>
                                <div class="hint">${t('noImagePage')}</div>
                            </div>
                        `;
                }

                let solutionHtml = '';
                const hasSolution = page.solution && page.solution.includes('<img');
                if (hasSolution) {
                    solutionHtml = page.solution;
                } else {
                    solutionHtml = `<div class="placeholder">${t('solutionPlaceholder')}</div>`;
                }

                const solutionClass = solutionVisible ? '' : 'hidden';

                pageContent.innerHTML = `
                        <div class="exercise-zone">
                            ${exerciseHtml}
                        </div>
                        <div class="solution-zone-wrapper ${solutionClass}" id="solutionZoneWrapper">
                            <div class="solution-header">
                                <h4>💡 ${t('solutionTitle')}</h4>
                            </div>
                            <div class="solution-image-container" id="solutionImageContainer">
                                ${solutionHtml}
                                <label class="upload-btn" id="solutionUploadBtn" style="${isLocked ? 'pointer-events:none;opacity:0.5;' : ''}">
                                    <span>🖼️ ${t('changeImage')}</span>
                                    <input type="file" accept="image/*" id="solutionFileInput" ${isLocked ? 'disabled' : ''}>
                                </label>
                            </div>
                        </div>
                    `;

                const solutionFileInput = document.getElementById('solutionFileInput');
                if (solutionFileInput) {
                    solutionFileInput.addEventListener('change', function(e) {
                        if (isLocked) {
                            showToast('🔒 Carnet verrouillé', 'error');
                            this.value = '';
                            return;
                        }
                        const file = this.files[0];
                        if (file) {
                            handleSolutionImageUpload(file, currentIndex);
                        }
                        this.value = '';
                    });
                }

                const solutionImg = document.querySelector('.solution-image-container .solution-image');
                if (solutionImg) {
                    solutionImg.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const src = this.getAttribute('src');
                        if (src) openLightbox(src);
                    });
                }

                translateBadge.classList.remove('active');
                updateNavButtons();
                if (isLocked) applyLockState(true);
                else applyLockState(false);
            }

            function updateNavButtons() {
                if (pages.length === 0) { prevBtn.disabled = true; nextBtn.disabled = true; return; }
                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex === pages.length - 1);
            }

            // --- Gestion pages ---
            function addNewPage() {
                if (isLocked) { showToast('🔒 Carnet verrouillé', 'error'); return; }
                if (pages.length >= MAX_PAGES) {
                    showToast(t('maxPages'), 'error');
                    return;
                }
                pages.push({ content: '', solution: '', imagePath: null, isCover: false });
                currentIndex = pages.length - 1;
                solutionVisible = false;
                renderCurrentPage();
                updateSolutionButtons();
                sauvegarderEtat();
                showToast('➕ Page ajoutée', 'success');
            }

            function deleteCurrentPage() {
                if (isLocked) { showToast('🔒 Carnet verrouillé', 'error'); return; }
                if (pages.length === 0) return;
                if (currentIndex === 0) {
                    showToast('📖 La page de garde ne peut pas être supprimée.', 'info');
                    return;
                }
                if (!confirm(t('confirmDelete'))) return;
                pages.splice(currentIndex, 1);
                if (currentIndex >= pages.length) currentIndex = pages.length - 1;
                solutionVisible = false;
                renderCurrentPage();
                updateSolutionButtons();
                sauvegarderEtat();
                showToast('🗑️ Page supprimée', 'success');
            }

            function goToPrev() {
                if (pages.length === 0 || currentIndex === 0) return;
                currentIndex--;
                solutionVisible = false;
                renderCurrentPage();
                updateSolutionButtons();
            }
            function goToNext() {
                if (pages.length === 0 || currentIndex === pages.length - 1) return;
                currentIndex++;
                solutionVisible = false;
                renderCurrentPage();
                updateSolutionButtons();
            }

            // --- Upload image ---
            function handleImageUpload(event) {
                if (isLocked) { showToast('🔒 Carnet verrouillé', 'error'); imageUpload.value = ''; return; }
                const file = event.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    showToast(t('imageError'), 'error');
                    imageUpload.value = '';
                    return;
                }

                if (currentIndex === 0) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const page = pages[0];
                        if (page) {
                            page.imagePath = e.target.result;
                            page.isCover = true;
                            sauvegarderEtat();
                            renderCurrentPage();
                            showToast('🖼️ Image de couverture mise à jour', 'success');
                        }
                    };
                    reader.readAsDataURL(file);
                    imageUpload.value = '';
                    return;
                }

                showProgress(20);
                const maxSize = 30 * 1024 * 1024;
                if (file.size > maxSize) {
                    showToast('⚠️ Image trop volumineuse (max 30MB)', 'error');
                    imageUpload.value = '';
                    showProgress(0);
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        showProgress(50);
                        const base64 = e.target.result;
                        if (!base64 || !base64.startsWith('data:image')) {
                            showToast(t('readError'), 'error');
                            imageUpload.value = '';
                            showProgress(0);
                            return;
                        }
                        showProgress(90);
                        if (pages.length === 0) {
                            pages.push({ content: '', solution: '', imagePath: base64, isCover: false });
                            currentIndex = 0;
                        } else {
                            pages[currentIndex].imagePath = base64;
                            pages[currentIndex].isCover = false;
                        }
                        renderCurrentPage();
                        sauvegarderEtat();
                        imageUpload.value = '';
                        showProgress(100);
                        showToast('🖼️ Image insérée (qualité originale)', 'success');
                    } catch (err) {
                        showToast(t('readError'), 'error');
                        imageUpload.value = '';
                        showProgress(0);
                    }
                };
                reader.onerror = function() {
                    showToast(t('readError'), 'error');
                    imageUpload.value = '';
                    showProgress(0);
                };
                reader.readAsDataURL(file);
            }

            // --- Print / Download ---
            function printCurrentPage() { window.print(); }

            function downloadCurrentPage() {
                if (pages.length === 0) { showToast(t('noPage'), 'error'); return; }
                const page = pages[currentIndex];
                if (!page || (!page.imagePath && !page.solution && !page.isCover)) {
                    showToast(t('noImage'), 'info');
                    return;
                }

                let bodyContent = '';
                if (currentIndex === 0) {
                    const imgSrc = page.imagePath || DEFAULT_COVER;
                    bodyContent = `
                            <div style="width:21cm;height:29.7cm;margin:0;padding:0;display:flex;justify-content:center;align-items:center;background:white;overflow:hidden;">
                                <img src="${imgSrc}" style="width:100%;height:100%;object-fit:contain;" />
                            </div>
                        `;
                } else {
                    const hasSolution = page.solution && page.solution.includes('<img');
                    const solHtml = hasSolution ? page.solution :
                        `<p style="color:#999;font-style:italic;text-align:center;">${t('noSolution')}</p>`;

                    const hasImage = page.imagePath && page.imagePath.length > 0;
                    const imgHtml = hasImage ?
                        `<img src="${page.imagePath}" style="width:100%;height:100%;object-fit:contain;display:block;border:none;border-radius:0;" />` :
                        `<div style="width:100%;height:100%;display:flex;justify-content:center;align-items:center;color:#c5d0e0;font-size:1.2rem;font-style:italic;">${t('noImagePage')}</div>`;

                    bodyContent = `
                            <div style="width:21cm;min-height:29.7cm;margin:0 auto;padding:0;background:white;display:flex;flex-direction:column;box-sizing:border-box;font-family:system-ui,sans-serif;">
                                <div style="padding:0;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;">
                                    ${imgHtml}
                                </div>
                                <div style="padding:12px 16px;flex:0 0 auto;background:white;border-top:1px solid #e0e0e0;">
                                    <h4 style="color:#6d28d9;font-size:1rem;margin-bottom:8px;font-weight:700;">💡 ${t('solutionTitle')}</h4>
                                    <div style="display:flex;justify-content:center;align-items:center;">
                                        ${solHtml}
                                    </div>
                                </div>
                            </div>
                        `;
                }

                const htmlContent = `
                        <!DOCTYPE html>
                        <html>
                        <head><meta charset="UTF-8"><title>Page ${currentIndex+1}</title>
                        <style>
                            * { margin:0; padding:0; box-sizing:border-box; }
                            body { background:white; margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:system-ui,sans-serif; }
                            @page { margin:0; size:A4; }
                            .download-a4 { width:21cm; min-height:29.7cm; margin:0 auto; padding:0; background:white; display:flex; flex-direction:column; box-sizing:border-box; font-family:system-ui,sans-serif; }
                            .download-a4 .exercise-zone { padding:0; flex:1; border-bottom:none; background:white; display:flex; align-items:center; justify-content:center; overflow:hidden; }
                            .download-a4 .exercise-zone img { width:100%; height:100%; object-fit:contain; display:block; border:none; border-radius:0; }
                            .download-a4 .solution-zone-wrapper { padding:12px 16px; flex:0 0 auto; background:white; border-top:1px solid #e0e0e0; }
                            .download-a4 .solution-zone-wrapper img { max-width:100%; max-height:45vh; object-fit:contain; display:block; margin:0 auto; border:none; border-radius:8px; }
                            .download-a4 .solution-zone-wrapper .placeholder { color:#c5d0e0; font-style:italic; text-align:center; }
                            .download-a4 .solution-header h4 { color:#6d28d9; font-size:1rem; margin-bottom:8px; font-weight:700; }
                            .cover-a4 { width:21cm; height:29.7cm; margin:0; padding:0; display:flex; justify-content:center; align-items:center; background:white; overflow:hidden; }
                            .cover-a4 img { width:100%; height:100%; object-fit:contain; }
                            .upload-btn, .click-hint { display:none !important; }
                        </style>
                        </head>
                        <body>
                            ${currentIndex === 0 ? `<div class="cover-a4"><img src="${page.imagePath || DEFAULT_COVER}" /></div>` : bodyContent}
                        </body>
                        </html>
                    `;

                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `page-${currentIndex+1}-A4.html`;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('⬇️ Téléchargement A4 démarré', 'success');
            }

            // --- Vider tout ---
            async function clearAllPages() {
                if (isLocked) { showToast('🔒 Carnet verrouillé', 'error'); return; }
                if (pages.length === 0 || (pages.length === 1 && !pages[0].content && !pages[0].imagePath && !pages[0].solution)) {
                    showToast('📭 Aucune page à supprimer', 'info');
                    return;
                }
                if (!confirm(t('clearConfirm'))) return;
                try {
                    showProgress(20);
                    await storage.clear();
                    showProgress(50);
                    pages = [{ content: '', solution: '', imagePath: null, isCover: true }];
                    currentIndex = 0;
                    solutionVisible = false;
                    localStorage.removeItem('carnetMeta_100_v5');
                    localStorage.removeItem('bookData_100_v5');
                    renderCurrentPage();
                    updateUILanguage();
                    updateSolutionButtons();
                    showProgress(100);
                    showToast(t('cleared'), 'success');
                } catch (e) {
                    console.error('Erreur lors du vidage:', e);
                    showToast(t('saveError'), 'error');
                    showProgress(0);
                }
            }

            // --- Sauvegarde ---
            async function sauvegarderEtat() {
                if (isSaving) return;
                isSaving = true;
                try {
                    showProgress(20);
                    await storage.savePages(pages);
                    showProgress(70);
                    const meta = {
                        currentIndex: currentIndex,
                        lang: currentLang,
                        pageCount: pages.length,
                        isLocked: isLocked,
                        solutionVisible: solutionVisible,
                        timestamp: Date.now()
                    };
                    localStorage.setItem('carnetMeta_100_v5', JSON.stringify(meta));
                    showProgress(100);
                    console.log('💾 Sauvegarde IndexedDB OK (' + pages.length + ' pages)');
                } catch (e) {
                    console.error('❌ Erreur sauvegarde:', e);
                    try {
                        localStorage.setItem('bookData_100_v5', JSON.stringify({
                            pages: pages,
                            currentIndex: currentIndex,
                            lang: currentLang,
                            isLocked: isLocked,
                            solutionVisible: solutionVisible
                        }));
                        console.log('💾 Sauvegarde fallback localStorage');
                    } catch (e2) {
                        showToast(t('saveError'), 'error');
                    }
                }
                isSaving = false;
            }

            async function sauvegarderExplicite() {
                showToast(t('saving'), 'info');
                await sauvegarderEtat();
                showToast(t('saved'), 'success');
            }

            // --- VALIDER : sauvegarde + redirection ---
            function validateAndRedirect() {
                sauvegarderExplicite();
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            }

            // --- Charger ---
            async function loadState() {
                try {
                    const pagesFromDB = await storage.loadPages();
                    if (pagesFromDB && pagesFromDB.length > 0) {
                        pages = pagesFromDB;
                        const meta = localStorage.getItem('carnetMeta_100_v5');
                        if (meta) {
                            const parsed = JSON.parse(meta);
                            currentIndex = (parsed.currentIndex !== undefined && parsed.currentIndex < pages.length) ?
                                parsed.currentIndex : 0;
                            if (parsed.lang) currentLang = parsed.lang;
                            if (parsed.isLocked !== undefined) isLocked = parsed.isLocked;
                            if (parsed.solutionVisible !== undefined) solutionVisible = parsed.solutionVisible;
                        }
                        if (pages.length > 0) pages[0].isCover = true;
                        if (pages.length === 0) {
                            pages = [{ content: '', solution: '', imagePath: null, isCover: true }];
                            currentIndex = 0;
                        }
                        updateLangButtons();
                        updateUILanguage();
                        if (isLocked) {
                            lockLabel.textContent = t('unlock');
                            lockBtn.classList.add('locked');
                            applyLockState(true);
                            showLockOverlay();
                        } else {
                            lockLabel.textContent = t('lock');
                            lockBtn.classList.remove('locked');
                            applyLockState(false);
                            hideLockOverlay();
                        }
                        renderCurrentPage();
                        updateSolutionButtons();
                        console.log('✅ Chargé depuis IndexedDB (' + pages.length + ' pages)');
                        return true;
                    }

                    const raw = localStorage.getItem('bookData_100_v5');
                    if (raw) {
                        const data = JSON.parse(raw);
                        if (data.pages && Array.isArray(data.pages) && data.pages.length > 0) {
                            pages = data.pages;
                            currentIndex = (data.currentIndex !== undefined && data.currentIndex < pages.length) ?
                                data.currentIndex : 0;
                            if (data.lang) currentLang = data.lang;
                            if (data.isLocked !== undefined) isLocked = data.isLocked;
                            if (data.solutionVisible !== undefined) solutionVisible = data.solutionVisible;
                            if (pages.length > 0) pages[0].isCover = true;
                            await storage.savePages(pages);
                            localStorage.setItem('carnetMeta_100_v5', JSON.stringify({
                                currentIndex: currentIndex,
                                lang: currentLang,
                                pageCount: pages.length,
                                isLocked: isLocked,
                                solutionVisible: solutionVisible,
                                timestamp: Date.now()
                            }));
                            updateLangButtons();
                            updateUILanguage();
                            if (isLocked) {
                                lockLabel.textContent = t('unlock');
                                lockBtn.classList.add('locked');
                                applyLockState(true);
                                showLockOverlay();
                            } else {
                                lockLabel.textContent = t('lock');
                                lockBtn.classList.remove('locked');
                                applyLockState(false);
                                hideLockOverlay();
                            }
                            renderCurrentPage();
                            updateSolutionButtons();
                            console.log('✅ Migré depuis localStorage (' + pages.length + ' pages)');
                            return true;
                        }
                    }
                    return false;
                } catch (e) {
                    console.warn('⚠️ Erreur chargement:', e);
                    return false;
                }
            }

            // --- Menu ---
            function toggleMenu() {
                menuOpen = !menuOpen;
                bottomActions.classList.toggle('open', menuOpen);
                settingsToggle.classList.toggle('active', menuOpen);
            }

            // --- Swipe ---
            let startX = 0, isSwiping = false;
            function handleTouchStart(e) { const touch = e.touches[0]; startX = touch.clientX; isSwiping = true; }
            function handleTouchEnd(e) {
                if (!isSwiping) return;
                isSwiping = false;
                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;
                if (Math.abs(diff) > 50) { diff > 0 ? goToNext() : goToPrev(); }
            }
            let mouseDown = false, mouseStartX = 0;
            function handleMouseDown(e) { mouseDown = true; mouseStartX = e.clientX; bookView.style.cursor = 'grabbing'; }
            function handleMouseUp(e) {
                if (!mouseDown) return;
                mouseDown = false; bookView.style.cursor = 'default';
                const diff = mouseStartX - e.clientX;
                if (Math.abs(diff) > 50) { diff > 0 ? goToNext() : goToPrev(); }
            }
            function handlePageClick(e) {
                if (e.target.closest('button') || e.target.closest('label') || e.target.closest('.lang-switch')) return;
                toggleMenu();
            }

            // --- Init ---
            async function initBook() {
                const loaded = await loadState();
                if (!loaded) {
                    pages = [{ content: '', solution: '', imagePath: null, isCover: true }];
                    currentIndex = 0;
                    isLocked = false;
                    solutionVisible = false;
                    renderCurrentPage();
                    updateSolutionButtons();
                    await storage.savePages(pages);
                }
                updateUILanguage();

                if (lockOverlay.classList.contains('active')) {
                    lockPassword.focus();
                }

                bookView.addEventListener('touchstart', handleTouchStart, { passive: true });
                bookView.addEventListener('touchend', handleTouchEnd, { passive: true });
                bookView.addEventListener('mousedown', handleMouseDown);
                bookView.addEventListener('mouseup', handleMouseUp);
                bookView.addEventListener('mouseleave', () => { if (mouseDown) { mouseDown = false; bookView.style.cursor = 'default'; } });
                bookView.addEventListener('click', handlePageClick);

                showSolutionTopBtn.addEventListener('click', function() { toggleSolutionFromTop(true); });
                hideSolutionTopBtn.addEventListener('click', function() { toggleSolutionFromTop(false); });

                lockBtn.addEventListener('click', toggleLock);
                lockUnlockBtn.addEventListener('click', attemptUnlock);
                lockPassword.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); attemptUnlock(); }
                });

                validateBtn.addEventListener('click', validateAndRedirect);

                lightboxCloseBtn.addEventListener('click', closeLightbox);
                lightboxOverlay.addEventListener('click', function(e) {
                    if (e.target === this) closeLightbox();
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') closeLightbox();
                });

                const stats = await storage.getStats();
                console.log('📊 Statistiques:', stats);
            }

            function bindEvents() {
                addBtn.addEventListener('click', addNewPage);
                deleteBtn.addEventListener('click', deleteCurrentPage);
                printBtn.addEventListener('click', printCurrentPage);
                downloadBtn.addEventListener('click', downloadCurrentPage);
                prevBtn.addEventListener('click', goToPrev);
                nextBtn.addEventListener('click', goToNext);
                imageUpload.addEventListener('change', handleImageUpload);
                clearAllBtn.addEventListener('click', clearAllPages);

                document.getElementById('langFr').addEventListener('click', () => setLanguage('fr'));
                document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));
                document.getElementById('langAr').addEventListener('click', () => setLanguage('ar'));

                saveExplicitBtn.addEventListener('click', sauvegarderExplicite);
                settingsToggle.addEventListener('click', toggleMenu);
            }

            initBook();
            bindEvents();
            console.log('📖 Appixo Book · Paramètres v2.3 · Mobile-friendly');
        })();
    </script>
</body>
</html>
