<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Appixo Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================================
    ÉCRAN DE CONNEXION
    ============================================================ -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-main">Appixo</span>
                <span class="logo-sub">Book</span>
            </div>
            <div class="login-icon">🔒</div>
            <h2 class="login-title">Accès sécurisé</h2>
            <p class="login-desc">Entrez le mot de passe pour accéder au carnet</p>
            <div class="login-input-group">
                <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password">
                <button class="login-btn" id="loginBtn">Déverrouiller</button>
            </div>
            <p class="login-error" id="loginError">❌ Mot de passe incorrect</p>
            <div class="login-footer">Appixo Book &bull; v3.0</div>
        </div>
    </div>

    <!-- ============================================================
    APPLICATION (visible après connexion)
    ============================================================ -->
    <div class="app-container" id="appContainer">

        <!-- TOP BAR -->
        <header class="top-bar">
            <div class="top-bar-left">
                <div class="page-indicator">
                    <span class="num" id="pageNum">1</span>
                    <span class="total" id="pageTotal">/ 1</span>
                    <span class="label" id="pageLabel">Page</span>
                    <span class="counter" id="pageCounter">(0/100)</span>
                </div>
            </div>
            <div class="lang-switch">
                <button class="active" data-lang="fr" id="langFr">🇫🇷</button>
                <button data-lang="en" id="langEn">🇬🇧</button>
                <button data-lang="ar" id="langAr">🇸🇦</button>
            </div>
        </header>

        <!-- VIEWER -->
        <main class="book-view" id="bookView">
            <div class="page-content" id="pageContent">
                <div class="placeholder-empty">
                    <span>📖</span>
                    <p>Chargement...</p>
                </div>
            </div>
        </main>

        <!-- BOTTOM ACTIONS -->
        <footer class="bottom-actions" id="bottomActions">
            <button class="btn-prev" id="prevBtn"><span>◀</span><span class="label">Préc.</span></button>
            <button class="btn-next" id="nextBtn"><span>▶</span><span class="label">Suiv.</span></button>

            <span class="separator"></span>

            <button class="btn-add" id="addBtn"><span>➕</span><span class="label">Ajouter</span></button>
            <button class="btn-save" id="saveBtn"><span>💾</span><span class="label">Sauver</span></button>

            <span class="separator"></span>

            <button class="btn-download" id="downloadBtn"><span>⬇️</span><span class="label">Téléch.</span></button>
            <button class="btn-print" id="printBtn"><span>🖨️</span><span class="label">Imprimer</span></button>

            <span class="separator"></span>

            <button class="btn-lock" id="lockBtn"><span>🔒</span><span class="label">Verrouiller</span></button>
        </footer>
    </div>

    <!-- ============================================================
    TOAST (notifications)
    ============================================================ -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================
    LIGHTBOX (zoom image)
    ============================================================ -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <img id="lightboxImg" src="" alt="Agrandissement">
    </div>

    <script src="script.js"></script>
</body>
</html>
